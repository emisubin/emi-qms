<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>오산 진행 단계 · 디자인 시안</title><style>:root {
  --z-sticky: 10;
  --z-modal-overlay: 1000;
  --z-modal: 1010;
  --auth-brand: #da2127;
  --auth-brand-glow: #ff6969;
  --auth-ink: #282828;
  --auth-muted: #737373;
  --brand-red: #da2127;
  --brand-red-strong: #b8141a;
  --brand-red-deep: #8f0f14;
  --brand-red-soft: #fff1f2;
  --brand-red-wash: #fff7f7;
  --surface: #ffffff;
  --surface-subtle: #faf9fa;
  --canvas: #f5f3f4;
  --ink: #282828;
  --muted: #737373;
  --line: #e7e1e2;
  --line-strong: #d8ced0;
  --shadow-soft: 0 18px 48px rgb(67 28 30 / 9%);
  --shadow-card: 0 8px 24px rgb(67 28 30 / 7%);
  --radius-shell: 28px;
  --radius-card: 18px;
  --radius-control: 12px;
  color: var(--ink);
  background: var(--canvas);
  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

/* TASK-OSAN-ACCESS-001 Change 003: compact integrated user-access rows. */
.panel-section .business-unit-access-table-scroll {
  width: 100%;
  border: 1px solid #e1e8e3;
  border-radius: 6px;
}

.panel-section .table-scroll.business-unit-access-table-scroll .business-unit-access-table {
  min-width: 1000px;
  table-layout: auto;
}

.panel-section .table-scroll.business-unit-access-table-scroll .business-unit-access-table th,
.panel-section .table-scroll.business-unit-access-table-scroll .business-unit-access-table td {
  padding: 4px 8px;
  vertical-align: middle;
}

.panel-section .table-scroll.business-unit-access-table-scroll .business-unit-access-table thead th:first-child {
  width: 210px;
}

.panel-section .table-scroll.business-unit-access-table-scroll .business-unit-access-table thead th:nth-child(2),
.panel-section .table-scroll.business-unit-access-table-scroll .business-unit-access-table thead th:nth-child(6),
.panel-section .table-scroll.business-unit-access-table-scroll .business-unit-access-table thead th:nth-child(7) {
  width: 76px;
  text-align: center;
}

.panel-section .table-scroll.business-unit-access-table-scroll .business-unit-access-table thead th:nth-child(3) {
  width: 112px;
}

.panel-section .table-scroll.business-unit-access-table-scroll .business-unit-access-table thead th:last-child {
  width: 72px;
}

.business-unit-access-row:hover {
  background: #fbfdfb;
}

.business-unit-user-cell {
  max-width: 210px;
  font-weight: 400;
}

.business-unit-user-primary {
  display: flex;
  min-width: 0;
  align-items: center;
  gap: 6px;
}

.business-unit-user-primary strong,
.business-unit-user-cell small,
.business-unit-role-readonly {
  display: block;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.business-unit-user-primary strong {
  flex: 1;
  color: #17201b;
  font-size: 0.82rem;
}

.business-unit-user-primary > span {
  flex: none;
  color: #52665a;
  font-size: 0.68rem;
  font-weight: 800;
}

.business-unit-user-cell small {
  margin-top: 1px;
  color: #6b766f;
  font-size: 0.7rem;
  font-weight: 500;
}

.app-shell .business-unit-access-table select,
.app-shell .business-unit-access-table button {
  min-height: 32px;
  padding: 4px 8px;
  font-size: 0.78rem;
  box-shadow: none;
}

.app-shell .business-unit-access-table input[type='checkbox'] {
  width: 16px;
  min-height: 16px;
  height: 16px;
  margin: 0;
  padding: 0;
}

.business-unit-checkbox-cell {
  text-align: center !important;
}

.business-unit-role-readonly {
  max-width: 180px;
  color: #39465a;
  font-size: 0.76rem;
}

.business-unit-access-action-cell {
  text-align: right !important;
}

.business-unit-access-feedback-row td {
  padding: 3px 8px 5px 218px !important;
  background: #fffaf0;
  color: #8a4b0f;
  font-size: 0.72rem;
  line-height: 1.25;
}

@media (max-width: 780px) {
  .panel-section .business-unit-access-table-scroll {
    overscroll-behavior-inline: contain;
  }

  .panel-section .table-scroll.business-unit-access-table-scroll .business-unit-access-table {
    min-width: 960px;
    font-size: 0.72rem;
  }

  .app-shell[data-layout-mode='mobile'] .business-unit-access-table select,
  .app-shell[data-layout-mode='mobile'] .business-unit-access-table button {
    min-height: 32px;
    padding: 4px 7px;
    font-size: 0.72rem;
  }

  .app-shell[data-layout-mode='mobile'] .business-unit-access-table input[type='checkbox'] {
    min-height: 16px;
  }
}

.business-unit-selector {
  display: grid;
  gap: 0.25rem;
  min-width: 9rem;
  color: var(--text-secondary, #5b6472);
  font-size: 0.75rem;
  font-weight: 700;
}

.business-unit-selector select {
  min-height: 2.4rem;
  padding: 0.45rem 2rem 0.45rem 0.7rem;
  border: 1px solid var(--border-color, #d8dde5);
  border-radius: 0.65rem;
  background: var(--surface, #fff);
  color: var(--text-primary, #172033);
}

.business-unit-selector small {
  max-width: 14rem;
  color: #9b4b17;
  font-weight: 500;
}

.business-unit-selector--compact {
  min-width: 6.5rem;
}

.business-unit-selector--compact > span,
.business-unit-selector--compact small {
  display: none;
}

.business-unit-choice-list,
.auth-gate-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 0.65rem;
  margin-top: 1rem;
}

.osan-area-placeholder {
  min-height: 20rem;
}

/* TASK-PANEL-DESIGN-001: existing monochrome wireframe language, without accent rails. */
.panel-required-guide {
  display: grid;
  grid-template-columns: max-content minmax(0, 1fr) minmax(0, 1fr);
  align-items: center;
  gap: 8px 18px;
  margin: 10px 0 14px;
  border-top: 1px solid #d9d9de;
  border-bottom: 1px solid #d9d9de;
  padding: 12px 2px;
  color: #4d4c54;
  font-size: 0.78rem;
}

.panel-required-guide strong {
  color: #171717;
  font-size: 0.84rem;
}

.panel-required-guide small {
  grid-column: 1 / -1;
  color: #74737c;
}

.panel-group-toolbar {
  display: flex;
  min-height: 42px;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: 0 0 10px;
  border: 1px solid #d9d9de;
  border-radius: 7px;
  background: #ffffff;
  padding: 7px 9px;
}

.panel-group-toolbar > span {
  color: #55545d;
  font-size: 0.76rem;
  font-weight: 750;
}

.panel-group-toolbar > div {
  display: flex;
  gap: 6px;
}

.panel-info-table-head,
.panel-info-table-row {
  grid-template-columns: 50px 70px minmax(142px, 1.15fr) minmax(130px, 1fr) repeat(3, minmax(72px, 0.58fr)) minmax(145px, 1fr) minmax(88px, 0.7fr) minmax(78px, 0.62fr);
  min-width: 1130px;
}

.panel-select-cell {
  display: grid;
  place-items: center;
}

.panel-select-cell input,
.panel-mobile-selection input {
  width: 16px;
  height: 16px;
  margin: 0;
  accent-color: #171717;
}

.panel-size-heading,
.panel-mobile-size-heading,
.panel-mobile-selection {
  display: flex;
  align-items: center;
  gap: 6px;
}

.panel-mobile-selection {
  color: #55545d;
  font-size: 0.76rem;
  font-weight: 750;
}

.panel-mobile-size-heading {
  margin-top: 4px;
}

.panel-size-info-tip {
  position: relative;
  display: inline-grid;
  place-items: center;
}

.panel-size-info-tip > button {
  display: grid;
  width: 18px;
  min-width: 18px;
  height: 18px;
  min-height: 18px;
  place-items: center;
  border: 1px solid #77777f;
  border-radius: 50%;
  background: #ffffff;
  padding: 0;
  color: #3f3e45;
  font: 800 0.68rem/1 inherit;
}

.panel-size-info-tip > span {
  position: absolute;
  top: calc(100% + 7px);
  left: 50%;
  z-index: calc(var(--z-sticky) + 1);
  display: none;
  width: 270px;
  transform: translateX(-50%);
  border: 1px solid #252525;
  border-radius: 6px;
  background: #ffffff;
  padding: 9px 10px;
  color: #202020;
  font-size: 0.72rem;
  font-weight: 650;
  line-height: 1.45;
  box-shadow: 0 4px 12px rgb(0 0 0 / 8%);
}

.panel-size-info-tip:hover > span,
.panel-size-info-tip:focus-within > span {
  display: block;
}

.panel-group-cell {
  color: #333239;
  font-size: 0.72rem;
  font-weight: 760;
  line-height: 1.35;
}

.product-panel-table-head,
.product-panel-row {
  grid-template-columns: 60px minmax(138px, 1.05fr) minmax(125px, 0.95fr) minmax(170px, 1.1fr) minmax(98px, 0.72fr) minmax(88px, 0.66fr) minmax(112px, 0.82fr);
  min-width: 930px;
}

.panel-info-section .excel-preview-table .excel-preview-row {
  grid-template-columns: 68px 76px minmax(130px, 1fr) minmax(120px, 0.9fr) minmax(150px, 1.05fr) 90px minmax(120px, 1fr);
  min-width: 860px;
}

.product-panel-group {
  display: grid;
  gap: 6px;
  border: 2px solid #202020;
  border-radius: 8px;
  background: #ffffff;
  padding: 7px;
}

.product-panel-group-summary {
  display: grid;
  grid-template-columns: max-content minmax(0, 1fr) max-content;
  align-items: center;
  gap: 8px 16px;
  border-bottom: 1px solid #d5d5da;
  padding: 3px 4px 9px;
  color: #35343b;
  font-size: 0.76rem;
}

.product-panel-group-summary strong {
  color: #171717;
  font-size: 0.82rem;
}

.product-panel-group-summary small {
  grid-column: 1 / -1;
  color: #73727b;
}

.product-panel-group .product-panel-row {
  border-color: #d5d5da;
  box-shadow: none;
}

.product-panel-group-mobile {
  gap: 8px;
}

@media (max-width: 700px) {
  .panel-required-guide {
    grid-template-columns: 1fr;
    gap: 6px;
  }

  .panel-required-guide small {
    grid-column: auto;
  }

  .panel-group-toolbar {
    display: grid;
  }

  .panel-group-toolbar > div {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .panel-group-toolbar button {
    width: 100%;
  }

  .panel-size-info-tip > span {
    right: 0;
    left: auto;
    width: min(250px, calc(100vw - 56px));
    transform: none;
  }

  .product-panel-group-summary {
    grid-template-columns: 1fr;
    gap: 4px;
  }

  .product-panel-group-summary small {
    grid-column: auto;
  }
}

/* TASK-G2-OPERATIONS-001 */
.g2-page {
  display: grid;
  gap: 18px;
}

.g2-card {
  min-width: 0;
  border: 1px solid var(--line);
  border-radius: var(--radius-card);
  background: var(--surface);
  padding: 18px;
  box-shadow: var(--shadow-card);
}

.g2-card > header,
.g2-dialog > header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 12px;
}

.g2-card h3,
.g2-dialog h3 {
  margin: 0;
}

.g2-month-controls,
.g2-marker-actions,
.g2-chart-legend,
.g2-live-totals {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.g2-chart-wrap {
  min-width: 0;
  border: 1px solid #dbe6f2;
  border-radius: 18px;
  background: linear-gradient(145deg, #f8fbff 0%, #fff 54%, #fdf7ff 100%);
  padding: 14px;
  overflow: visible;
}

.g2-chart-card {
  border-color: #d9e4f0;
  background: linear-gradient(180deg, #fff 0%, #fbfdff 100%);
  box-shadow: 0 16px 38px rgb(54 79 112 / 10%);
}

.g2-chart-card > header h3 { color: #172033; }

.g2-chart-dashboard {
  display: grid;
  grid-template-columns: minmax(720px, 1fr) 208px;
  gap: 14px;
  align-items: stretch;
}

.g2-chart-dashboard > .g2-chart-wrap { min-width: 720px; }

.g2-chart-kpis {
  display: grid;
  align-content: start;
  gap: 10px;
}

.g2-chart-kpi {
  position: relative;
  display: grid;
  min-height: 74px;
  align-content: center;
  gap: 7px;
  overflow: visible;
  border: 1px solid #dbe6f2;
  border-radius: 14px;
  background: linear-gradient(145deg, #f7fbff, #edf6ff);
  padding: 12px 13px;
  box-shadow: 0 8px 20px rgb(51 65 85 / 7%);
}

.g2-chart-kpi[data-tone='orange'] { background: linear-gradient(145deg, #fffaf5, #fff1e5); }
.g2-chart-kpi[data-tone='red'] { background: linear-gradient(145deg, #fff9f9, #fff0f0); }
.g2-chart-kpi[data-tone='violet'] { background: linear-gradient(145deg, #fbfaff, #f3efff); }
.g2-chart-kpi[data-tone='morning'] { background: linear-gradient(145deg, #bfdbfe, #dbeafe); }
.g2-chart-kpi[data-tone='afternoon'] { background: linear-gradient(145deg, #60a5fa, #93c5fd); }

.g2-chart-kpi-label {
  display: flex;
  align-items: center;
  gap: 5px;
  color: #5b6b82;
  font-size: 0.72rem;
  font-weight: 850;
  line-height: 1.35;
}

.g2-chart-kpi > strong {
  color: #172033;
  font-size: 1.22rem;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}

.g2-kpi-info {
  position: relative;
  display: inline-grid;
  width: 17px;
  height: 17px;
  flex: 0 0 17px;
  place-items: center;
  border: 1px solid #94a3b8;
  border-radius: 50%;
  color: #64748b;
  font-size: 0.66rem;
  font-weight: 950;
  line-height: 1;
  cursor: default;
}

.g2-kpi-info:focus-visible { outline: 2px solid #60a5fa; outline-offset: 2px; }

.g2-kpi-tooltip {
  position: absolute;
  z-index: 5;
  top: calc(100% + 7px);
  right: -9px;
  display: none;
  width: 220px;
  border: 1px solid #cbd5e1;
  border-radius: 10px;
  background: rgb(255 255 255 / 98%);
  padding: 9px 10px;
  box-shadow: 0 10px 28px rgb(15 23 42 / 16%);
  color: #334155;
  font-size: 0.72rem;
  font-weight: 750;
  line-height: 1.45;
}

.g2-kpi-info:hover .g2-kpi-tooltip,
.g2-kpi-info:focus .g2-kpi-tooltip { display: block; }

.g2-chart-kpi[data-tone='violet'] .g2-kpi-info { position: static; }

.g2-chart-kpi[data-tone='violet'] .g2-kpi-tooltip {
  z-index: 10;
  inset: 6px;
  width: auto;
  place-items: center;
  border-color: #a78bfa;
  background: #f5f3ff;
  padding: 8px 10px;
  box-shadow: 0 8px 20px rgb(76 29 149 / 18%);
  color: #4c1d95;
  line-height: 1.35;
  pointer-events: none;
}

.g2-chart-kpi[data-tone='violet'] .g2-kpi-info:hover .g2-kpi-tooltip,
.g2-chart-kpi[data-tone='violet'] .g2-kpi-info:focus .g2-kpi-tooltip {
  display: grid;
}

.g2-chart {
  display: block;
  width: 100%;
  min-width: 0;
  max-width: 1180px;
  height: auto;
  margin: 0 auto;
}

.g2-chart-scroll {
  min-width: 0;
  overflow: visible;
}

.g2-chart-scroll:focus-visible {
  outline: 2px solid #60a5fa;
  outline-offset: 3px;
}

.g2-mobile-chart-frame-svg { display: none; }

.g2-axis,
.g2-grid,
.g2-bar,
.g2-line,
.g2-line-hit,
.g2-line-point,
.g2-physical-marker { vector-effect: non-scaling-stroke; }
.g2-plot-background { fill: rgb(255 255 255 / 88%); stroke: #dfe8f2; stroke-width: 1; }
.g2-axis { stroke: #8794a8; stroke-width: 1.2; }
.g2-baseline { stroke: #64748b; stroke-width: 2.2; }
.g2-grid { stroke: #c5d1df; stroke-width: 1.2; stroke-dasharray: 3 5; }
.g2-axis-title { fill: #25334c; font-size: 12px; font-weight: 900; }
.g2-axis-label { fill: #52627a; font-size: 7px; font-weight: 800; }
.g2-axis-label.g2-red-day { fill: #dc2626; }
.g2-y-label { fill: #607089; font-size: 8px; font-weight: 800; }
.g2-bar-value { fill: #27364d; font-size: 8px; font-weight: 900; paint-order: stroke; stroke: #fff; stroke-width: 2px; }
.g2-flow-bar-value { font-size: 5px; stroke-width: 1.2px; }
.g2-stack-value { pointer-events: none; font-size: 7px; font-weight: 950; paint-order: stroke; stroke-width: 1.2px; }
.g2-stack-value-morning { fill: #1e3a5f; stroke: rgb(255 255 255 / 55%); }
.g2-stack-value-afternoon { fill: #fff; stroke: rgb(37 99 235 / 55%); }
.g2-stack-hit { fill: transparent; stroke: none; pointer-events: all; cursor: default; }
.g2-forecast-zone { fill: #f1f5f9; opacity: 0.72; }
.g2-forecast-label { fill: #64748b; font-size: 9px; font-weight: 900; letter-spacing: 0.04em; }
.g2-bar { stroke: rgb(255 255 255 / 88%); stroke-width: 1; filter: drop-shadow(0 2px 2px rgb(71 85 105 / 12%)); shape-rendering: geometricPrecision; }
.g2-bar-production,
.g2-bar-delivery { fill-opacity: 0.86; }
.g2-bar-production { fill: url('#g2-production-gradient'); }
.g2-bar-delivery { fill: url('#g2-delivery-gradient'); }
.g2-bar-morning { fill: url('#g2-morning-gradient'); }
.g2-bar-afternoon { fill: url('#g2-afternoon-gradient'); }
.g2-bar-morning,
.g2-bar-afternoon { stroke: none; filter: none; }
.g2-stack-outline { fill: none; stroke: #93c5fd; stroke-width: 1.2; vector-effect: non-scaling-stroke; pointer-events: none; }
.g2-line { fill: none; stroke-width: 3.5; stroke-linejoin: round; stroke-linecap: round; }
.g2-line-inventory { stroke: #f87171; filter: drop-shadow(0 2px 2px rgb(248 113 113 / 18%)); }
.g2-line-target { stroke: #60a5fa; stroke-width: 3; stroke-dasharray: 9 5; }
.g2-line-delivery-target { stroke: #fb923c; stroke-width: 3; stroke-dasharray: 9 5; }
.g2-line-production-target { stroke: #f87171; stroke-width: 3; stroke-dasharray: 9 5; }
.g2-line-production-average { stroke: #2563eb; stroke-width: 2.6; stroke-dasharray: 5 4; }
.g2-line-halo { stroke: rgb(255 255 255 / 96%); stroke-width: 7; filter: none; pointer-events: none; }
.g2-line-halo.g2-line-target { stroke: rgb(255 255 255 / 96%); stroke-width: 6.5; }
.g2-line-halo.g2-line-production-average { stroke: rgb(255 255 255 / 96%); stroke-width: 6; stroke-dasharray: none; }
.g2-line-forecast { stroke-dasharray: 4 7; }
.g2-line-point { fill: #f87171; stroke: #f87171; stroke-width: 1.2; }
.g2-line-point-forecast { fill: #fca5a5; stroke: #f87171; stroke-dasharray: none; }
.g2-line-point-physical { fill: #60a5fa; stroke: #60a5fa; stroke-width: 1.5; stroke-dasharray: none; }
.g2-physical-point-hit { fill: transparent; stroke: none; pointer-events: all; }
.g2-inventory-value { fill: #f87171; font-size: 7px; font-weight: 950; paint-order: stroke; stroke: #fff; stroke-width: 2px; pointer-events: none; }
.g2-inventory-value-physical { fill: #60a5fa; }
.g2-physical-marker { fill: #dbeafe; stroke: #60a5fa; stroke-width: 3.5; filter: drop-shadow(0 2px 2px rgb(96 165 250 / 22%)); }
.g2-line-hit { fill: none; stroke: transparent; stroke-width: 15; pointer-events: stroke; }
.g2-tooltip { pointer-events: none; filter: drop-shadow(0 5px 10px rgb(15 23 42 / 20%)); }
.g2-tooltip rect { fill: rgb(255 255 255 / 98%); stroke: #94a3b8; stroke-width: 1; vector-effect: non-scaling-stroke; }
.g2-tooltip-date { fill: #64748b; font-size: 10px; font-weight: 800; }
.g2-tooltip-value { fill: #26364d; font-size: 12px; font-weight: 800; }
.g2-tooltip-value tspan { fill: #0f172a; font-weight: 950; }

.g2-chart-legend {
  margin-bottom: 8px;
  padding: 2px;
  color: #344156;
  font-size: 0.8rem;
  font-weight: 850;
}

.g2-chart-legend span {
  border: 1px solid #e0e7f0;
  border-radius: 999px;
  background: rgb(255 255 255 / 86%);
  padding: 6px 9px;
  box-shadow: 0 3px 10px rgb(51 65 85 / 6%);
}

.g2-chart-legend span::before {
  display: inline-block;
  width: 18px;
  height: 4px;
  margin-right: 6px;
  border-radius: 2px;
  background: linear-gradient(90deg, #60a5fa, #bfdbfe);
  content: '';
  vertical-align: middle;
}

/* Sales billing request: one selection action, accounting handoff, and immutable history. */

.billing-selection-card > header, .billing-history-card > header { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border-bottom: 1px solid #edf0f5; }
.billing-selection-card h3, .billing-history-card h3 { margin: 2px 0 0; font-size: 17px; }
.billing-table-wrap { overflow-x: auto; }
.billing-table { width: 100%; border-collapse: collapse; font-size: 12px; }

.billing-request-actions { display: grid; grid-template-columns: minmax(240px, 1fr) auto; align-items: end; gap: 12px; padding: 14px 18px; border-top: 1px solid #e9edf4; background: #fafbfe; }

.billing-history-list { display: grid; }

@media (max-width: 720px) {

.quality-loading { display: grid; grid-template-columns: repeat(3, 15px); min-height: 145px; place-content: center; gap: 7px; color: var(--muted); }
.quality-loading span { width: 15px; height: 15px; background: var(--quality-red); }
.quality-loading span:nth-child(2) { border-radius: 50%; opacity: 0.65; }
.quality-loading span:nth-child(3) { border-radius: 999px; opacity: 0.35; }
.quality-loading p { grid-column: 1 / -1; margin: 0; font-size: 0.68rem; }

.quality-decision-form { display: grid; gap: 12px; }
.quality-decision-options { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
.quality-decision-options button { display: grid; grid-template-columns: 38px minmax(0, 1fr); min-height: 67px; align-items: center; gap: 0 8px; border-radius: 0; background: #fff; text-align: left; }
.quality-decision-options button[data-result='failed'] { border-radius: 2px; clip-path: var(--ds-shape-warning-cut); }
.quality-decision-options button > span { grid-row: 1 / 3; display: grid; width: 35px; height: 35px; place-items: center; border: 2px solid currentColor; border-radius: 50%; }
.quality-decision-options strong { align-self: end; font-size: 0.76rem; }
.quality-decision-options small { align-self: start; color: var(--muted); font-size: 0.57rem; }
.quality-decision-options button.selected[data-result='passed'] { border-color: var(--quality-green); background: var(--quality-green-soft); color: var(--quality-green); }
.quality-decision-options button.selected[data-result='failed'] { border-color: var(--quality-red); background: var(--brand-red-soft); color: var(--brand-red-deep); }
.quality-decision-derived { display: grid; grid-template-columns: 38px minmax(0, 1fr); min-height: 67px; align-items: center; gap: 8px; border: 1px solid var(--line); background: #fff; padding: 10px 12px; }
.quality-decision-derived > span { display: grid; width: 35px; height: 35px; place-items: center; border: 2px solid currentColor; border-radius: 50%; }
.quality-decision-derived > div { display: grid; gap: 3px; }
.quality-decision-derived strong { font-size: 0.76rem; }
.quality-decision-derived small { color: var(--muted); font-size: 0.57rem; }
.quality-decision-derived[data-result='passed'] { border-color: var(--quality-green); color: var(--quality-green); }
.quality-decision-derived[data-result='failed'] { border-color: var(--quality-red); color: var(--brand-red-deep); }
.quality-decision-form label { display: grid; gap: 6px; color: var(--muted); font-size: 0.68rem; font-weight: 850; }
.quality-decision-form label > span { display: flex; justify-content: space-between; }
.quality-decision-form label small { font-size: 0.55rem; }
.quality-decision-form textarea { min-height: 82px; resize: vertical; }
.quality-decision-error { margin: 0; padding: 10px 12px; border: 1px solid var(--quality-red); background: var(--brand-red-soft); color: var(--brand-red-deep); font-size: 0.65rem; font-weight: 850; line-height: 1.5; }
.quality-decision-reload { min-height: 42px; border-color: var(--line-strong); background: #fff; color: var(--ink); }
.quality-finalize-submit { min-height: 49px; border-color: var(--quality-red); background: var(--quality-red); color: #fff; }

.manufacturing-confirmation-card { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; align-items: center; gap: 11px; padding: 12px; border: 1px solid rgb(41 95 79 / 24%); border-radius: 0 18px 18px 18px; background: var(--quality-green-soft, #eaf4ef); }
.manufacturing-confirmation-mark { display: grid; width: 48px; height: 48px; place-items: center; border: 2px solid #295f4f; border-radius: 50%; color: #295f4f; font-size: 0.7rem; font-weight: 950; }
.manufacturing-confirmation-card > div { display: grid; gap: 2px; }
.manufacturing-confirmation-card small { color: #295f4f; font-size: 0.53rem; font-weight: 900; letter-spacing: 0.08em; }
.manufacturing-confirmation-card strong { font-size: 0.75rem; }
.manufacturing-confirmation-card p { margin: 0; color: var(--muted); font-size: 0.59rem; }
.manufacturing-confirmation-card button { min-height: 42px; border-color: #295f4f; background: #295f4f; color: #fff; }
.manufacturing-confirmed-disc { display: grid; width: 38px; height: 38px; place-items: center; border-radius: 50%; background: #295f4f; color: #fff; }

@media (max-width: 1120px) {
  .quality-detail-grid { grid-template-columns: minmax(0, 1fr); }
  .quality-history-card { position: static; }
}

/* TASK-008A · mobile-first material receiving and IQC */
.material-workspace {
  position: relative;
  display: grid;
  gap: 18px;
  overflow: hidden;
  background:
    radial-gradient(circle at 96% 0%, rgb(218 33 39 / 10%), transparent 280px),
    linear-gradient(160deg, #fff 0%, #fffafa 56%, #f7f2f3 100%);
}

.material-hero {
  position: relative;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 18px;
  overflow: hidden;
  padding: 24px;
  border: 1px solid rgb(218 33 39 / 18%);
  border-radius: 24px;
  background: linear-gradient(135deg, #fff 0%, #fff7f7 66%, #f4e5e7 100%);
  box-shadow: 0 18px 44px rgb(83 28 31 / 9%);
}

.material-hero::after {
  position: absolute;
  width: 150px;
  height: 150px;
  right: -40px;
  top: -70px;
  border: 24px solid rgb(218 33 39 / 8%);
  border-radius: 50%;
  content: '';
}

.material-hero h2 {
  margin: 4px 0 8px;
  color: var(--ink);
  font-size: clamp(1.65rem, 3vw, 2.35rem);
  letter-spacing: -0.04em;
}

.material-hero p:last-child {
  max-width: 580px;
  margin: 0;
  color: var(--muted);
}

.material-hero-actions {
  z-index: 1;
  display: flex;
  gap: 8px;
}

.material-hero--quality {
  background: linear-gradient(135deg, #fff 0%, #fff8f8 58%, #f4e1e4 100%);
}

.material-summary-strip {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
}

.material-summary-strip button {
  display: flex;
  min-height: 82px;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 14px 16px;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: #fff;
  color: var(--muted);
  box-shadow: 0 8px 22px rgb(67 28 30 / 5%);
}

.material-summary-strip button[data-active='true'] {
  border-color: var(--brand-red);
  background: var(--brand-red-soft);
  color: var(--brand-red-deep);
}

.material-summary-strip button[data-tone='danger'] strong {
  color: var(--brand-red);
}

.material-summary-strip strong {
  color: var(--ink);
  font-size: 1.7rem;
}

.material-search-panel {
  display: grid;
  grid-template-columns: minmax(240px, 1fr) auto auto;
  align-items: end;
  gap: 10px;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: rgb(255 255 255 / 88%);
  backdrop-filter: blur(10px);
}

.material-search-panel label:not(.material-completed-toggle),
.material-action-form label {
  display: grid;
  gap: 7px;
  color: var(--muted);
  font-size: 0.82rem;
  font-weight: 800;
}

.material-completed-toggle {
  display: flex;
  min-height: 44px;
  align-items: center;
  gap: 8px;
  padding: 0 10px;
  font-weight: 800;
}

.material-supply-filter {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 2px;
}

.material-supply-filter button {
  min-height: 38px;
  padding: 8px 14px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: #fff;
  color: var(--muted);
  font-weight: 900;
}

.material-supply-filter button[data-active='true'] {
  border-color: var(--brand-red);
  background: var(--brand-red-soft);
  color: var(--brand-red-deep);
}

.material-supply-filter > span {
  margin-left: auto;
  color: var(--muted);
  font-size: 0.78rem;
  font-weight: 800;
}

.material-item-list {
  display: grid;
  gap: 14px;
}

.material-item-list--desktop {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

.material-item-card {
  display: grid;
  min-width: 0;
  gap: 14px;
  padding: 18px;
  border: 1px solid var(--line);
  border-radius: 22px;
  background: #fff;
  box-shadow: 0 12px 30px rgb(67 28 30 / 7%);
}

.material-item-card[data-completed='true'] {
  background: linear-gradient(150deg, #fff, #fff8f8);
}

.material-item-card > header,
.material-receipt-chip,
.iqc-request-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}

.material-item-card > header > div {
  display: grid;
  min-width: 0;
  gap: 3px;
}

.material-item-card > header span,
.material-action-context > span,
.iqc-inspector-context > span {
  color: var(--brand-red);
  font-size: 0.75rem;
  font-weight: 900;
  letter-spacing: 0.08em;
}

.material-item-card > header strong {
  overflow: hidden;
  color: var(--ink);
  font-size: 1.08rem;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.material-item-card > header small {
  overflow: hidden;
  color: var(--muted);
  text-overflow: ellipsis;
  white-space: nowrap;
}

.material-card-badges {
  display: flex;
  flex: 0 0 auto;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 6px;
}

.customer-supply-badge,
.supply-type-badge {
  display: inline-flex;
  width: fit-content;
  align-items: center;
  padding: 6px 9px;
  border-radius: 999px;
  background: #fff2cf;
  color: #7a5600;
  font-size: 0.72rem;
  font-weight: 900;
  line-height: 1;
}

.customer-supply-badge[data-overdue='true'] {
  background: var(--brand-red-soft);
  color: var(--brand-red-deep);
}

.supply-type-badge[data-supply-type='Purchased'] {
  background: #edf3ef;
  color: #43554a;
}

.material-status-badge {

.receipt-stepper li:first-child::before {

.receipt-stepper i {

.material-action-form {

.material-action-notice,
.material-success-panel,

}

.material-success-panel {

  color: #176b38;
}

.material-action-buttons {

}

}

.material-action-buttons textarea {

.iqc-toolbar {

.iqc-toolbar strong {

.iqc-toolbar label {

.iqc-card-list {

.iqc-request-card {

.iqc-request-card > span,

.iqc-inspector .material-item-meta {

}

.iqc-decision-grid {

}

.iqc-fail-button {

.material-action-drawer--iqc-report {

.iqc-report-badge {

}

.iqc-report-steps button {

.iqc-progress-strip {

.iqc-report-panel {

.iqc-report-panel > header {

.iqc-report-panel h4,
.iqc-report-panel p {

.iqc-report-panel h4 {
  font-size: 1.12rem;
}

.iqc-report-panel header p {
  margin-top: 3px;
  color: var(--muted);
  font-size: 0.82rem;
}

.iqc-item-stack {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.iqc-item-card {
  display: grid;
  align-content: start;
  gap: 11px;
  min-width: 0;
  padding: 13px;

.iqc-item-card:nth-child(2n) {

.iqc-item-card[data-complete='true'] {

.iqc-item-card[data-photo='true'] {

.iqc-item-card > header > i {
  display: grid;
  width: 30px;
  height: 30px;
  place-items: center;
  border-radius: 50%;
  background: var(--brand-red-soft);

.iqc-item-card > header > div {

.iqc-item-card > header strong {

.iqc-item-card > header small {

.iqc-check-options button {

.iqc-check-options button[data-active='true'][data-result='Pass'] {

.iqc-check-options button[data-active='true'][data-result='Fail'] {

.iqc-check-options button[data-active='true'][data-result='NotApplicable'] {

.iqc-item-card input,
.iqc-item-card textarea,
.iqc-photo-alt input,

.iqc-inline-photo {

.iqc-inline-photo-heading {

  gap: 8px;
  align-items: center;

.iqc-inline-photo-heading b {

.iqc-inline-photo-heading span {

.iqc-inline-photo .iqc-photo-drop {

.iqc-photo-drop {

.iqc-photo-drop i {

.iqc-photo-drop span {

.iqc-photo-alt,

.iqc-photo-evidence {

.iqc-photo-evidence button {

.iqc-reason-field textarea {

.iqc-finalize-actions {

.iqc-next-button,

.iqc-final-seal {

.iqc-final-seal > i {

.iqc-final-report blockquote {

}

.iqc-final-items {

  font-size: 0.72rem;

.iqc-legacy-report > span {

* {
  box-sizing: border-box;
}

body {
  min-width: 320px;
  min-height: 100vh;
  margin: 0;
}

#root {
  min-height: 100vh;
}

button,
input,
select,
textarea {
  font: inherit;
}

button {
  min-height: 38px;
  border: 1px solid #cfd8d2;
  border-radius: 6px;
  background: #ffffff;
  color: #17201b;
  cursor: pointer;
  font-weight: 700;
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.55;
}

.review-safe-banner {
  margin: 0 0 1rem;
  border: 1px solid #9a6b00;
  border-radius: 0.75rem;
  background: #fff6d8;
  color: #5b3d00;
  padding: 0.8rem 1rem;
  font-weight: 700;
  display: grid;
  gap: 0.25rem;
}

.review-safe-ledger-warning {
  color: #b42318;
}

.review-safe-banner--checking {
  border-color: #53709b;
  background: #edf4ff;
  color: #243f68;
}

.review-safe-banner--error {
  border-color: #b42318;
  background: #fff0ee;
  color: #7a271a;
}

[data-review-safe-disabled='true'] {
  cursor: not-allowed;
}

input,
select,
textarea {
  width: 100%;
  border: 1px solid #cfd8d2;
  border-radius: 6px;
  background: #ffffff;
  color: #17201b;
  padding: 9px 10px;
}

textarea {
  min-height: 90px;
  resize: vertical;
}

.app-shell {
  display: grid;
  grid-template-columns: 176px minmax(0, 1fr);
  gap: 18px;
  width: min(1380px, 100%);
  min-height: 100vh;
  margin: 0 auto;
  padding: 24px;
}

.app-content {
  min-width: 0;
}

.app-sidebar {
  position: sticky;
  top: 24px;
  align-self: start;
  display: grid;
  gap: 16px;
  border: 1px solid #d8ded9;
  border-radius: 8px;
  background: #ffffff;
  padding: 16px;
  box-shadow: 0 10px 30px rgb(23 32 27 / 7%);
}

.app-nav,
.app-mobile-nav {
  display: grid;
  gap: 8px;
}

.app-nav-button {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  width: 100%;
  text-align: left;
}

.nav-badge {

}

.app-mobile-nav {
  display: none;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  margin-bottom: 16px;
}

.topbar,
.page-header,
.subsection-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
}

.topbar {
  margin-bottom: 16px;
}

.topbar-actions {

}

.eyebrow {

  font-size: 0.82rem;

}

h1,

h1 {

/* TASK-007A Pending workspace */
.pending-page {
  --pending-ink: #10241c;
  --pending-green: #176448;
  --pending-soft: #eef7f2;
  display: grid;
  gap: 20px;
  color: var(--pending-ink);
}

.pending-header {
  align-items: center;
}

.pending-header .muted-text {
  max-width: 720px;
  margin: 8px 0 0;
}

.pending-summary-grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 10px;
}

.pending-summary-grid > div {
  display: grid;
  gap: 8px;
  min-width: 0;
  border: 1px solid #dbe5df;
  border-radius: 12px;
  background: linear-gradient(145deg, #ffffff, #f7faf8);
  padding: 15px 16px;
}

.pending-summary-grid span {
  color: #607269;
  font-size: 0.82rem;
  font-weight: 800;
}

.pending-summary-grid strong {
  font-size: 1.65rem;
  letter-spacing: -0.04em;
}

.pending-summary-grid [data-tone='urgent'],
.pending-summary-grid [data-tone='overdue'] {
  border-color: #f1c3bd;
  background: linear-gradient(145deg, #fffdfc, #fff3f0);
}

.pending-summary-grid [data-tone='urgent'] strong,
.pending-summary-grid [data-tone='overdue'] strong {
  color: #b42318;
}

.pending-summary-grid [data-tone='reinspection'] {
  border-color: #bfd5f5;
  background: linear-gradient(145deg, #ffffff, #f1f6ff);
}

.pending-summary-grid [data-tone='reinspection'] strong {
  color: #24569f;
}

.pending-filter-bar {
  display: grid;
  grid-template-columns: repeat(3, minmax(150px, 1fr)) auto;
  gap: 10px;
  align-items: end;
  border: 1px solid #dbe5df;
  border-radius: 12px;
  background: #f7faf8;
  padding: 12px;
}

.pending-filter-bar label {
  display: grid;
  gap: 5px;
  color: #52665a;
  font-size: 0.8rem;
  font-weight: 800;
}

.pending-list {
  display: grid;
  gap: 10px;
}

.pending-card {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 18px;
  align-items: center;
  overflow: hidden;
  border: 1px solid #dfe8e2;
  border-radius: 12px;
  background: #ffffff;
  padding: 17px 18px 17px 22px;
  box-shadow: 0 4px 16px rgb(24 65 48 / 5%);
}

.pending-card::before {
  position: absolute;
  inset: 0 auto 0 0;
  width: 4px;
  background: #79a28f;
  content: '';
}

.pending-card[data-priority='Urgent']::before,
.pending-card[data-overdue='true']::before {
  background: #d23d32;
}

.pending-card-main {
  min-width: 0;
}

.pending-card-badges {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
  margin: 0 0 9px;
}

.pending-number {
  color: #176448;
  font-size: 0.78rem;
  font-weight: 950;
  letter-spacing: 0.07em;
}

.pending-title-button {
  min-height: auto;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--pending-ink);
  font-size: 1.05rem;
  text-align: left;
}

.pending-title-button:hover {
  color: #176448;
  text-decoration: underline;
}

.pending-card-main > p {
  display: -webkit-box;
  overflow: hidden;
  margin: 7px 0 11px;

  font-size: 0.91rem;

.pending-card-meta {

  min-height: auto;

}

.pending-attachment-note {

  border: 1px dashed #b5c8bd;
  border-radius: 10px;
  background: #f7faf8;

.pending-create-dialog {

  gap: 18px;

.pending-section,

.pending-next-action h3 {

.pending-next-action p:not(.eyebrow) {
  margin: 6px 0 0;

.pending-transition-control {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 8px;
}

.pending-comments {
  display: grid;
  gap: 8px;
  margin-bottom: 12px;
}

.pending-comments article {
  border-radius: 9px;
  background: #f7faf8;
  padding: 12px;
}

.pending-comments p {
  margin: 6px 0;

.pending-comments small {

  align-items: end;
}

  min-height: 72px;
}

.pending-timeline {
  position: sticky;
  top: 20px;
  display: grid;
  gap: 0;
  background: #f9fbfa;
}

.pending-timeline article {
  position: relative;
  display: grid;
  grid-template-columns: 16px minmax(0, 1fr);
  gap: 9px;
  padding: 0 0 18px;
}

.pending-timeline article:not(:last-of-type)::before {
  position: absolute;
  top: 10px;
  bottom: -2px;
  left: 5px;
  width: 2px;
  background: #cedbd3;
  content: '';
}

.pending-timeline-dot {
  position: relative;
  z-index: 1;
  width: 12px;
  height: 12px;
  margin-top: 4px;
  border: 2px solid #ffffff;
  border-radius: 999px;
  background: #26795a;
  box-shadow: 0 0 0 1px #8db7a3;
}

.pending-timeline p {
  margin: 4px 0;
  color: #5a6e63;
  font-size: 0.82rem;
  line-height: 1.45;
}

.pending-timeline small {
  color: #75847c;
  font-size: 0.73rem;
}

.pending-empty,
.pending-loading {
  display: grid;
  justify-items: center;
  gap: 8px;
  border: 1px dashed #c5d4cc;
  border-radius: 12px;
  background: #fafcfb;
  padding: 44px 20px;
  color: #5d7065;
  text-align: center;
}

.pending-empty > span {
  display: grid;
  width: 42px;
  height: 42px;
  place-items: center;
  border-radius: 999px;
  background: #e8f5ee;
  color: #1d6b4f;
  font-size: 1.2rem;
  font-weight: 900;
}

.pending-loading p {

.pending-loading {
  grid-template-columns: repeat(3, 8px);

.pending-loading span {
  width: 8px;
  height: 8px;
  border-radius: 999px;
  background: #4f9274;
  animation: pending-pulse 1.2s infinite ease-in-out;
}

.pending-loading span:nth-child(2) { animation-delay: 0.15s; }
.pending-loading span:nth-child(3) { animation-delay: 0.3s; }
.pending-loading p { grid-column: 1 / -1; }

@keyframes pending-pulse {
  0%, 80%, 100% { opacity: 0.35; transform: translateY(0); }
  40% { opacity: 1; transform: translateY(-4px); }

/* DESIGN-001 experiment: extend the approved login visual language to the app. */
body {
  color: var(--ink);
  background:
    radial-gradient(circle at 7% 4%, rgb(218 33 39 / 9%) 0 1px, transparent 1.5px) 0 0 / 18px 18px,
    radial-gradient(circle at 96% 1%, rgb(218 33 39 / 11%), transparent 27rem),
    linear-gradient(145deg, #f8f6f7 0%, var(--canvas) 48%, #f1edef 100%);
}

.app-shell {
  grid-template-columns: 224px minmax(0, 1fr);
  gap: 24px;
  width: min(1580px, 100%);
  padding: 28px;
}

.app-content {
  position: relative;
  z-index: 1;
}

.app-sidebar {
  top: 28px;
  gap: 22px;
  min-height: calc(100vh - 56px);
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-shell);
  background:
    radial-gradient(circle at 20% 6%, rgb(255 255 255 / 35%) 0 1.5px, transparent 1.8px) 0 0 / 18px 18px,
    linear-gradient(160deg, #ee3a40 0%, var(--brand-red) 42%, var(--brand-red-strong) 100%);
  color: #ffffff;
  padding: 24px 18px;
  box-shadow: 0 24px 55px rgb(142 15 20 / 24%);
}

.app-sidebar::after {
  position: absolute;
  right: -104px;
  bottom: -116px;
  width: 260px;
  height: 260px;
  border: 1px solid rgb(255 255 255 / 28%);
  border-radius: 50%;
  background: rgb(255 255 255 / 8%);
  box-shadow: 0 0 0 28px rgb(255 255 255 / 4%);
  content: '';
  pointer-events: none;
}

.app-brand-lockup,
.app-sidebar-heading,
.app-nav {
  position: relative;
  z-index: 1;
}

.app-brand-lockup {
  display: grid;
  gap: 10px;
  padding: 4px 6px 20px;
  border-bottom: 1px solid rgb(255 255 255 / 24%);
}

.app-brand-lockup img {
  display: block;
  width: 162px;
  max-width: 100%;
  height: auto;
}

.app-brand-lockup span {
  color: rgb(255 255 255 / 74%);
  font-size: 0.66rem;
  font-weight: 800;
  letter-spacing: 0.2em;
}

.app-sidebar-heading {
  display: grid;
  gap: 2px;
  padding: 0 6px;
}

.app-sidebar .eyebrow {
  color: rgb(255 255 255 / 68%);
}

.app-sidebar-heading strong {
  font-size: 1.12rem;
}

.app-nav {
  gap: 7px;
}

.app-shell button,
.app-shell input,
.app-shell select,
.app-shell textarea {
  border-radius: var(--radius-control);
}

.app-shell button {
  min-height: 42px;
  border-color: var(--line);
  background: var(--surface);
  color: var(--ink);
  box-shadow: 0 3px 10px rgb(67 28 30 / 5%);
  transition: border-color 160ms ease, background 160ms ease, color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
}

.app-shell button:hover:not(:disabled) {
  border-color: rgb(218 33 39 / 40%);
  background: var(--brand-red-wash);
  color: var(--brand-red-strong);
  box-shadow: 0 8px 18px rgb(218 33 39 / 10%);
  transform: translateY(-1px);
}

.app-shell button:active:not(:disabled) {
  transform: translateY(0);
}

.app-shell button:focus-visible,
.app-shell input:focus-visible,
.app-shell select:focus-visible,
.app-shell textarea:focus-visible,
.app-shell [tabindex]:focus-visible {
  outline: 3px solid rgb(218 33 39 / 22%);
  outline-offset: 2px;
}

.app-shell input,
.app-shell select,
.app-shell textarea {
  min-height: 42px;
  border-color: var(--line-strong);
  background: #ffffff;
  color: var(--ink);
  box-shadow: inset 0 1px 0 rgb(255 255 255 / 80%);
}

.app-shell input:hover,
.app-shell select:hover,
.app-shell textarea:hover,
.app-shell input:focus,
.app-shell select:focus,
.app-shell textarea:focus {
  border-color: rgb(218 33 39 / 55%);
}

.app-nav-button {
  position: relative;
  min-height: 44px;
  border-color: transparent;
  background: rgb(255 255 255 / 8%);
  color: #ffffff;
  padding: 0 13px;
  box-shadow: none;
}

.app-nav-button:hover:not(:disabled) {
  border-color: rgb(255 255 255 / 28%);
  background: rgb(255 255 255 / 15%);
  color: #ffffff;
  box-shadow: none;
  transform: translateX(2px);
}

.app-nav-button.active,
.app-nav-button[aria-current='page'] {
  border-color: #ffffff;
  background: #ffffff;
  color: var(--brand-red-strong);
  box-shadow: 0 10px 24px rgb(109 8 12 / 18%);
}

.app-nav-button[aria-current='page']::before {
  position: absolute;
  top: 50%;
  left: 5px;
  width: 4px;
  height: 18px;

/* TASK-011A · adaptive manufacturing execution */
.page-surface.manufacturing-page {
  position: relative;

    radial-gradient(circle at 92% 4%, rgb(218 33 39 / 8%), transparent 280px),
    linear-gradient(155deg, #fff 0%, #fffafa 55%, #f5f0f1 100%);

.manufacturing-hero {
  position: relative;
  display: flex;
  min-height: 158px;
  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
  overflow: hidden;
  padding: 26px 30px;
  border: 1px solid rgb(218 33 39 / 18%);
  border-radius: 0 32px 32px 32px;
  background: linear-gradient(125deg, #fff 0%, #fff7f7 58%, #f0dadd 100%);

.manufacturing-hero p:last-child {

}

.manufacturing-back {
  min-height: 44px;
  border-radius: 999px;
  background: rgb(255 255 255 / 78%);

}

.manufacturing-hero-disc {
  position: absolute;

  height: 142px;
  right: 128px;

  border: 24px solid rgb(218 33 39 / 9%);
  border-radius: 50%;
}

.manufacturing-hero-angle {
  position: absolute;
  width: 116px;
  height: 88px;

.manufacturing-workspace {
  display: grid;

  gap: 16px;

.manufacturing-project-queue,
.manufacturing-panel-area,
.manufacturing-focus-card,

.manufacturing-project-card small {

  padding: 18px;

  background: #eee8e9;
}

.manufacturing-progress-track span {
  display: block;
  height: 100%;

.manufacturing-ready-copy {

}

.manufacturing-step-list,
.manufacturing-timeline ol {
  display: grid;
  gap: 8px;

}

.manufacturing-step-list li {

.manufacturing-stop {

.notification-preferences-page {
  --preference-ink: #172f25;
  --preference-green: #3d6d54;
  --preference-soft: #eef4eb;
  --preference-line: rgba(43, 72, 57, 0.18);
  position: relative;
  overflow: hidden;
}

.notification-preferences-page::before {
  position: absolute;
  top: -76px;
  right: -48px;
  width: 210px;
  height: 210px;
  border: 1px solid rgba(109, 144, 118, 0.24);
  border-radius: 50%;
  content: '';
  pointer-events: none;
}

.notification-preferences-header {
  position: relative;
  z-index: 1;
}

.notification-preferences-header p:last-child {
  margin: 6px 0 0;
  color: #68766d;
  font-size: 13px;
}

.notification-preference-notice {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  margin: 18px 0;
  padding: 16px 18px;
  border: 1px solid var(--preference-line);
  border-radius: 3px 22px 3px 22px;
  background: linear-gradient(120deg, #f5f8f1, #eef5ec);

.notification-preference-notice > span {
  flex: 0 0 30px;
  display: grid;
  width: 30px;
  height: 30px;
  place-items: center;
  border-radius: 50%;
  background: var(--preference-green);
  color: white;
  font-family: Georgia, serif;
  font-weight: 800;
}

.notification-preference-notice p {
  margin: 4px 0 0;
  color: #586b5e;
  font-size: 13px;
  line-height: 1.45;
}

.notification-preference-state {
  display: flex;
  min-height: 180px;
  align-items: center;
  justify-content: center;
  gap: 14px;
  border: 1px dashed var(--preference-line);
  border-radius: 18px;
  color: #637168;
}

.notification-preference-state--error {
  flex-direction: column;
  color: #913c32;
}

.notification-preference-summary {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
  padding: 8px 14px;
  border-radius: 999px;
  background: #e3eee0;
  color: #315a43;
}

.notification-preference-summary[data-default='false'] {
  background: #fff1cf;
  color: #7c5913;
}

.notification-preference-summary span {
  font-weight: 800;
}

.notification-preference-summary small {
  color: inherit;
}

.notification-preference-conflict {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 14px;
  padding: 12px 14px;
  border: 1px solid #e0b45c;
  border-radius: 0;
  background: #fff8e8;
  color: #684b13;
}

.notification-preference-conflict div {
  display: grid;
  gap: 2px;
}

.notification-preference-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.notification-preference-card {
  min-width: 0;
  padding: 16px;
  border: 1px solid var(--preference-line);
  border-radius: 20px 4px 20px 4px;
  background: rgba(255, 255, 255, 0.94);
  box-shadow: 0 10px 28px rgba(37, 62, 49, 0.06);
}

.notification-preference-card:nth-child(3n + 2) {
  border-radius: 4px;
}

.notification-preference-card:nth-child(3n) {
  border-radius: 26px;
}

.notification-preference-card--locked {
  background: #f7f7f3;
  box-shadow: none;
}

.notification-preference-card header {
  display: flex;
  align-items: center;
  gap: 11px;
}

.notification-preference-card header > div {
  min-width: 0;
  display: grid;
  gap: 2px;
  margin-right: auto;
}

.notification-preference-card header strong {
  color: var(--preference-ink);
  font-size: 15px;
}

.notification-preference-card header div > span {
  color: #718078;
  font-size: 12px;
}

.notification-preference-shape {
  flex: 0 0 34px;
  display: grid;
  width: 34px;
  height: 34px;
  place-items: center;
  border-radius: 50%;
  background: #dfeadd;
  color: #365b46;
  font-size: 12px;
  font-weight: 900;
}

.notification-preference-card:nth-child(even) .notification-preference-shape {
  border-radius: 5px;
  background: #f4dfac;
  color: #725519;
  transform: rotate(4deg);
}

.notification-preference-card > p {
  min-height: 40px;
  margin: 13px 0;
  color: #5b6a61;
  font-size: 13px;
  line-height: 1.5;
}

.notification-preference-card footer {
  display: flex;
  min-height: 22px;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  color: #65746b;
  font-size: 11px;
}

.notification-preference-card footer > span {
  padding: 4px 9px;
  border-radius: 999px;
  background: var(--preference-soft);
  white-space: nowrap;
}

.notification-preference-card footer small {
  text-align: right;
}

.notification-toggle {
  display: inline-grid;
  grid-template-columns: 38px auto;
  align-items: center;
  gap: 6px;
  cursor: pointer;
}

.notification-toggle input {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: 0;
  clip-path: inset(50%);
  opacity: 0;
  overflow: hidden;
  pointer-events: none;
}

.notification-toggle > span {
  position: relative;
  width: 38px;
  height: 22px;
  border-radius: 999px;
  background: #adb9b0;
  transition: background 160ms ease;
}

.notification-toggle > span::after {
  position: absolute;
  top: 3px;
  left: 3px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: white;
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.18);
  content: '';
  transition: transform 160ms ease;
}

.notification-toggle input:checked + span {
  background: var(--preference-green);
}

.notification-toggle input:checked + span::after {
  transform: translateX(16px);
}

.notification-toggle input:focus-visible + span {
  outline: 3px solid rgba(73, 112, 87, 0.28);
  outline-offset: 2px;
}

.notification-toggle b {
  color: #4f6055;
  font-size: 11px;
}

}

  margin: 0 6px 6px 0;

.panel-qr-select { display: flex; align-items: center; gap: 7px; }

.panel-qr-name { display: grid; gap: 2px; }
.panel-qr-name strong { color: #2a354c; font-size: 13px; }
.panel-qr-name small { color: #939bab; font-size: 10px; }
.panel-qr-status { justify-self: start; padding: 4px 8px; border-radius: 999px; font-size: 10px; font-weight: 800; }

.panel-qr-print-shell { display: grid; gap: 12px; margin: 0 18px 18px; padding: 16px; border: 1px dashed #bdc9e8; border-radius: 12px; background: #f8faff; }

.qr-scan-page { display: grid; place-items: center; gap: 12px; min-height: min(680px, calc(100dvh - 170px)); padding: 24px; background: radial-gradient(circle at 50% 5%, #eef3ff 0, transparent 34%); }
.qr-scan-card { position: relative; display: grid; gap: 16px; width: min(100%, 540px); padding: 28px; overflow: hidden; border: 1px solid #e0e5f0; border-radius: 28px 5px 28px 5px; background: #fff; box-shadow: 0 24px 60px rgb(39 52 88 / 12%); }
.qr-scan-mark { position: absolute; top: 18px; right: 18px; display: grid; grid-template-columns: repeat(2, 11px); gap: 4px; opacity: .9; }
.qr-scan-mark span { width: 11px; height: 11px; background: #315efb; }

.qr-scan-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; padding-right: 50px; }

.qr-scan-stage span { grid-row: 1 / 3; align-self: center; padding: 5px 8px; border-radius: 999px; background: rgb(255 255 255 / 16%); font-size: 9px; font-weight: 850; }
.qr-scan-stage strong { font-size: 18px; }
.qr-scan-stage small { color: rgb(255 255 255 / 75%); }
.qr-scan-message { margin: 0; color: #5e6980; font-size: 12px; line-height: 1.55; }

.qr-scan-state { display: grid; justify-items: start; gap: 8px; min-height: 220px; align-content: center; }

@media (max-width: 720px) {

  .panel-qr-status { font-size: 8px; }
  .panel-qr-actions { grid-column: 2 / -1; justify-content: flex-start; }
  .panel-qr-actions button { min-height: 28px; font-size: 9px; }
  .panel-qr-preview { grid-template-columns: 112px minmax(0, 1fr); gap: 10px; margin: 0 10px 10px; padding: 10px; }
  .panel-qr-preview figure { padding: 7px; }
  .panel-qr-preview h5 { font-size: 12px; }
  .panel-qr-preview p { display: none; }

  .panel-qr-preview button { min-height: 31px; padding: 0 8px; font-size: 9px; }

  .qr-scan-page { min-height: calc(100dvh - 108px); padding: 10px; }
  .qr-scan-card { gap: 11px; padding: 18px 14px; border-radius: 20px 4px 20px 4px; box-shadow: 0 12px 36px rgb(39 52 88 / 10%); }

  .qr-scan-primary { min-height: 44px; }

@media print {

  .panel-qr-print-shell, .panel-qr-print-shell * { visibility: visible; }

  .panel-qr-print-grid { grid-template-columns: repeat(3, 1fr); }
}

/* DESIGN-000: reference-projected semantic foundation. */
:root {
  --ds-color-canvas: #f8f9fc;
  --ds-color-surface: #ffffff;
  --ds-color-surface-subtle: #fbfcff;
  --ds-color-surface-active: #e9efff;
  --ds-color-primary: #316cf4;
  --ds-color-primary-hover: #2459d8;
  --ds-color-primary-strong: #1f48b5;
  --ds-color-primary-soft: #eef3ff;
  --ds-color-text: #252936;
  --ds-color-text-muted: #7f8798;
  --ds-color-text-faint: #a5abba;
  --ds-color-border: #e5e8ef;
  --ds-color-border-strong: #d5dae5;
  --ds-color-danger: #df4858;
  --ds-color-danger-soft: #fff0f2;
  --ds-color-warning: #a66a16;
  --ds-color-warning-soft: #fff7e8;
  --ds-color-success: #1d8b5c;
  --ds-color-success-soft: #eaf8f1;

  --ds-font-family: Inter, Pretendard, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --ds-font-size-2xs: 10px;
  --ds-font-size-xs: 11px;
  --ds-font-size-sm: 12px;
  --ds-font-size-md: 13px;
  --ds-font-size-lg: 15px;
  --ds-font-size-title: 21px;
  --ds-line-height-compact: 1.25;
  --ds-line-height-body: 1.5;

  --ds-space-1: 4px;
  --ds-space-2: 6px;
  --ds-space-3: 8px;
  --ds-space-4: 12px;
  --ds-space-5: 16px;
  --ds-space-6: 20px;
  --ds-space-7: 24px;
  --ds-space-8: 32px;

  --ds-radius-xs: 4px;
  --ds-radius-sm: 6px;
  --ds-radius-md: 8px;
  --ds-radius-lg: 10px;
  --ds-radius-pill: 999px;
  --ds-shape-surface-radius: 8px;
  --ds-shape-control-radius: 6px;
  --ds-shape-active-radius: 8px;
  --ds-shape-warning-cut: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%);
  --ds-shadow-surface: 0 2px 10px rgb(31 41 75 / 4%);
  --ds-shadow-overlay: 0 18px 48px rgb(31 41 75 / 14%);

  --ds-sidebar-width: 192px;
  --ds-topbar-height: 52px;
  --ds-content-max: 1440px;
}

/* Change 005: one geometry per semantic meaning; content surfaces never become circles or pills. */
.app-shell [data-shape-role='surface'] {
  --ds-semantic-radius: var(--ds-shape-surface-radius);
  --ds-semantic-clip: none;
}

.app-shell [data-shape-role='control'] {
  --ds-semantic-radius: var(--ds-shape-control-radius);
  --ds-semantic-clip: none;
}

.app-shell [data-shape-role='active'] {
  --ds-semantic-radius: var(--ds-shape-active-radius);
  --ds-semantic-clip: none;
}

.app-shell [data-shape-role='status'] {
  --ds-semantic-radius: var(--ds-radius-pill);
  --ds-semantic-clip: none;
}

.app-shell [data-shape-role='count'],
.app-shell [data-shape-role='success'] {
  --ds-semantic-radius: 50%;
  --ds-semantic-clip: none;
}

.app-shell [data-shape-role='warning'] {
  --ds-semantic-radius: 2px;
  --ds-semantic-clip: var(--ds-shape-warning-cut);
}

.app-shell {
  --brand-red: var(--ds-color-primary);
  --brand-red-strong: var(--ds-color-primary-hover);
  --brand-red-deep: var(--ds-color-primary-strong);
  --brand-red-soft: var(--ds-color-primary-soft);
  --brand-red-wash: #f7f9ff;
  --canvas: var(--ds-color-canvas);
  --surface: var(--ds-color-surface);
  --surface-subtle: var(--ds-color-surface-subtle);
  --ink: var(--ds-color-text);
  --muted: var(--ds-color-text-muted);
  --line: var(--ds-color-border);
  --line-strong: var(--ds-color-border-strong);
  --radius-shell: var(--ds-radius-lg);
  --radius-card: var(--ds-radius-md);
  --radius-control: var(--ds-radius-sm);
  --shadow-soft: var(--ds-shadow-surface);
  --shadow-card: var(--ds-shadow-surface);
  color: var(--ds-color-text);
  background: var(--ds-color-canvas);
  font-family: var(--ds-font-family);
}

.app-shell .danger-button {
  border-color: var(--ds-color-danger);
  background: var(--ds-color-danger);
  color: #ffffff;
}

.app-shell .status-badge[data-tone='danger'],
.app-shell [data-tone='danger'].status-badge {
  border-color: #facbd1;
  background: var(--ds-color-danger-soft);
  color: #b32c3b;
}

.ds-page-header {
  display: flex;
  min-width: 0;
  align-items: flex-end;
  justify-content: space-between;
  gap: var(--ds-space-5);
  padding: 0 0 var(--ds-space-4);
  border-bottom: 1px solid var(--ds-color-border);
}

.ds-page-header__copy {
  display: grid;
  min-width: 0;
  gap: var(--ds-space-1);
}

.ds-page-header__eyebrow,
.ds-page-header h1,
.ds-page-header h2,
.ds-page-header p {
  margin: 0;
}

.ds-page-header__eyebrow {
  color: var(--ds-color-text-muted);
  font-size: var(--ds-font-size-xs);
  font-weight: 750;
}

.ds-page-header h1,
.ds-page-header h2 {
  color: var(--ds-color-text);
  font-size: var(--ds-font-size-title);
  letter-spacing: -0.03em;
}

.ds-page-header p {
  color: var(--ds-color-text-muted);
  font-size: var(--ds-font-size-sm);
}

.ds-page-header__actions,
.ds-toolbar {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--ds-space-3);
}

.ds-surface {
  min-width: 0;
  border: 1px solid var(--ds-color-border);
  border-radius: var(--ds-radius-lg);
  background: var(--ds-color-surface);
  padding: var(--ds-space-5);
  box-shadow: var(--ds-shadow-surface);
}

.ds-surface[data-density='compact'] {
  padding: var(--ds-space-4);
}

.ds-toolbar {
  min-height: 44px;
  border: 1px solid var(--ds-color-border);
  border-radius: var(--ds-radius-md);
  background: var(--ds-color-surface);
  padding: var(--ds-space-3);
}

.ds-tabs {
  display: flex;
  min-width: 0;
  border-bottom: 1px solid var(--ds-color-border);
}

.app-shell .ds-tabs button {
  min-height: 42px;
  flex: 1 1 0;
  border: 0;
  border-bottom: 2px solid transparent;
  border-radius: 0;
  background: transparent;
  color: var(--ds-color-text-faint);
  padding: 0 var(--ds-space-4);
  font-size: var(--ds-font-size-sm);

  .app-shell[data-layout-mode='mobile'] .dashboard-kpi-card:nth-child(n),

  .app-shell[data-layout-mode='mobile'] .admin-dashboard-card:nth-child(n),

  .app-shell[data-layout-mode='mobile'] .manufacturing-metrics > span:nth-child(n) {

  .app-shell[data-layout-mode='mobile'] .dashboard-kpi-card[data-variant='warning'],
  .app-shell[data-layout-mode='mobile'] .admin-dashboard-card[data-tone='danger'],

  .app-shell[data-layout-mode='mobile'] .manufacturing-metrics > span[data-tone='blocked'] {

  .app-shell[data-layout-mode='mobile'] .mobile-project-dday,
  .app-shell[data-layout-mode='mobile'] .status-badge,
  .app-shell[data-layout-mode='mobile'] .material-status-badge,
  .app-shell[data-layout-mode='mobile'] .receipt-completion-badge,
  .app-shell[data-layout-mode='mobile'] .order-item-badge,

  }

  .app-shell[data-layout-mode='mobile'] .nav-badge,
  .app-shell[data-layout-mode='mobile'] .quality-section-label strong,
  .app-shell[data-layout-mode='mobile'] .quality-item > header > span,
  .app-shell[data-layout-mode='mobile'] .manufacturing-step-list li > span {
    border-radius: 50%;
  }
}

/*
 * FABLE Graphite — precision monochrome wireframe, generation 2.
 * Replaces DESIGN-000 Change 001 flattening with an intentional system:
 * hairline structure, confident black, compact radii, tabular numerals,
 * depth only on floating layers, and color reserved for semantic status.
 * This file is the single visual authority; it loads last in the cascade.
 */

/* ── 00 · Tokens ─────────────────────────────────────────────────────── */
:root {
  --wire-black: #111111;
  --wire-ink: #1a1a1a;
  --wire-muted: #555555;
  --wire-faint: #757575;
  --wire-line: #e4e4e4;
  --wire-line-strong: #d0d0d0;
  --wire-hairline: #eeeeee;
  --wire-canvas: #fafafa;
  --wire-surface: #ffffff;
  --wire-subtle: #f5f5f5;

  --wire-radius-tag: 4px;
  --wire-radius-control: 6px;
  --wire-radius-surface: 10px;
  --wire-radius-overlay: 14px;
  --wire-shadow-menu: 0 8px 24px rgb(17 17 17 / 10%);
  --wire-shadow-overlay: 0 24px 64px rgb(17 17 17 / 16%);
  --wire-scrim: rgb(17 17 17 / 44%);

  --wire-status-success-bg: #f0f8f3;
  --wire-status-success-line: #cbe5d4;
  --wire-status-success-text: #1d6f45;
  --wire-status-danger-bg: #fcf1f2;
  --wire-status-danger-line: #eecdd2;
  --wire-status-danger-text: #ab2231;
  --wire-status-warning-bg: #fbf5e6;
  --wire-status-warning-line: #e8d9b0;
  --wire-status-warning-text: #7d5a10;
  --wire-status-info-bg: #f0f4fb;
  --wire-status-info-line: #ccd9ee;
  --wire-status-info-text: #2f5591;

  --auth-brand: var(--wire-black);
  --auth-brand-glow: #3a3a3a;
  --auth-ink: var(--wire-ink);
  --auth-muted: var(--wire-muted);
  --brand-red: var(--wire-black);
  --brand-red-strong: #2b2b2b;
  --brand-red-deep: #000000;
  --brand-red-soft: var(--wire-subtle);
  --brand-red-wash: #f7f7f7;
  --canvas: var(--wire-canvas);
  --surface: var(--wire-surface);
  --surface-subtle: #fcfcfc;
  --ink: var(--wire-ink);
  --muted: var(--wire-muted);
  --line: var(--wire-line);
  --line-strong: var(--wire-line-strong);
  --shadow-soft: none;
  --shadow-card: none;
  --radius-shell: var(--wire-radius-surface);
  --radius-card: 8px;
  --radius-control: var(--wire-radius-control);

  --ds-color-canvas: var(--wire-canvas);
  --ds-color-surface: var(--wire-surface);
  --ds-color-surface-subtle: #fcfcfc;
  --ds-color-surface-active: #efefef;
  --ds-color-primary: var(--wire-black);
  --ds-color-primary-hover: #2b2b2b;
  --ds-color-primary-strong: #000000;
  --ds-color-primary-soft: var(--wire-subtle);
  --ds-color-text: var(--wire-ink);
  --ds-color-text-muted: var(--wire-muted);
  --ds-color-text-faint: var(--wire-faint);
  --ds-color-border: var(--wire-line);
  --ds-color-border-strong: var(--wire-line-strong);
  --ds-color-danger: var(--wire-status-danger-text);
  --ds-color-danger-soft: var(--wire-status-danger-bg);
  --ds-color-warning: var(--wire-status-warning-text);
  --ds-color-warning-soft: var(--wire-status-warning-bg);
  --ds-color-success: var(--wire-status-success-text);
  --ds-color-success-soft: var(--wire-status-success-bg);
  --ds-radius-xs: 4px;
  --ds-radius-sm: 6px;
  --ds-radius-md: 8px;
  --ds-radius-lg: 10px;
  --ds-radius-pill: 999px;
  --ds-shape-surface-radius: 10px;
  --ds-shape-control-radius: 6px;
  --ds-shape-active-radius: 10px;
  --ds-shape-warning-cut: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 0 100%);
  --ds-shadow-surface: none;
  --ds-shadow-overlay: var(--wire-shadow-overlay);
  --ds-sidebar-width: 208px;
  --ds-topbar-height: 56px;
  --ds-font-size-title: 20px;
}

/* ── 01 · Canvas and base typography ─────────────────────────────────── */
html,
body,
#root {
  background: var(--wire-canvas);
}

.app-shell {
  --sales-blue: var(--wire-black);
  --sales-ink: var(--wire-ink);
  --sales-muted: var(--wire-muted);
  --sales-line: var(--wire-line);
  --quality-red: var(--wire-black);
  --quality-green: var(--wire-ink);
  --quality-green-soft: var(--wire-subtle);
  --pending-green: var(--wire-black);
  --pending-ink: var(--wire-ink);
  --pending-soft: var(--wire-subtle);
  --preference-green: var(--wire-black);
  --preference-ink: var(--wire-ink);
  --preference-line: var(--wire-line);
  --preference-soft: var(--wire-subtle);
  --logistics-coral: #555555;
  --logistics-ink: var(--wire-ink);
  --logistics-mint: #f0f0f0;
  --logistics-navy: var(--wire-black);
  --logistics-sand: var(--wire-canvas);
  --logistics-teal: #444444;
  color: var(--wire-ink);
  background: var(--wire-canvas);
  font-size: 13px;
  line-height: 1.5;
}

.app-shell *,
.auth-gate * {
  text-shadow: none !important;
}

/* ── 02 · Blanket monochrome normalization ───────────────────────────── */
/* Graphite uses hairlines and tone, not decorative color, for hierarchy. */
.app-shell * {
  border-color: var(--wire-line) !important;
  border-radius: 0 !important;
  box-shadow: none !important;
  color: var(--wire-ink) !important;
}

.app-shell :where(p, small, label, .eyebrow, [class*='muted'], [class*='description'], [class*='meta']) {
  color: var(--wire-muted) !important;
}

.app-shell :where(.eyebrow, [class*='eyebrow']) {
  color: var(--wire-faint) !important;
  font-size: 11px !important;
  font-weight: 600 !important;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.app-shell :where(
  article,
  section,
  aside,
  fieldset,
  details,
  dialog,
  table,
  thead,
  tbody,
  tfoot,
  tr,
  td,
  th,
  form,
  [class*='card'],
  [class*='panel'],
  [class*='surface'],
  [class*='workspace'],
  [class*='toolbar'],
  [class*='drawer'],
  [class*='popover'],
  [class*='modal'],
  [class*='hero']
) {
  border-color: var(--wire-line) !important;
  background-color: var(--wire-surface) !important;
  background-image: none !important;
  box-shadow: none !important;
}

/* Compact radius scale, assigned by role (later rules win over the reset). */
.app-shell :where(
  article,
  section,
  aside,
  fieldset,
  details,
  dialog,
  [class*='card'],
  [class*='panel'],
  [class*='surface'],
  [class*='workspace'],
  [class*='toolbar'],
  [class*='hero'],
  [class*='banner'],
  [class*='widget'],
  [class*='guidance'],
  [class*='note']
) {
  border-radius: var(--wire-radius-surface) !important;
}

.app-shell :where(
  button,
  input,
  select,
  textarea,
  summary,
  [role='button'],
  [role='tab'],
  [class*='chip'],
  [class*='pill'],
  [class*='toggle']
) {
  border-radius: var(--wire-radius-control) !important;
  box-shadow: none !important;
}

.app-shell :where(span, i, em, b) {
  background-color: transparent !important;
  background-image: none !important;
}

.app-shell :where(h1, h2, h3, h4) {
  font-weight: 600;
  letter-spacing: -0.01em;
}

.app-shell :where(h3) {
  font-size: 16px;
}

.app-shell :where(h4) {
  font-size: 14px;
}

.app-shell :where(.muted-text, .empty-text) {
  color: var(--wire-muted) !important;
  font-weight: 400 !important;
}

.app-shell :where(.error-text) {
  color: var(--wire-status-danger-text) !important;
  font-weight: 600 !important;
}

.app-shell ::selection {
  background: var(--wire-black);
  color: #ffffff;
}

/* ── 03 · Controls ───────────────────────────────────────────────────── */
.app-shell button,
.app-shell input,
.app-shell select,
.app-shell textarea {
  min-height: 38px;
  font-weight: 500;
}

.app-shell :where(input, select, textarea) {
  border-color: var(--wire-line-strong) !important;
  background-color: var(--wire-surface) !important;
  color: var(--wire-ink) !important;
  accent-color: var(--wire-black) !important;
}

.app-shell :where(input, select, textarea)::placeholder {
  color: var(--wire-faint) !important;
}

.app-shell button:not(:disabled) {
  border-color: var(--wire-line-strong);
  background-color: var(--wire-surface);
  background-image: none !important;
  color: var(--wire-ink);
}

.app-shell button:hover:not(:disabled) {
  border-color: #a3a3a3;
  background-color: var(--wire-subtle);
  color: var(--wire-black);
}

.app-shell button:active:not(:disabled) {
  background-color: #eeeeee;
}

.app-shell button:disabled {
  border-color: var(--wire-line) !important;
  background-color: #f6f6f6 !important;
  background-image: none !important;
  color: #9e9e9e !important;
  opacity: 1;
}

.app-shell :where(
  .primary-button,
  .app-nav-button.active,
  .app-nav-button[aria-current='page'],
  .secondary-button.active,
  .tab-button.active,
  .segmented-control button[aria-selected='true'],
  [role='tab'][aria-selected='true'],
  button[aria-pressed='true'],
  button[data-active='true']
) {
  border-color: var(--wire-black) !important;
  background-color: var(--wire-black) !important;
  background-image: none !important;
  color: #ffffff !important;
}

.app-shell :where(
  .primary-button,
  .app-nav-button.active,
  .app-nav-button[aria-current='page'],
  .secondary-button.active,
  .tab-button.active,
  .segmented-control button[aria-selected='true'],
  [role='tab'][aria-selected='true'],
  button[aria-pressed='true'],
  button[data-active='true']
) * {
  color: #ffffff !important;
}

.app-shell :where(
  .primary-button,
  .app-nav-button.active,
  .app-nav-button[aria-current='page'],
  .secondary-button.active,
  .tab-button.active,
  .segmented-control button[aria-selected='true'],
  [role='tab'][aria-selected='true'],
  button[aria-pressed='true'],
  button[data-active='true']
):hover:not(:disabled) {
  border-color: #000000 !important;
  background-color: #2b2b2b !important;
  color: #ffffff !important;
}

.app-shell .primary-button {
  font-weight: 600;
}

.app-shell .danger-button:not(:disabled) {
  border-color: var(--wire-status-danger-text) !important;
  background-color: var(--wire-status-danger-text) !important;
  color: #ffffff !important;
}

.app-shell .danger-button:hover:not(:disabled) {
  border-color: #8f1c29 !important;
  background-color: #8f1c29 !important;
}

/* Underline tabs stay flat inside their strip. */
.app-shell .ds-tabs button,
.app-shell :where(.panel-workspace-tabs button, .ds-choice-group > button) {
  border-radius: 0 !important;
}

.app-shell :where(a, .link-button) {
  color: var(--wire-ink);
  text-decoration-color: var(--wire-line-strong);
  text-underline-offset: 3px;
}

.app-shell :where(hr, [class*='divider']) {
  border-color: var(--wire-hairline) !important;
}

.app-shell :where(button, input, select, textarea, [tabindex]):focus-visible {
  outline: 2px solid var(--wire-black) !important;
  outline-offset: 2px;
}

.app-shell [role='radio'] i {
  width: 20px !important;
  height: 20px !important;
  border: 1.5px solid var(--wire-line-strong) !important;
  border-radius: 50% !important;
  background: var(--wire-surface) !important;
  box-shadow: none !important;
}

.app-shell [role='radio'][aria-checked='true'] i {
  border-color: var(--wire-black) !important;
  background: var(--wire-black) !important;
}

/* ── 04 · Tables: one editorial system ───────────────────────────────── */
.app-shell thead th:not(.production-calendar-stage-cell):not(.production-calendar-date-cell):not(.calendar-company-holiday):not(.calendar-red-day):not(.g2-red-day) {
  border-bottom: 1px solid var(--wire-ink) !important;
  background-color: var(--wire-surface) !important;
  color: var(--wire-muted) !important;
  font-size: 11px !important;
  font-weight: 600 !important;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.app-shell :where(tbody td) {
  border-bottom-color: var(--wire-hairline) !important;
  font-variant-numeric: tabular-nums;
}

.app-shell :where(tbody tr:hover > td) {
  background-color: #f7f7f7 !important;
}

@media (min-width: 861px) {
  .app-shell :where(tbody td) {
    font-size: 13px;
  }
}

/* Calendar day semantics keep quiet tints instead of full flattening. */
.app-shell :where(td, th).calendar-company-holiday {
  background-color: var(--wire-subtle) !important;
}

.app-shell :where(td, th).calendar-red-day {
  background-color: var(--wire-status-danger-bg) !important;
  color: var(--wire-status-danger-text) !important;
}

.app-shell :where(
  tr[aria-selected='true'],
  tr[data-selected='true'],
  [class*='row'][data-active='true'],
  [class*='item'][data-active='true'],
  [class*='card'][data-active='true']
) {
  border-color: var(--wire-black) !important;
  background-color: var(--wire-subtle) !important;
  color: var(--wire-ink) !important;
}

.app-shell :where(tr[aria-selected='true'] > td, tr[data-selected='true'] > td) {
  background-color: var(--wire-subtle) !important;
}

/* ── 05 · Desktop shell ──────────────────────────────────────────────── */
.app-shell :where(
  .app-sidebar,
  .mobile-app-bar,
  .mobile-menu-drawer,
  .topbar,
  .page-header,
  .ds-page-header,
  .ds-toolbar,
  .ds-surface
) {
  border-color: var(--wire-line) !important;
  background: var(--wire-surface) !important;
  box-shadow: none !important;
}

.app-shell :where(.page-surface, .app-content, main) {
  background: transparent !important;
}

.app-shell .page-surface {
  border-top-width: 1px !important;
  background-color: var(--wire-surface) !important;
}

/* Red-era decorative shapes (orbits, rotated blocks, corner glows) are noise
 * in a monochrome system; structure carries the hierarchy instead. */
.app-shell .topbar::before,
.app-shell .topbar::after,
.app-shell .app-sidebar::after,
.app-shell .kitting-hero-orbit,
.app-shell .kitting-hero-block {
  display: none !important;
}

@media (min-width: 861px) {
  .app-shell {
    width: 100%;
    max-width: none;
    gap: 0;
    padding: 0;
  }

  .app-sidebar {
    position: sticky;
    top: 0;
    min-height: 100vh;
    max-height: 100vh;
    overflow-y: auto;
    border: 0 !important;
    border-right: 1px solid var(--wire-line) !important;
    border-radius: 0 !important;
    padding: 20px 14px 16px;
  }

  .app-brand-lockup {
    border-bottom: 1px solid var(--wire-hairline) !important;
    padding: 0 4px 16px;
  }

  .app-brand-lockup img {
    width: 118px;
    border-radius: var(--wire-radius-control) !important;
    background: var(--wire-black) !important;
    padding: 7px 9px;
  }

  .app-brand-lockup span {
    color: var(--wire-faint) !important;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.14em;
  }

  .app-sidebar-heading {
    padding: 2px 4px 0;
  }

  .app-sidebar-heading strong {
    font-size: 13px;
    font-weight: 600;
  }

  .app-nav-button {
    min-height: 36px;
    border-color: transparent !important;
    border-radius: var(--wire-radius-control) !important;
    background: transparent;
    color: var(--wire-muted) !important;
    padding: 0 10px;
    font-size: 13px;
    font-weight: 500;
  }

  .app-nav-button:hover:not(:disabled) {
    border-color: transparent !important;
    background: var(--wire-subtle);
    color: var(--wire-ink) !important;
  }

  .app-nav-group-label {
    margin: 10px 4px 2px;
    color: var(--wire-faint) !important;
    font-size: 10.5px !important;
    font-weight: 600 !important;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  /* Department parents are whole-row disclosures; the chevron is visual only. */
  .app-nav-disclosure {
    display: inline-block;
    color: var(--wire-faint) !important;
    font-size: 13px;
    line-height: 1;
    transition: transform 120ms ease;
  }

  .app-nav-button[aria-expanded='true'] .app-nav-disclosure {
    transform: rotate(180deg);
  }

  .app-nav-children {
    display: grid;
    gap: 2px;
    margin: 2px 0 4px;
    padding-left: 22px;
  }

  .app-shell .app-nav-child-button {
    min-height: 32px;
    padding: 0 10px;
    border: 0 !important;
    border-left: 1px solid var(--wire-line) !important;
    border-radius: 0 var(--wire-radius-control) var(--wire-radius-control) 0 !important;
    background: transparent !important;
    color: var(--wire-muted) !important;
    font-size: 12.5px;
    font-weight: 500;
    text-align: left;
  }

  .app-shell .app-nav-child-button:hover:not(:disabled) {
    background: var(--wire-subtle) !important;
    color: var(--wire-ink) !important;
  }

  .app-shell .app-nav-child-button.active {
    background: var(--wire-subtle) !important;
    color: var(--wire-black) !important;
    font-weight: 600;
  }

  .app-content {
    padding: 0 28px 40px;
  }

  .topbar {
    min-height: 56px;
    margin: 0 -28px 20px;
    align-items: center;
    border: 0 !important;
    border-bottom: 1px solid var(--wire-line) !important;
    border-radius: 0 !important;
    padding: 8px 28px;
  }

  .app-shell .page-surface {
    padding: 24px;
  }

  .app-shell .system-strip {
    margin-bottom: 12px;
  }

  .topbar h1 {
    color: var(--wire-muted) !important;
    font-size: 13px !important;
    font-weight: 600 !important;
    letter-spacing: 0.02em !important;
  }

  .app-shell .account-identity-trigger {
    min-width: 176px;
    min-height: 38px;
  }
}

/* ── 06 · Page scaffold: headers, toolbars, tabs ─────────────────────── */
.app-shell :where(.page-header, .ds-page-header, .subsection-header) {
  border: 0 !important;
  border-bottom: 1px solid var(--wire-line) !important;
  border-radius: 0 !important;
  background: transparent !important;
}

.app-shell :where(.page-header, .ds-page-header, .mobile-page-header, .mobile-operations-header) :where(h1, h2) {
  font-size: var(--ds-font-size-title) !important;
  font-weight: 600 !important;
  letter-spacing: -0.01em !important;
}

/* Legacy hero regions carried oversized clamp() titles; one title scale now. */
.app-shell [class*='hero'] :where(h1, h2) {
  font-size: var(--ds-font-size-title) !important;
  font-weight: 600 !important;
  letter-spacing: -0.01em !important;
}

.app-shell :where(.page-header, .ds-page-header) > div > p:not(.eyebrow),
.ds-page-header p {
  color: var(--wire-muted) !important;
  font-size: 12.5px;
}

.app-shell .ds-toolbar {
  min-height: 44px;
