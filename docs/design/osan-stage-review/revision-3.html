/* ── 10 · Shared guidance patterns ───────────────────────────────────── */
.ds-breadcrumbs {
  margin: 0 0 10px;
}

.ds-breadcrumbs ol {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.ds-breadcrumbs li {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--wire-faint);
  font-size: 11px;
}

.ds-breadcrumbs li:not(:last-child)::after {
  content: '/';
  color: var(--wire-line-strong);
}

.app-shell .ds-breadcrumbs button {
  min-height: 0;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--wire-muted);
  font-weight: 500;
  text-decoration: underline;
  text-underline-offset: 3px;
}

.ds-breadcrumbs strong {
  color: var(--wire-ink);
  font-weight: 600;
}

.ds-readonly-banner {
  display: grid;
  grid-template-columns: 40px minmax(0, 1fr) auto;
  gap: 12px;
  align-items: center;
  margin: 0 0 12px;
  padding: 12px 14px;
  border: 1px solid var(--wire-line) !important;
  border-radius: var(--wire-radius-surface) !important;
  background: var(--wire-canvas) !important;
}

.ds-readonly-banner__mark {
  display: grid;
  min-height: 32px;
  place-items: center;
  border: 1px solid var(--wire-ink) !important;
  border-radius: var(--wire-radius-control) !important;
  color: var(--wire-ink);
  font-size: 10px;
  font-weight: 600;
}

.ds-readonly-banner[data-kind='prerequisite'] .ds-readonly-banner__mark {
  border-style: dashed !important;
}

.ds-readonly-banner > div:not(.ds-readonly-banner__action) {
  display: grid;
  gap: 2px;
}

.ds-readonly-banner strong,
.ds-readonly-banner p {
  margin: 0;
}

.ds-readonly-banner strong {
  font-size: 13px;
  font-weight: 600;
}

.ds-readonly-banner p {
  color: var(--wire-muted);
  font-size: 12px;
}

.ds-empty-state {
  display: grid;
  grid-template-columns: 44px minmax(0, 1fr) auto;
  gap: 14px;
  align-items: center;
  min-height: 96px;
  padding: 18px 20px;
  border: 1px solid var(--wire-line) !important;
  border-radius: var(--wire-radius-surface) !important;
  background: var(--wire-canvas) !important;
}

.ds-empty-state > span {
  display: grid;
  width: 40px;
  height: 40px;
  place-items: center;
  border: 1px solid var(--wire-line-strong) !important;
  border-radius: 50% !important;
  color: var(--wire-faint) !important;
  font-size: 0 !important;
  font-weight: 600;
}

.ds-empty-state > span::before {
  content: '—';
  font-size: 14px;
}

.ds-empty-state > div {
  display: grid;
  gap: 3px;
}

.ds-empty-state strong,
.ds-empty-state p {
  margin: 0;
}

.ds-empty-state strong {
  font-size: 14px;
  font-weight: 600;
}

.ds-empty-state p {
  color: var(--wire-muted);
  font-size: 12px;
}

.ds-empty-state > div:last-child {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: flex-end;
}

/* Unified async/permission state panel (DsStatePanel). */
.ds-state-panel {
  display: grid;
  grid-template-columns: 44px minmax(0, 1fr) auto;
  gap: 14px;
  align-items: center;
  min-height: 96px;
  padding: 18px 20px;
  border: 1px solid var(--wire-line) !important;
  border-radius: var(--wire-radius-surface) !important;
  background: var(--wire-canvas) !important;
}

.ds-state-panel__mark {
  display: grid;
  width: 40px;
  height: 40px;
  place-items: center;
  border: 1px solid var(--wire-line-strong) !important;
  border-radius: 50% !important;
  color: var(--wire-faint) !important;
  font-size: 12px;
  font-weight: 600;
}

.ds-state-panel[data-kind='error'] .ds-state-panel__mark,
.ds-state-panel[data-kind='forbidden'] .ds-state-panel__mark,
.ds-state-panel[data-kind='not-found'] .ds-state-panel__mark {
  border-color: var(--wire-status-danger-line) !important;
  background: var(--wire-status-danger-bg) !important;
  color: var(--wire-status-danger-text) !important;
}

.ds-state-panel__copy {
  display: grid;
  gap: 3px;
  min-width: 0;
}

.ds-state-panel__title {
  margin: 0;
  font-size: 14px;
  font-weight: 600;
}

.app-shell .ds-state-panel p.ds-state-panel__message {
  margin: 0;
  color: var(--wire-muted) !important;
  font-size: 12.5px;
  font-weight: 400 !important;
}

.app-shell .ds-state-panel[data-kind='error'] p.ds-state-panel__message,
.app-shell .ds-state-panel[data-kind='forbidden'] p.ds-state-panel__message,
.app-shell .ds-state-panel[data-kind='not-found'] p.ds-state-panel__message {
  color: var(--wire-status-danger-text) !important;
  font-weight: 500 !important;
}

.ds-state-panel__action {
  display: flex;
  gap: 8px;
}

.ds-state-panel__bars {
  display: grid;
  gap: 6px;
  margin-top: 8px;
}

.app-shell .ds-state-panel__bars i {
  display: block;
  height: 8px;
  border-radius: 4px !important;
  background: linear-gradient(90deg, #ededed 25%, #f7f7f7 50%, #ededed 75%) !important;
  background-size: 200% 100% !important;
  animation: ds-state-shimmer 1.4s ease infinite;
}

.app-shell .ds-state-panel__bars i:nth-child(1) { width: 82%; }
.app-shell .ds-state-panel__bars i:nth-child(2) { width: 64%; }
.app-shell .ds-state-panel__bars i:nth-child(3) { width: 46%; }

@keyframes ds-state-shimmer {
  from { background-position: 200% 0; }
  to { background-position: -200% 0; }
}

.ds-secondary-tools {
  position: relative;
  width: max-content;
  margin-left: auto;
  border: 0 !important;
  background: transparent !important;
}

.ds-secondary-tools > summary {
  min-height: 36px;
  padding: 8px 12px;
  border: 1px solid var(--wire-line-strong);
  cursor: pointer;
  font-size: 12px;
  font-weight: 500;
  list-style: none;
}

.ds-secondary-tools > summary::after {
  content: ' +';
  color: var(--wire-faint);
}

.ds-secondary-tools[open] > summary::after {
  content: ' −';
}

.app-shell .ds-secondary-tools > div {
  position: absolute;
  z-index: 20;
  top: calc(100% + 6px);
  right: 0;
  display: grid;
  min-width: 210px;
  gap: 6px;
  padding: 8px;
  border: 1px solid var(--wire-line) !important;
  border-radius: var(--wire-radius-overlay) !important;
  background: var(--wire-surface);
  box-shadow: var(--wire-shadow-menu) !important;
}

.ds-selection-mode-trigger {
  min-height: 36px;
  padding-inline: 12px;
}

.ds-selection-mode-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
  justify-content: space-between;
  padding: 10px 12px;
  border: 1px solid var(--wire-black) !important;
  border-radius: var(--wire-radius-surface) !important;
  background: var(--wire-canvas) !important;
}

.ds-selection-mode-bar > div {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}

.ds-selection-mode-bar strong {
  font-size: 13px;
  font-weight: 600;
}

.ds-selection-mode-bar span {
  color: var(--wire-muted);
  font-size: 12px;
}

.ds-selection-mode-bar button {
  min-height: 34px;
}

.app-shell .bulk-action-bar {
  border: 1px solid var(--wire-line) !important;
  border-radius: var(--wire-radius-surface) !important;
  background: var(--wire-canvas) !important;
}

/* ── 11 · Department input system ────────────────────────────────────── */
.ds-input-flow {
  display: grid;
  min-width: 0;
  border: 1px solid var(--wire-line) !important;
  border-radius: var(--wire-radius-surface) !important;
  background: var(--wire-surface);
  /* Preserve rounded-edge clipping without creating a scroll container.
   * `overflow: hidden` made nested table headers sticky to this full-height
   * card instead of the viewport, so long edit grids scrolled their header
   * out of view. */
  overflow: clip;
  container-type: inline-size;
}

.ds-input-flow__header {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 24px;
  align-items: center;
  padding: 18px 20px;
  border-bottom: 1px solid var(--wire-line) !important;
}

.ds-input-flow__header > div {
  display: grid;
  min-width: 0;
  gap: 4px;
}

.ds-input-flow__header > div > span {
  color: var(--wire-faint) !important;
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.ds-input-flow__header h3,
.ds-input-flow__header p {
  margin: 0;
}

.ds-input-flow__header h3 {
  font-size: 16px;
  overflow-wrap: anywhere;
}

.ds-input-flow__header p {
  color: var(--wire-muted) !important;
  font-size: 12.5px;
  overflow-wrap: anywhere;
}

.ds-input-flow__header ol {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  width: min(100%, 420px);
  min-width: 0;
  justify-self: end;
  margin: 0;
  padding: 0;
  border: 1px solid var(--wire-line) !important;
  border-radius: var(--wire-radius-control) !important;
  overflow: hidden;
  list-style: none;
}

.ds-input-flow__header li {
  display: grid;
  grid-template-columns: 24px minmax(0, 1fr);
  align-items: center;
  gap: 7px;
  min-height: 38px;
  padding: 6px 9px;
  border-right: 1px solid var(--wire-hairline) !important;
  font-size: 11.5px;
  font-weight: 600;
}

.ds-input-flow__header li:last-child {
  border-right: 0 !important;
}

.ds-input-flow__header li b {
  display: grid;
  width: 22px;
  height: 22px;
  place-items: center;
  border: 1px solid var(--wire-black) !important;
  border-radius: var(--wire-radius-tag) !important;
  background: var(--wire-black) !important;
  color: #ffffff !important;
  font-size: 11px;
  font-variant-numeric: tabular-nums;
}

@container (max-width: 620px) {
  .ds-input-flow__header {
    grid-template-columns: minmax(0, 1fr);
    gap: 12px;
    padding: 14px;
  }

  .ds-input-flow__header ol {
    width: 100%;
    justify-self: stretch;
  }

  .ds-input-flow__header li {
    grid-template-columns: 22px minmax(0, 1fr);
    gap: 5px;
    padding-inline: 7px;
  }
}

.ds-input-flow__body {
  display: grid;
  min-width: 0;
}

.ds-input-section {
  display: grid;
  min-width: 0;
  border-bottom: 1px solid var(--wire-line) !important;
  background: var(--wire-surface);
}

.ds-input-section:last-child {
  border-bottom: 0 !important;
}

.ds-input-section__header {
  display: grid;
  grid-template-columns: 36px minmax(0, 1fr) auto;
  gap: 12px;
  align-items: center;
  min-height: 56px;
  padding: 11px 16px;
  border-bottom: 1px solid var(--wire-hairline) !important;
  background: var(--wire-canvas) !important;
}

.ds-input-section__header > b {
  display: grid;
  width: 32px;
  height: 32px;
  place-items: center;
  border: 1px solid var(--wire-black) !important;
  border-radius: var(--wire-radius-control) !important;
  font-size: 11px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.ds-input-section__header > div:not(.ds-input-section__actions) {
  display: grid;
  gap: 2px;
}

.ds-input-section__header h4,
.ds-input-section__header p {
  margin: 0;
}

.ds-input-section__header h4 {
  font-size: 14px;
}

.ds-input-section__header p {
  color: var(--wire-muted) !important;
  font-size: 12px;
}

.ds-input-section__actions,
.ds-input-section__content {
  min-width: 0;
}

.ds-input-section__actions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  justify-content: flex-end;
}

.ds-input-section__content {
  padding: 16px;
}

.ds-input-section__content > :first-child {
  margin-top: 0;
}

.ds-input-section__content > :last-child {
  margin-bottom: 0;
}

.ds-input-section--collapsible > summary {
  cursor: pointer;
  list-style: none;
}

.ds-input-section--collapsible > summary::-webkit-details-marker {
  display: none;
}

.ds-input-section__toggle {
  min-width: 52px;
  padding: 6px 8px;
  border: 1px solid var(--wire-line-strong);
  border-radius: var(--wire-radius-control);
  color: var(--wire-muted);
  font-size: 11px;
  font-weight: 600;
  text-align: center;
}

.ds-input-section--collapsible[open] .ds-input-section__toggle::before {
  content: '접기';
}

.ds-input-section--collapsible[open] .ds-input-section__toggle {
  font-size: 0;
}

.ds-input-section--collapsible[open] .ds-input-section__toggle::before {
  font-size: 11px;
}

.ds-field-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.ds-field-grid[data-columns='3'] {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

.ds-field-grid > .ds-field-span {
  grid-column: 1 / -1;
}

.ds-choice-group {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(116px, 1fr));
  border: 1px solid var(--wire-line-strong) !important;
  border-radius: var(--wire-radius-control) !important;
  overflow: hidden;
}

.app-shell .ds-choice-group > button {
  display: grid;
  min-height: 52px;
  gap: 3px;
  align-content: center;
  padding: 9px 12px;
  border: 0;
  border-right: 1px solid var(--wire-line-strong) !important;
  background: var(--wire-surface);
  text-align: left;
}

.app-shell .ds-choice-group > button:last-child {
  border-right: 0 !important;
}

.app-shell .ds-choice-group > button[aria-pressed='true'] {
  background: var(--wire-black) !important;
}

.app-shell .ds-choice-group > button[aria-pressed='true'] strong,
.app-shell .ds-choice-group > button[aria-pressed='true'] small {
  color: #ffffff !important;
}

/*
 * Dark wireframe surfaces must own their foreground contract too.
 * Several legacy components render the dark fill on a parent while a more
 * specific child rule keeps a dark foreground, which makes labels disappear.
 */
.app-shell :where(
  .production-control-version-list button.is-active,
  .production-plan-set-tabs > button.active,
  .production-plan-set-tabs > label.active,
  .production-control-template-step > b,
  .logistics-stage-switch button[aria-current='step'],
  .logistics-empty > span,
  .logistics-project-heading > span,
  .logistics-target-shape,
  .logistics-summary-circle,
  .logistics-confirm-box,
  .iqc-report-panel > header > span,
  .iqc-final-seal > i,
  .iqc-legacy-report > span,
  .department-workspace-heading > span,
  .excel-export-button > span,
  .account-photo-editor > span:last-child,
  .form-template-catalog > button i
) {
  background-color: var(--wire-black) !important;
  background-image: none !important;
  color: #ffffff !important;
}

.app-shell :where(
  .production-control-version-list button.is-active,
  .production-plan-set-tabs > button.active,
  .production-plan-set-tabs > label.active,
  .logistics-stage-switch button[aria-current='step'],
  .logistics-confirm-box
) :where(span, strong, small, b, em) {
  color: #ffffff !important;
}

.app-shell .logistics-stage-switch button[aria-current='step'] > span {
  border-color: #ffffff !important;
  background-color: #ffffff !important;
  color: var(--wire-black) !important;
}

/* The kitting selection bar is a dark emphasis surface; it owns a light
 * foreground so the count and actions stay readable on the ink fill. */
.app-shell .kitting-selection-bar {
  border-color: var(--wire-black) !important;
  border-radius: var(--wire-radius-surface) !important;
  background-color: var(--wire-black) !important;
}

.app-shell .kitting-selection-bar :where(span, small, b, strong) {
  color: #ffffff !important;
}

.app-shell .kitting-selection-count {
  color: #ffffff !important;
  font-size: 18px !important;
  font-weight: 600 !important;
  font-variant-numeric: tabular-nums;
}

.app-shell .kitting-selection-actions button:not(.primary-button):not(:disabled) {
  border-color: rgb(255 255 255 / 45%) !important;
  background-color: transparent !important;
  color: #ffffff !important;
}

.app-shell .kitting-selection-actions button:not(.primary-button):hover:not(:disabled) {
  border-color: #ffffff !important;
  background-color: rgb(255 255 255 / 16%) !important;
  color: #ffffff !important;
}

.app-shell .kitting-selection-actions button:disabled {
  border-color: rgb(255 255 255 / 25%) !important;
  background-color: rgb(255 255 255 / 12%) !important;
  color: rgb(255 255 255 / 60%) !important;
}

.app-shell .kitting-selection-bar .primary-button:not(:disabled) {
  border-color: #ffffff !important;
  background-color: #ffffff !important;
  color: var(--wire-black) !important;
}

.app-shell .kitting-selection-bar .primary-button:hover:not(:disabled) {
  border-color: #f0f0f0 !important;
  background-color: #f0f0f0 !important;
  color: var(--wire-black) !important;
}

.ds-choice-group strong {
  font-size: 13px;
  font-weight: 600;
}

.ds-choice-group small {
  color: var(--wire-muted) !important;
  font-size: 11px;
}

.ds-action-bar {
  position: sticky;
  z-index: var(--z-sticky, 10);
  bottom: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 16px;
  align-items: center;
  min-height: 64px;
  margin-top: 16px;
  padding: 11px 14px;
  border: 1px solid var(--wire-line) !important;
  border-radius: var(--wire-radius-surface) !important;
  background: rgba(255, 255, 255, 0.97) !important;
  box-shadow: 0 -8px 24px rgb(17 17 17 / 6%) !important;
}

.ds-action-bar__copy {
  display: grid;
  min-width: 0;
  gap: 2px;
}

.ds-action-bar__copy > strong {
  font-size: 13px;
  font-weight: 600;
}

.ds-action-bar__copy > span {
  color: var(--wire-muted) !important;
  font-size: 12px;
}

.ds-action-bar__feedback > .action-feedback {
  margin-top: 6px;
}

.ds-action-bar__buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: flex-end;
}

.ds-action-bar__buttons > button {
  min-height: 42px;
  padding-inline: 18px;
}

.app-shell .ds-input-flow :where(input, select, textarea) {
  min-height: 40px;
}

.app-shell .ds-input-flow textarea {
  min-height: 86px;
  resize: vertical;
}

.app-shell .ds-input-flow :where(.form-field, label:has(> input), label:has(> select), label:has(> textarea)) {
  gap: 6px;
}

/* ── 12 · Feedback and mode banners ──────────────────────────────────── */
.app-shell :where(.action-feedback, .account-action-feedback) {
  border: 1px solid var(--wire-line) !important;
  border-radius: var(--wire-radius-control) !important;
  background: var(--wire-surface) !important;
  color: var(--wire-muted) !important;
  font-size: 12px !important;
  font-weight: 500 !important;
}

.app-shell :where(.action-feedback, .account-action-feedback)[data-tone='loading'] {
  border-color: var(--wire-line) !important;
  background: var(--wire-subtle) !important;
  color: var(--wire-muted) !important;
}

.app-shell :where(.action-feedback, .account-action-feedback)[data-tone='success'] {
  border-color: var(--wire-status-success-line) !important;
  background: var(--wire-status-success-bg) !important;
  color: var(--wire-status-success-text) !important;
}

.app-shell :where(.action-feedback, .account-action-feedback)[data-tone='error'] {
  border-color: var(--wire-status-danger-line) !important;
  background: var(--wire-status-danger-bg) !important;
  color: var(--wire-status-danger-text) !important;
}

.app-shell :where(.action-feedback, .account-action-feedback)[data-tone='partial'] {
  border-color: var(--wire-status-warning-line) !important;
  background: var(--wire-status-warning-bg) !important;
  color: var(--wire-status-warning-text) !important;
}

.app-shell :where(.action-feedback, .account-action-feedback)[data-tone='info'] {
  border-color: var(--wire-status-info-line) !important;
  background: var(--wire-status-info-bg) !important;
  color: var(--wire-status-info-text) !important;
}

.app-shell .review-safe-banner {
  border: 1px solid var(--wire-status-warning-line) !important;
  border-radius: var(--wire-radius-surface) !important;
  background: var(--wire-status-warning-bg) !important;
  color: var(--wire-status-warning-text) !important;
  font-weight: 500;
}

.app-shell .review-safe-banner :where(strong, span) {
  color: var(--wire-status-warning-text) !important;
}

.app-shell .review-safe-banner strong {
  font-weight: 600;
}

.app-shell .review-safe-banner--checking {
  border-color: var(--wire-status-info-line) !important;
  background: var(--wire-status-info-bg) !important;
  color: var(--wire-status-info-text) !important;
}

.app-shell .review-safe-banner--error {
  border-color: var(--wire-status-danger-line) !important;
  background: var(--wire-status-danger-bg) !important;
  color: var(--wire-status-danger-text) !important;
}

.app-shell .review-safe-banner .review-safe-ledger-warning {
  color: var(--wire-status-danger-text) !important;
  font-weight: 600;
}

.app-shell .test-user-banner {
  border: 1px solid var(--wire-line) !important;
  border-radius: var(--wire-radius-surface) !important;
  background: var(--wire-surface) !important;
  color: var(--wire-ink) !important;
  font-weight: 500;
}

/* ── 13 · Overlays: dialogs, sheets, menus ───────────────────────────── */
.app-shell :where(.dialog-backdrop, .mobile-sheet-backdrop) {
  background: var(--wire-scrim) !important;
  backdrop-filter: none !important;
}

.app-shell .dialog {
  border: 1px solid var(--wire-line) !important;
  border-radius: var(--wire-radius-overlay) !important;
  background: var(--wire-surface) !important;
  box-shadow: var(--wire-shadow-overlay) !important;
}

.app-shell .dialog :where(h2, h3) {
  font-size: 16px;
  font-weight: 600;
}

.app-shell .dialog-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}

.app-shell .mobile-sheet {
  border: 1px solid var(--wire-line) !important;
  border-radius: 16px 16px 0 0 !important;
  background: var(--wire-surface) !important;
  box-shadow: var(--wire-shadow-overlay) !important;
}

.app-shell .mobile-sheet--full {
  border: 0 !important;
  border-radius: 0 !important;
}

.app-shell .mobile-sheet-header {
  border-bottom: 1px solid var(--wire-line) !important;
}

.app-shell .mobile-sheet-header h2 {
  font-size: 18px !important;
  font-weight: 600 !important;
  letter-spacing: -0.01em;
}

.app-shell .mobile-sheet-close {
  border: 1px solid var(--wire-line-strong) !important;
  border-radius: 50% !important;
  background: var(--wire-surface) !important;
  color: var(--wire-ink) !important;
}

.app-shell .mobile-sheet-footer {
  border-top: 1px solid var(--wire-line) !important;
  background: rgba(255, 255, 255, 0.97) !important;
  box-shadow: none !important;
}

/* ── 14 · Imagery and identity ───────────────────────────────────────── */
.app-shell img,
.auth-gate img {
  filter: grayscale(1) contrast(1.08);
}

.app-shell :where(.app-brand-lockup img, .mobile-app-brand img, .mobile-menu-brand-logo) {
  border-radius: var(--wire-radius-control) !important;
  background: var(--wire-black) !important;
}

/* The supplied EMI mark is the only color exception inside the monochrome
 * application shell. Keep the source pixels intact on every shared page. */
.app-shell .app-brand-logo {
  background: transparent !important;
  filter: none !important;
  object-fit: contain;
}

/* Identity photos remain circular because the shape denotes a person. */
.app-shell :where(.profile-avatar, .profile-avatar img) {
  border-radius: 50% !important;
}

/* ── 15 · Auth gate ──────────────────────────────────────────────────── */
.auth-gate,
.auth-login-canvas,
.auth-gate[data-auth-layout='login'] {
  background: var(--wire-canvas) !important;
  background-image: none !important;
}

.auth-brand-panel,
.auth-gate[data-auth-layout='login'] .auth-brand-panel {
  background: #0f0f0f !important;
  background-image: none !important;
}

.auth-gate-panel,
.auth-gate[data-auth-layout='login'] .auth-gate-panel {
  border: 1px solid var(--wire-line) !important;
  border-radius: var(--wire-radius-overlay) !important;
  background: var(--wire-surface) !important;
  box-shadow: none !important;
}

.auth-brand-panel::before,
.auth-brand-panel::after,
.auth-login-canvas::before,
.auth-brand-effect,
.auth-brand-dots {
  display: none !important;
}

.auth-loading-indicator::before,
.auth-gate[data-auth-layout='login'] .auth-loading-indicator::before {
  border-color: var(--wire-black) !important;
  border-right-color: transparent !important;
  border-radius: 50% !important;
}

.auth-primary-button,
.auth-secondary-button,
.auth-gate[data-auth-layout='login'] .auth-primary-button,
.auth-gate[data-auth-layout='login'] .remember-session-option input {
  border-radius: var(--wire-radius-control) !important;
  box-shadow: none !important;
}

.auth-primary-button,
.auth-gate[data-auth-layout='login'] .auth-primary-button {
  border: 1px solid var(--wire-black) !important;
  background: var(--wire-black) !important;
  color: #ffffff !important;
}

.auth-secondary-button {
  border-color: var(--wire-line-strong) !important;
  background: var(--wire-surface) !important;
  color: var(--wire-ink) !important;
}

.auth-primary-button:focus-visible,
.auth-secondary-button:focus-visible,
.remember-session-option input:focus-visible {
  outline: 2px solid var(--wire-black) !important;
  outline-offset: 2px;
}

/* Login keeps the approved desktop composition, while phones use the same
 * monochrome wireframe language as the rest of the mobile product. The EMI
 * source artwork is the only brand-colour exception. */
.auth-gate .auth-brand-logo {
  background: transparent !important;
  filter: none !important;
}

@media (max-width: 860px) {
  .auth-gate[data-auth-layout='login'] {
    position: fixed;
    inset: 0;
    overflow: auto;
    background: var(--wire-surface) !important;
  }

  .auth-gate[data-auth-layout='login'] .auth-login-canvas {
    position: relative;
    inset: auto;
    display: grid;
    width: 100%;
    min-height: 100%;
    height: auto;
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto 1fr;
    align-content: center;
    gap: 18px;
    overflow: visible;
    background: var(--wire-surface) !important;
    padding:
      max(28px, env(safe-area-inset-top))
      max(20px, env(safe-area-inset-right))
      max(28px, env(safe-area-inset-bottom))
      max(20px, env(safe-area-inset-left));
  }

  .auth-gate[data-auth-layout='login'] .auth-brand-panel {
    position: relative;
    display: grid;
    width: min(100%, 430px);
    height: auto;
    min-height: 0;
    justify-self: center;
    overflow: visible;
    place-items: center;
    background: transparent !important;
  }

  .auth-gate[data-auth-layout='login'] .auth-brand-canvas,
  .auth-gate[data-auth-layout='login'] .auth-brand-pattern-canvas {
    display: none;
  }

  .auth-gate[data-auth-layout='login'] .auth-brand-logo-canvas {
    position: static;
    display: grid;
    width: 100%;
    height: auto;
    place-items: center;
    transform: none;
  }

  .auth-gate[data-auth-layout='login'] .auth-brand-logo {
    position: static;
    display: block;
    width: min(100%, 320px);
    height: auto;
    object-fit: contain;
  }

  .auth-gate[data-auth-layout='login'] .auth-gate-panel {
    position: relative;
    display: grid;
    width: min(100%, 430px);
    height: auto;
    min-height: 0;
    align-self: start;
    justify-self: center;
    overflow: visible;
    border: 1px solid var(--wire-line-strong) !important;
    border-radius: var(--wire-radius-overlay) !important;
    padding: 28px 22px 24px;
  }

  .auth-gate[data-auth-layout='login'] .auth-gate-canvas {

  .auth-gate[data-auth-layout='login'] .auth-gate-content h1,

  .auth-gate[data-auth-layout='login'] .auth-gate-extra,

  .auth-gate[data-auth-layout='login'] .auth-gate-title-text {

    height: 104px;
    justify-self: center;

  .auth-gate[data-auth-layout='login'] .auth-microsoft-brand img {

  .auth-gate[data-auth-layout='login'] .auth-login-guidance {

  .auth-gate[data-auth-layout='login'] .remember-session-option {

/* ── 16 · Mobile shell (≤860px) ──────────────────────────────────────── */
@media (max-width: 860px) {

    background: var(--wire-surface) !important;
    box-shadow: none !important;
  }

  .app-shell[data-layout-mode='mobile'] .mobile-app-bar {
    border-bottom: 1px solid var(--wire-line) !important;
    backdrop-filter: none !important;
  }

  .app-shell[data-layout-mode='mobile'] .mobile-menu-trigger {
    width: 44px;
    min-width: 44px;
    height: 44px;
    min-height: 44px;
    border: 1px solid var(--wire-line-strong) !important;
    border-radius: var(--wire-radius-surface) !important;
    background: var(--wire-surface) !important;
    background-image: none !important;
    box-shadow: none !important;
  }

  .app-shell[data-layout-mode='mobile'] .mobile-menu-trigger::after {
    display: none;
  }

  .mobile-menu-trigger-lines i {
    height: 1.5px;

    background: var(--wire-ink) !important;
  }

  .app-shell[data-layout-mode='mobile'] .mobile-account-trigger {
    border-color: var(--wire-line-strong) !important;
    background: var(--wire-surface) !important;
  }

  /* The drawer renders through a portal, so bare selectors are required. */
  .mobile-menu-backdrop {
    background: var(--wire-scrim) !important;
    backdrop-filter: none !important;
  }

  .mobile-menu-drawer {
    border: 0 !important;
    border-right: 1px solid var(--wire-line) !important;

  .mobile-menu-header {

  }

  .mobile-menu-header .eyebrow {
    color: var(--wire-faint) !important;
    font-size: 10.5px !important;
    font-weight: 600 !important;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .mobile-menu-header h2 {
    color: var(--wire-ink) !important;
    font-size: 16px !important;
    font-weight: 600 !important;

  }

  .mobile-menu-brand-logo {
    border-radius: var(--wire-radius-control) !important;
    background: var(--wire-black) !important;
    filter: grayscale(1) contrast(1.08);
  }

  .mobile-menu-brand-logo.app-brand-logo {
    background: transparent !important;
    filter: none !important;
  }

  .app-shell[data-layout-mode='mobile'] .mobile-app-brand .app-brand-logo {
    width: 56px;
    height: 32px;
  }

  .mobile-menu-close {
    border: 1px solid var(--wire-line-strong) !important;
    border-radius: 50% !important;
    background: var(--wire-surface) !important;
    color: var(--wire-ink) !important;
    box-shadow: none !important;
  }

  .mobile-menu-list {
    background: var(--wire-surface) !important;
  }

  .mobile-menu-item {
    border: 1px solid transparent !important;
    border-radius: var(--ds-shape-surface-radius) !important;
    background: var(--wire-surface) !important;
    color: var(--wire-ink) !important;
    box-shadow: none !important;
    text-shadow: none !important;
  }

  .mobile-menu-item strong {
    color: var(--wire-ink) !important;
    font-weight: 600;
  }

  .mobile-menu-item small {
    color: var(--wire-muted) !important;
  }

  .mobile-menu-arrow {
    color: var(--wire-faint) !important;
  }

  .mobile-menu-item.active,
  .mobile-menu-item[aria-current='page'] {
    border-color: var(--wire-black) !important;
    background: var(--wire-black) !important;
  }

  .mobile-menu-item.active :where(strong, small, .mobile-menu-arrow),
  .mobile-menu-item[aria-current='page'] :where(strong, small, .mobile-menu-arrow) {
    color: #ffffff !important;
  }

  .mobile-menu-item-shape[data-shape-role] {
    display: grid;
    width: 26px;
    height: 26px;
    place-items: center;
    border-radius: var(--ds-semantic-radius, var(--wire-radius-control)) !important;
    clip-path: var(--ds-semantic-clip, none);
    background: var(--wire-subtle) !important;
    color: var(--wire-ink) !important;
  }

  .mobile-menu-item-shape[data-shape-role='active'] {
    background: var(--wire-black) !important;
    color: #ffffff !important;
  }

  .mobile-menu-item.active .mobile-menu-item-shape,
  .mobile-menu-item[aria-current='page'] .mobile-menu-item-shape {
    background: #ffffff !important;
    color: var(--wire-black) !important;
  }

  .mobile-menu-drawer .nav-badge {
    border: 0 !important;
    border-radius: 999px !important;
    background-color: #b52f40 !important;
    color: #ffffff !important;
  }

  /* Drawer department parents are whole-row disclosures (portal: bare
   * selectors required). */
  .mobile-menu-arrow--disclosure {
    transition: transform 120ms ease;
  }

  .mobile-menu-item[aria-expanded='true'] .mobile-menu-arrow--disclosure {
    transform: rotate(180deg);
  }

  .mobile-menu-children {
    display: grid;
    gap: 2px;
    margin: 0 0 4px;
    padding-left: 48px;
  }

  .mobile-menu-child-item {
    min-height: 48px;
    padding: 0 12px;
    border: 0 !important;
    border-left: 1px solid var(--wire-line) !important;
    border-radius: 0 var(--wire-radius-control) var(--wire-radius-control) 0 !important;
    background: transparent !important;
    color: var(--wire-muted) !important;
    font-size: 13px;
    font-weight: 500;
    text-align: left;
  }

  .mobile-menu-child-item.active {
    background: var(--wire-subtle) !important;
    color: var(--wire-black) !important;
    font-weight: 600;
  }

  .mobile-menu-drawer :where(button, [tabindex]):focus-visible {
    outline: 2px solid var(--wire-black) !important;
    outline-offset: 2px;
  }

  .app-shell[data-layout-mode='mobile'] .mobile-filter-trigger {
    border: 1px solid var(--wire-line-strong) !important;
    border-radius: var(--wire-radius-surface) !important;
    background: var(--wire-surface) !important;
    box-shadow: none !important;
  }

  .app-shell[data-layout-mode='mobile'] .mobile-filter-trigger strong {
    font-weight: 600;
  }

  .app-shell[data-layout-mode='mobile'] .mobile-filter-trigger small {
    color: var(--wire-muted) !important;
  }

  /* Role-driven geometry, never list-position-driven. */
  .app-shell[data-layout-mode='mobile'] .mobile-menu-item:nth-child(n):not(.active),
  .app-shell[data-layout-mode='mobile'] .home-hero--mobile,
  .app-shell[data-layout-mode='mobile'] .home-mobile-priority,
  .app-shell[data-layout-mode='mobile'] .home-widget:nth-of-type(n),
  .app-shell[data-layout-mode='mobile'] .procurement-project-card:nth-child(n),
  .app-shell[data-layout-mode='mobile'] .material-item-card:nth-child(n),
  .app-shell[data-layout-mode='mobile'] .teams-activity-card:nth-child(n),
  .app-shell[data-layout-mode='mobile'] .detail-grid > div:nth-child(n),
  .app-shell[data-layout-mode='mobile'] .mobile-detail-list > div:nth-child(n),
  .app-shell[data-layout-mode='mobile'] .material-item-meta--priority div:nth-child(n),
  .app-shell[data-layout-mode='mobile'] .quality-stage-tab:nth-child(n),
  .app-shell[data-layout-mode='mobile'] .quality-panel-chip:nth-child(n),
  .app-shell[data-layout-mode='mobile'] .quality-item:nth-child(n),
  .app-shell[data-layout-mode='mobile'] .quality-choice-row button:nth-child(n),
  .app-shell[data-layout-mode='mobile'] .quality-decision-options button:nth-child(n),
  .app-shell[data-layout-mode='mobile'] .manufacturing-step-list li:nth-child(n),
  .app-shell[data-layout-mode='mobile'] .sales-kpi-cards article:nth-child(n) {
    border-radius: var(--ds-shape-surface-radius) !important;
    clip-path: none;
  }

  .app-shell[data-layout-mode='mobile'] .page-header,
  .app-shell[data-layout-mode='mobile'] .mobile-page-header,
  .app-shell[data-layout-mode='mobile'] .mobile-operations-header {
    border-radius: 0 !important;
  }

  .app-shell[data-layout-mode='mobile'] .mobile-menu-item.active,
  .app-shell[data-layout-mode='mobile'] .mobile-menu-item[aria-current='page'] {
    border-radius: var(--ds-shape-active-radius) !important;
  }

  .app-shell[data-layout-mode='mobile'] .kitting-panel-card[data-shape-role],
  .app-shell[data-layout-mode='mobile'] .manufacturing-project-card[data-shape-role],
  .app-shell[data-layout-mode='mobile'] .quality-project-card[data-shape-role],
  .app-shell[data-layout-mode='mobile'] .settlement-condition-card[data-shape-role],
  .app-shell[data-layout-mode='mobile'] .sales-kpi-cards article[data-shape-role] {
    border-radius: var(--ds-shape-surface-radius) !important;
    clip-path: none;
  }

  .app-shell[data-layout-mode='mobile'] .kitting-panel-card[data-shape-role='warning'],
  .app-shell[data-layout-mode='mobile'] .manufacturing-project-card[data-shape-role='warning'],
  .app-shell[data-layout-mode='mobile'] .quality-project-card[data-shape-role='warning'] {

    clip-path: var(--ds-shape-warning-cut);
  }

  .app-shell[data-layout-mode='mobile'] .kitting-panel-card[data-shape-role='success'] .kitting-panel-check,
  .app-shell[data-layout-mode='mobile'] .settlement-condition-icon[data-shape-role='success'] {
    border-radius: 50% !important;
    background: var(--wire-status-success-bg) !important;
    color: var(--wire-status-success-text) !important;
  }

  .app-shell[data-layout-mode='mobile'] .settlement-condition-icon[data-shape-role='warning'] {
    border-radius: var(--wire-radius-tag) !important;
    clip-path: var(--ds-shape-warning-cut);
    background: var(--wire-status-danger-bg) !important;
    color: var(--wire-status-danger-text) !important;
  }

  .app-shell[data-layout-mode='mobile'] .dashboard-kpi-card:nth-child(n),
  .app-shell[data-layout-mode='mobile'] .pending-summary-grid > div:nth-child(n),
  .app-shell[data-layout-mode='mobile'] .admin-dashboard-card:nth-child(n),
  .app-shell[data-layout-mode='mobile'] .mobile-focus-summary > div > button:nth-child(n),
  .app-shell[data-layout-mode='mobile'] .home-mobile-priority-metrics button:nth-child(n),
  .app-shell[data-layout-mode='mobile'] .material-summary-strip button:nth-child(n),
  .app-shell[data-layout-mode='mobile'] .manufacturing-metrics > span:nth-child(n) {
    border-radius: var(--ds-shape-surface-radius) !important;
    clip-path: none;
  }

  .app-shell[data-layout-mode='mobile'] .dashboard-kpi-card[data-variant='warning'],
  .app-shell[data-layout-mode='mobile'] .dashboard-kpi-card[data-tone='danger'],

  .app-shell[data-layout-mode='mobile'] .mobile-project-dday,
  .app-shell[data-layout-mode='mobile'] .status-badge,
  .app-shell[data-layout-mode='mobile'] .material-status-badge,
  .app-shell[data-layout-mode='mobile'] .receipt-completion-badge,
  .app-shell[data-layout-mode='mobile'] .order-item-badge,
  .app-shell[data-layout-mode='mobile'] .ds-badge {

  .app-shell[data-layout-mode='mobile'] .nav-badge,
  .app-shell[data-layout-mode='mobile'] .quality-section-label strong,
  .app-shell[data-layout-mode='mobile'] .quality-item > header > span,
  .app-shell[data-layout-mode='mobile'] .manufacturing-step-list li > span {

  .app-shell[data-layout-mode='mobile'] .kpi-strong,
  .app-shell[data-layout-mode='mobile'] :where(

/* ── 17 · Small-screen guidance behavior (≤700px) ────────────────────── */
@media (max-width: 700px) {
  .ds-breadcrumbs,
  .ds-secondary-tools {
    display: none;
  }

  .ds-readonly-banner,
  .ds-empty-state,
  .ds-state-panel {
    grid-template-columns: 36px minmax(0, 1fr);
    padding: 12px;
  }

  .ds-readonly-banner__action,
  .ds-empty-state > div:last-child,
  .ds-state-panel__action {
    grid-column: 1 / -1;
    justify-content: stretch;
  }

  .ds-input-flow__header {
    grid-template-columns: minmax(0, 1fr);
    gap: 12px;
    padding: 14px 12px;
  }

  .ds-input-flow__header ol {
    width: 100%;
    min-width: 0;
  }

  .ds-input-flow__header li {
    grid-template-columns: 20px minmax(0, 1fr);
    gap: 5px;
    min-height: 34px;
    padding: 5px 6px;
    font-size: 10px;
  }

  .ds-input-flow__header li b {
    width: 19px;
    height: 19px;
    font-size: 10px;
  }

  .ds-input-section__header {
    grid-template-columns: 30px minmax(0, 1fr);
    gap: 9px;
    padding: 10px;
  }

  .ds-input-section__header > b {
    width: 28px;
    height: 28px;
  }

  .ds-input-section__actions {
    grid-column: 1 / -1;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    justify-content: stretch;
  }

  .ds-input-section__actions > button {
    width: 100%;
  }

  .ds-input-section__content {
    padding: 11px 10px;
  }

  .ds-field-grid,
  .ds-field-grid[data-columns='3'] {
    grid-template-columns: minmax(0, 1fr);
    gap: 9px;
  }

  .ds-choice-group {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .app-shell .ds-choice-group > button {
    min-height: 48px;
    padding: 8px 9px;
    border-right: 1px solid var(--wire-line-strong) !important;
    border-bottom: 1px solid var(--wire-line-strong) !important;
  }

  .ds-action-bar {
    grid-template-columns: minmax(0, 1fr);
    gap: 9px;
    min-height: 0;
    margin-inline: -1px;
    padding: 10px;
  }

  .ds-action-bar__buttons {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .ds-action-bar__buttons > button {
    width: 100%;
  }

  .ds-action-bar__buttons > button:only-child {
    grid-column: 1 / -1;
  }
}

/* ── 19 · Long-tail surfaces: logistics, IQC, UL891, pending ─────────── */
/* Red/teal/amber-era leftovers that the blanket cannot reach (tinted
 * backgrounds on unclassified elements, decorative discs, micro type). */

/* Logistics stages */
.app-shell .logistics-today {
  border: 0 !important;
  border-radius: 50% !important;
  background: var(--wire-black) !important;
  color: #ffffff !important;
}

.app-shell .logistics-today :where(span, small, strong, b) {
  color: #ffffff !important;
}

.app-shell .logistics-priority-strip > div {
  border: 1px solid var(--wire-line) !important;
  border-radius: var(--wire-radius-surface) !important;
}

.app-shell .logistics-feedback[data-kind='success'] {
  border-color: var(--wire-status-success-line) !important;
  background: var(--wire-status-success-bg) !important;
  color: var(--wire-status-success-text) !important;
}

.app-shell .logistics-feedback[data-kind='error'],
.app-shell .logistics-inline-error {
  border-color: var(--wire-status-danger-line) !important;
  background: var(--wire-status-danger-bg) !important;
  color: var(--wire-status-danger-text) !important;
}

.app-shell .logistics-readonly {
  background: var(--wire-subtle) !important;
  color: var(--wire-muted) !important;
}

.app-shell .logistics-draft-token {
  border: 1px dashed var(--wire-line-strong) !important;
  border-radius: var(--wire-radius-control) !important;
  background: var(--wire-canvas) !important;
}

.app-shell .logistics-draft-token span {
  border-radius: var(--wire-radius-tag) !important;
  background: var(--wire-black) !important;
  color: #ffffff !important;
  font-size: 10px !important;
}

.app-shell .logistics-file-field {
  border: 1px dashed var(--wire-line-strong) !important;
  border-radius: var(--wire-radius-surface) !important;
  background: var(--wire-canvas) !important;
}

.app-shell .logistics-target-status {
  border-radius: 999px !important;
  background: var(--wire-subtle) !important;
  color: var(--wire-muted) !important;
  font-size: 10px !important;
  font-weight: 600 !important;
}

.app-shell .logistics-target-card:hover:not(:disabled),
.app-shell .logistics-target-card[data-selected='true'] {
  border-color: var(--wire-black) !important;
  background: var(--wire-subtle) !important;
}

.app-shell .logistics-page[data-mobile='true'] {
  background: var(--wire-surface) !important;
}

/* IQC digital report */
.app-shell .iqc-final-seal {
  border-color: var(--wire-status-success-line) !important;
  border-radius: var(--wire-radius-surface) !important;
  background: var(--wire-status-success-bg) !important;
  color: var(--wire-status-success-text) !important;
}

.app-shell .iqc-final-seal :where(span, strong, small, div) {
  color: var(--wire-status-success-text) !important;
}

.app-shell .iqc-final-seal[data-result='Failed'] {
  border-color: var(--wire-status-danger-line) !important;
  background: var(--wire-status-danger-bg) !important;
  color: var(--wire-status-danger-text) !important;
}

.app-shell .iqc-final-seal[data-result='Failed'] :where(span, strong, small, div) {
  color: var(--wire-status-danger-text) !important;
}

/* The seal disc follows the seal's semantic color instead of plain ink. */
.app-shell .iqc-final-seal > i {
  background-color: currentColor !important;
}

/* UL891 legacy workspace */

/* ── 22 · Desktop table density contracts ────────────────────────────── */
/* Page-specific: production planning/release grid and the My Work /
 * Notifications raw tables. Healthy operational, procurement, receiving and
 * project-list tables intentionally match none of these selectors. */

/* Production planning + manufacturing release grid (role=table div grid).
 * Column templates, sticky header, and expansion behavior stay untouched;
 * both header and rows receive the same inline padding so columns align. */
.app-shell .production-project-head {
  min-height: 38px;
  align-content: center;
  padding: 10px 12px;
  border-bottom: 1px solid var(--wire-ink) !important;
  background: var(--wire-surface) !important;
  color: var(--wire-muted) !important;
  font-size: 11px !important;
  font-weight: 600 !important;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

  min-height: 48px;
  padding-inline: 12px;
  border-top: 1px solid var(--wire-hairline) !important;
}

/* My Work (8 columns) and Notifications (7 columns) desktop tables:
 * fill the wrapper, fixed layout so every project/notification group renders
 * identical column boundaries. Data cells keep 6px block padding because the
 * action cells contain 38px buttons (≈50px normal rows); multiline detail
 * grows naturally. Mobile renders cards and never mounts these tables. */
.app-shell .table-wrapper > .workflow-desktop-table,
.app-shell .table-wrapper > .notification-desktop-table {
  width: 100%;
  table-layout: fixed;
}

.app-shell :where(.workflow-desktop-table, .notification-desktop-table) th {
  padding: 10px 12px;
}

.app-shell :where(.workflow-desktop-table, .notification-desktop-table) td {
  padding: 6px 12px;
  vertical-align: middle;
}

.app-shell :where(.workflow-desktop-table, .notification-desktop-table) th:first-child {
  width: 44px;
}

.app-shell :where(.workflow-desktop-table, .notification-desktop-table) th:nth-child(4) {
  width: 110px; /* 상태 */
}

.app-shell :where(.workflow-desktop-table, .notification-desktop-table) th:nth-last-child(3) {
  width: 150px; /* 생성일 */
}

.app-shell :where(.workflow-desktop-table, .notification-desktop-table) th:nth-last-child(2) {
  width: 200px; /* 작업 */
}

/* The legacy .workflow-detail-column rule pins min-width 260px / max-width
 * 420px on header AND data cells; the fixed-layout contract releases both so
 * the 26% column width is the single source of truth. */
.app-shell :where(.workflow-desktop-table, .notification-desktop-table) .workflow-detail-column {
  min-width: 0;
  max-width: none;
}

.app-shell :where(.workflow-desktop-table, .notification-desktop-table) th.workflow-detail-column {
  width: 26%;
}

.app-shell .workflow-desktop-table th:nth-child(2) {
  width: 112px; /* 단계 */
}

.app-shell .workflow-desktop-table th:nth-child(5) {
  width: 84px; /* 긴급도 */
}

.app-shell .notification-desktop-table th:nth-child(3) {
  width: 140px; /* 유형 */
}

/* ── 23 · No decorative left rails ───────────────────────────────────── */
/* Legacy accent rails (border-left ≥ 2px) survive the blanket because only
 * the color is normalized. Widths collapse to a uniform 1px here; tone and
 * text carry the emphasis. Structural verticals (timeline connectors, table
 * dividers, gantt axes) are untouched. */
.app-shell :where(
  .procurement-error-panel,
  .project-material-item-summary > span,
  .quality-inspection-hero,

/* ── 21 · Motion ─────────────────────────────────────────────────────── */

const guides=[['외관 / 구조 / 도장 / 색차 검사를 시행한다.','반드시 2D / 3D 도면을 토대로 검사할 것','도장 및 도금 : 도면 기준','도장 Spec : 60~150㎛','색차 Spec : △e 1.5 이하'],['체결 및 조립 검사를 시행한다.','Label 부착 확인','Part Spec 확인','반드시 승인도를 통해 배치 검사할 것 (배치 오류 부적합 사례 있음)','ESN을 통한 제작 전 사양 반드시 확인할 것'],['Line 배선, 포설, 체결 검사를 시행한다.','Harness표가 아닌 2D 도면으로 검사할 것','DVM을 통한 Pin Check 방식으로 시행할 것','Cable 포설 후 완 체결 시행할 것 (당김검사)','ESN을 통한 Eye Cap 색상 점검할 것'],['체결부 토크값 확인 및 I-Marking 등 8계통 작업 시행한다.','Safety Label 부착 상태 확인','On/Off Label 부착 상태 확인','Dip Switch Setting','아크릴 커버 확인'],['설비의 동작 Test를 시행한다.','Connector 출력 이상 유/무 확인','Power Supply 출력 확인','EMO 동작 상태 확인','FAN 동작 확인','GPS/UPS 확인','Door Close 시 Limit Switch 확인'],['설비 외관 / 8계통 / CTQ 확인','판금류 가공품 외관 이상 없을 것','고객사 라벨 부착 기준에 이상 없을 것','I-Marking 표기 기준에 이상 없을 것','Safety Label Map과 일치 확인','Dip Switch Setting 일치 확인'],['제품 포장 및 Cleaning','Cleaning 상태 이상 없을 것','포장상태 이상 없을 것','포장 이후 제품 식별라벨 확인']];
const instructions=['IQC 시행 완료 후 외함 사진 1장 촬영하여 등록할 것','배치검사 완료 후 사진 1장 촬영하여 등록할 것 (Rack의 경우 Door Open 상태로 촬영)','배선검사 완료 후 ESN과 함께 배선 완료된 사진 1장 촬영하여 등록할 것 (ESN과 설비 동시 촬영)','8계통 작업 완료 후 사진 1장 촬영하여 등록할 것 (Rack의 경우 Door Open 상태로 촬영)','동작검사 완료 후 Relay On 상태 사진 1장 촬영하여 등록할 것','출하검사 완료 후 외관 전체 상태 사진 1장 촬영하여 등록할 것','포장 완료 후 식별라벨 부착된 상태 사진 1장 촬영하여 등록할 것'];
function diagram(){return `<svg viewBox="110 0 220 240" aria-label="장비 사진 자리 예시 일러스트"><rect width="440" height="240" fill="#e9edf1"/><ellipse cx="225" cy="224" rx="105" ry="8" fill="#c9cfd6"/><rect x="135" y="16" width="170" height="204" rx="5" fill="#626b76"/><rect x="145" y="25" width="150" height="185" fill="#d6dce0"/>${[45,85,125,165].map((y,i)=>`<rect x="155" y="${y}" width="130" height="27" rx="2" fill="#fdfdfd"/><rect x="164" y="${y+6}" width="42" height="15" fill="#87919c"/><circle cx="265" cy="${y+13}" r="4" fill="${['#49a967','#d8a831','#4696c8'][((i+photo)%3)]}"/><path d="M180 ${y+26}v12h55" fill="none" stroke="#${photo===2?'2980a4':'cf4747'}" stroke-width="3"/>`).join('')}<text x="220" y="237" text-anchor="middle" fill="#697586" font-size="10">실제 작업 사진이 아닌 시안용 이미지</text></svg>`}
function guide(){return `<aside class="guide"><h3>단계 설명</h3>${guides[selected].map((x,i)=>`<p>${i?'−':'1.'} ${x}</p>`).join('')}<div class="instruction">→ ${instructions[selected]}</div></aside>`}
function notify(t){let e=document.querySelector('#toast');e.textContent=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),2600)}
function render(){let state=document.querySelector('#state').value,admin=document.querySelector('#role').value==='admin';document.querySelector('#stageTitle').textContent=names[selected];document.querySelector('#stageNum').textContent=selected+1;document.querySelector('#badge').textContent=state;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));document.querySelector('#notice').textContent=editing?'사진 필수 · 1~10장 / 코멘트 선택 · 최대 1000자':state==='수정 승인'||state==='반려'?'등록 권한이 있는 누구나 1회 저장 후 다시 잠깁니다.':'최종 저장된 내용입니다.';
let body=document.querySelector('#content');if(tab==='history'){body.innerHTML=`<div class="history">${[['수정 완료','예시 작업자 B','09.11 14:32','ESN 확인 후 배선 상태 사진을 보완했습니다.',true],['수정 승인','예시 관리자','09.11 14:10','수정 등록이 1회 허용되었습니다.'],['재등록 완료','예시 작업자 A','09.10 16:20','Pin Check 및 당김검사 완료.',true],['반려','예시 관리자','09.10 15:40','ESN이 보이도록 사진을 다시 등록해 주세요.'],['최초 완료','예시 작업자 A','09.10 15:00','배선검사 완료.',true],['초기화','예시 관리자','09.09 11:00','잘못 선택한 패널의 기록을 초기화했습니다.']].map(e=>`<article class="event"><time class="muted">2026.${e[2]}</time><div><h3>${e[0]} <span class="muted">· ${e[1]}</span></h3><p>${e[3]}</p>${e[4]?'<div class="historypics"><button onclick="notify(\'해당 저장 시점 사진을 크게 보는 화면으로 연결 예정입니다.\')">당시 사진 1</button><button onclick="notify(\'시안용 이전 사진입니다.\')">당시 사진 2</button></div>':''}</div></article>`).join('')}</div>`;}else if(editing){body.innerHTML=`<div class="editarea"><div class="statebanner">기존 사진을 유지하거나 제외하고 추가할 수 있습니다. 이전 내용은 이력에 보존됩니다.</div><h3>사진 <span style="color:#d52028">필수</span> <small class="muted">${count} / 10장</small></h3><div class="editphotos">${Array.from({length:count},(_,i)=>`<div class="editphoto">사진 ${i+1}<button aria-label="사진 ${i+1} 제외" onclick="count--;render()">×</button></div>`).join('')}</div><div class="buttons"><button onclick="add()">＋ 사진 선택</button><button onclick="add()">카메라 촬영</button></div><p class="muted">시안에서는 버튼을 누르면 예시 사진이 추가됩니다.</p><h3 style="margin-top:20px">코멘트 <span class="muted">선택</span></h3><textarea maxlength="1000" oninput="document.querySelector('#chars').textContent=this.value.length">ESN 확인 후 배선 상태 사진을 보완했습니다.</textarea><div class="muted" style="text-align:right"><span id="chars">27</span> / 1000자</div></div>`;}else{body.innerHTML=`<div class="columns ${tab==='guide'?'showguide':''}">${guide()}<div class="record">${state==='반려'?'<div class="statebanner"><b>반려 · 예시 관리자</b><br>ESN이 보이도록 사진을 다시 등록해 주세요.</div>':''}<div class="recordhead"><h3 style="margin:0">${state==='미완료'?'완료 기록':'최신 저장 기록'}</h3><span class="muted">${state==='미완료'?'아직 등록되지 않았습니다.':'예시 작업자 B · 09.11 14:32'}</span></div>${state==='미완료'?'<div class="photobox muted">완료 시 사진과 코멘트를 등록해 주세요.</div>':`<div class="photobox" role="button" tabindex="0" aria-label="사진 크게 보기" onclick="openLarge()" onkeydown="if(event.key==='Enter')openLarge()">${diagram()}<span class="counter">${photo} / 10</span></div><div class="thumbs">${Array.from({length:10},(_,i)=>`<button class="${photo===i+1?'selected':''}" aria-label="사진 ${i+1}" onclick="photo=${i+1};render()">${i+1}</button>`).join('')}</div><div class="comment"><span class="muted">코멘트</span><p class="widecomment">ESN 확인 후 배선 상태 사진을 보완했습니다.<br>Pin Check 및 당김검사 완료, 이상 없습니다.</p><button style="border:0;padding:0;font-size:12px;color:#8a6262" onclick="notify('긴 코멘트는 별도 전체 보기로 표시하는 구성입니다.')">전체 보기 ↗</button></div>`}</div></div>`;}
let buttons=editing?`<button onclick="editing=false;render()">취소</button><button class="primary" onclick="save()">저장</button>`:tab==='history'?`<button onclick="tab='current';render()">현재 기록으로</button>`:state==='완료'?`${admin?'<button class="danger" onclick="action(\'초기화\')">초기화</button><button class="danger" onclick="action(\'반려\')">반려</button><button onclick="action(\'수정 승인\')">수정 승인</button>':'<button onclick="notify(\'관리자에게 수정 승인을 요청하는 화면으로 연결됩니다.\')">수정 요청</button>'}`:`${admin&&state!=='미완료'?'<button class="danger" onclick="action(\'초기화\')">초기화</button>':''}<button class="primary" onclick="editing=true;count=3;render()">${state==='미완료'?'완료 등록':state==='반려'?'다시 등록':'수정'}</button>`;document.querySelector('#actions').innerHTML=buttons;}
function add(){if(count>=10)return notify('최대 10장까지 추가할 수 있습니다.');count++;render()}function save(){if(!count)return notify('사진을 최소 1장 첨부해 주세요.');editing=false;document.querySelector('#state').value='완료';render();notify('시안 저장 완료 · 실제 데이터는 저장하지 않습니다.')}function action(a){if(a==='수정 승인'){document.querySelector('#state').value=a;render();return}let reason=prompt(a+' 사유 (시안)');if(!reason?.trim())return;document.querySelector('#state').value=a==='초기화'?'미완료':'반려';render();notify('시안 상태만 변경되었습니다.')}document.querySelector('#stages').innerHTML=names.map((n,i)=>`<button class="stage ${i<3?'is-complete':''}" onclick="selected=${i};document.querySelector('#state').value=${i}<3?'완료':'미완료';tab='current';editing=false;document.querySelector('#overlay').classList.remove('hidden');render()"><span class="osan-stage-number">${i+1}</span><strong>${n}</strong><span>${i<3?'완료':'미완료'}</span><small>${i<3?1:0} / 1 대상 완료</small></button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;editing=false;render()});document.querySelectorAll('.toolbar select').forEach(e=>e.onchange=()=>{editing=false;render()});document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelector('#overlay').classList.add('hidden')});render();
</script><style>
@media(min-width:861px){.dialog{width:min(1320px,calc(100vw - 48px))!important}.body:has(.columns){height:calc(100dvh - 270px);max-height:650px}.columns{height:100%;grid-template-columns:minmax(290px,.8fr) minmax(0,2fr)!important;gap:20px}.record{display:flex;flex-direction:column;min-height:0;min-width:0}.recordhead{flex-shrink:0;margin-bottom:8px}.record .photobox{flex:1;min-height:180px;height:auto!important}.photobox svg{width:100%;height:100%;max-width:100%}.thumbs{flex-shrink:0;margin-top:7px}.thumbs button{padding:3px 0}.record .comment{flex-shrink:0;padding:7px 10px;margin-top:7px;display:grid;grid-template-columns:1fr auto;gap:2px 10px}.comment>span{grid-column:1/-1}.record .comment p{margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-height:24px}.record .comment p br{display:none}.comment button{align-self:center}.guide{align-self:start}.dialoghead{padding-top:14px;padding-bottom:12px}.footer{padding-top:10px;padding-bottom:10px}.tabs button{padding-top:9px;padding-bottom:9px}}
.photobox[role=button]{cursor:zoom-in}.photobox[role=button]:after{content:'⤢ 크게 보기';position:absolute;top:10px;right:10px;background:#fffE;border:1px solid #ddd;border-radius:5px;font-size:11px;padding:4px 8px;color:#333}.large-photo{position:fixed;inset:0;z-index:20000;background:#16191e;display:flex;flex-direction:column;color:#fff;padding:16px}.large-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-shrink:0}.large-photo button{background:#fff;color:#282828;border-radius:6px;padding:8px 14px;font-size:13px}.large-image{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:12px}.large-image svg{width:100%;height:100%;max-height:100%}.large-controls{display:flex;gap:18px;align-items:center;justify-content:center;flex-shrink:0}.large-head span{font-size:13px}.large-photo .large-image svg{background:#e9edf1}.large-photo .large-image svg text{font-size:9px}
@media(max-width:860px){.record .photobox{height:clamp(300px,48dvh,530px)!important}.photobox svg{height:100%;max-width:100%;width:100%}.large-photo{padding:12px}.large-head span{font-size:11px}.large-image{padding:12px 0}}
</style><script>
function openLarge(){let existing=document.querySelector('.large-photo');if(existing)existing.remove();let el=document.createElement('section');el.className='large-photo';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');el.setAttribute('aria-label','사진 확대');el.innerHTML='<div class="large-head"><span>'+names[selected]+' · 패널 01 · 사진 '+photo+' / 10</span><button onclick="closeLarge()">확대 닫기</button></div><div class="large-image">'+diagram()+'</div><div class="large-controls"><button onclick="photo=photo===1?10:photo-1;openLarge()">‹ 이전 사진</button><span>'+photo+' / 10</span><button onclick="photo=photo===10?1:photo+1;openLarge()">다음 사진 ›</button></div>';document.body.append(el);el.querySelector('button').focus()}
function closeLarge(){document.querySelector('.large-photo')?.remove();render()}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.querySelector('.large-photo')){e.stopImmediatePropagation();closeLarge()}},true);
</script></html>
