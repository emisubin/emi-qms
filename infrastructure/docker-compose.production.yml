services:
  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile.production
      args:
        VITE_AZURE_TENANT_ID: ${ENTRA_TENANT_ID:?ENTRA_TENANT_ID is required}
        VITE_AZURE_CLIENT_ID: ${ENTRA_SPA_CLIENT_ID:?ENTRA_SPA_CLIENT_ID is required}
        VITE_AZURE_API_CLIENT_ID: ${ENTRA_API_CLIENT_ID:?ENTRA_API_CLIENT_ID is required}
        VITE_AZURE_API_SCOPE: ${ENTRA_API_SCOPE:?ENTRA_API_SCOPE is required}
        VITE_AZURE_REDIRECT_URI: https://${PUBLIC_HOST:?PUBLIC_HOST is required}
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?PUBLIC_HOST is required}
      NGINX_ENVSUBST_FILTER: PUBLIC_HOST
    ports:
      - "${PUBLIC_HTTPS_PORT:-443}:8443"
    secrets:
      - tls_certificate
      - tls_private_key
    depends_on:
      backend:
        condition: service_started
      tls-validator:
        condition: service_completed_successfully
    networks:
      qms_edge:
      qms_internal:
        ipv4_address: 172.30.0.10
    read_only: true
    tmpfs:
      - /tmp:uid=101,gid=101,mode=1770
      - /var/cache/nginx:uid=101,gid=101,mode=0750
      - /var/run:uid=101,gid=101,mode=0750
      - /etc/nginx/conf.d:uid=101,gid=101,mode=0750
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --show-error
          --resolve "$${PUBLIC_HOST}:8443:127.0.0.1"
          "https://$${PUBLIC_HOST}:8443/health/live"
          >/dev/null
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: syslog
      options:
        syslog-address: ${SECURITY_SYSLOG_ADDRESS:?SECURITY_SYSLOG_ADDRESS is required}
        syslog-tls-ca-cert: ${SECURITY_SYSLOG_CA_CERT:?SECURITY_SYSLOG_CA_CERT is required}
        syslog-format: rfc5424micro
        tag: emi-qms-frontend

  tls-validator:
    image: alpine/openssl:3.5.7@sha256:045a40a53b8e283cff95052e0c39f256b7467d48c7445260d4f180fc0e767999
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?PUBLIC_HOST is required}
    entrypoint:
      - /bin/sh
      - /validation/05-validate-tls.sh
    secrets:
      - tls_certificate
      - tls_private_key
    volumes:
      - ./production/05-validate-tls.sh:/validation/05-validate-tls.sh:ro
    network_mode: none
    read_only: true
    user: "65534:65534"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile.production
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      AllowedHosts: ${PUBLIC_HOST:?PUBLIC_HOST is required}
      Authentication__Mode: EntraId
      AzureAd__Instance: https://login.microsoftonline.com/
      AzureAd__TenantId: ${ENTRA_TENANT_ID:?ENTRA_TENANT_ID is required}
      AzureAd__ClientId: ${ENTRA_API_CLIENT_ID:?ENTRA_API_CLIENT_ID is required}
      AzureAd__SpaClientId: ${ENTRA_SPA_CLIENT_ID:?ENTRA_SPA_CLIENT_ID is required}
      AzureAd__Audience: ${ENTRA_API_AUDIENCE:?ENTRA_API_AUDIENCE is required}
      AzureAd__Domain: ${ENTRA_DOMAIN:?ENTRA_DOMAIN is required}
      Frontend__Origin: https://${PUBLIC_HOST:?PUBLIC_HOST is required}
      Frontend__RedirectUri: https://${PUBLIC_HOST:?PUBLIC_HOST is required}
      ReverseProxy__KnownProxies: 172.30.0.10
      RateLimiting__Enabled: "true"
      UploadSecurity__Enabled: "true"
      UploadSecurity__FailClosed: "true"
      UploadSecurity__ScannerHost: clamav
      UploadSecurity__ScannerPort: "3310"
      UploadSecurity__RejectImageMetadata: "true"
      Database__ApplyMigrationsOnStartup: "false"
      DevelopmentData__SeedEnabled: "false"
      DevAuthentication__Enabled: "false"
      AdminUserSwitch__Enabled: "false"
      Operations__Backup__RestoreVerifiedAtUtc: ${RESTORE_VERIFIED_AT_UTC:?RESTORE_VERIFIED_AT_UTC is required}
      Operations__Monitoring__Enabled: "true"
      Operations__Monitoring__SecurityAlertSink: ${SECURITY_ALERT_SINK:?SECURITY_ALERT_SINK is required}
    secrets:
      - source: database_connection_string
        target: ConnectionStrings__QmsDatabase
      - source: bootstrap_admin_emails
        target: Authentication__BootstrapAdminEmails
    depends_on:
      - clamav
    networks:
      qms_internal:
        ipv4_address: 172.30.0.20
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: syslog
      options:
        syslog-address: ${SECURITY_SYSLOG_ADDRESS:?SECURITY_SYSLOG_ADDRESS is required}
        syslog-tls-ca-cert: ${SECURITY_SYSLOG_CA_CERT:?SECURITY_SYSLOG_CA_CERT is required}
        syslog-format: rfc5424micro
        tag: emi-qms-backend

  migration:
    profiles:
      - operations
    build:
      context: ..
      dockerfile: backend/Dockerfile.production
    command:
      - --migrate-only
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      AllowedHosts: ${PUBLIC_HOST:?PUBLIC_HOST is required}
      Authentication__Mode: EntraId
      AzureAd__Instance: https://login.microsoftonline.com/
      AzureAd__TenantId: ${ENTRA_TENANT_ID:?ENTRA_TENANT_ID is required}
      AzureAd__ClientId: ${ENTRA_API_CLIENT_ID:?ENTRA_API_CLIENT_ID is required}
      AzureAd__SpaClientId: ${ENTRA_SPA_CLIENT_ID:?ENTRA_SPA_CLIENT_ID is required}
      AzureAd__Audience: ${ENTRA_API_AUDIENCE:?ENTRA_API_AUDIENCE is required}
      AzureAd__Domain: ${ENTRA_DOMAIN:?ENTRA_DOMAIN is required}
      Frontend__Origin: https://${PUBLIC_HOST:?PUBLIC_HOST is required}
      Frontend__RedirectUri: https://${PUBLIC_HOST:?PUBLIC_HOST is required}
      ReverseProxy__KnownProxies: 172.30.0.10
      RateLimiting__Enabled: "true"
      UploadSecurity__Enabled: "true"
      UploadSecurity__FailClosed: "true"
      UploadSecurity__ScannerHost: clamav
      UploadSecurity__ScannerPort: "3310"
      UploadSecurity__RejectImageMetadata: "true"
      Database__ApplyMigrationsOnStartup: "false"
      DevelopmentData__SeedEnabled: "false"
      DevAuthentication__Enabled: "false"
      AdminUserSwitch__Enabled: "false"
      Operations__Backup__RestoreVerifiedAtUtc: ${RESTORE_VERIFIED_AT_UTC:?RESTORE_VERIFIED_AT_UTC is required}
      Operations__Monitoring__Enabled: "true"
      Operations__Monitoring__SecurityAlertSink: ${SECURITY_ALERT_SINK:?SECURITY_ALERT_SINK is required}
    secrets:
      - source: database_connection_string
        target: ConnectionStrings__QmsDatabase
      - source: bootstrap_admin_emails
        target: Authentication__BootstrapAdminEmails
    networks:
      qms_internal:
        ipv4_address: 172.30.0.40
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"
    logging:
      driver: syslog
      options:
        syslog-address: ${SECURITY_SYSLOG_ADDRESS:?SECURITY_SYSLOG_ADDRESS is required}
        syslog-tls-ca-cert: ${SECURITY_SYSLOG_CA_CERT:?SECURITY_SYSLOG_CA_CERT is required}
        syslog-format: rfc5424micro
        tag: emi-qms-migration

  clamav:
    image: clamav/clamav:1.4@sha256:6b7c8e09559250f25b0184516b0a2ae805136e57485260e16c780c9fd6e6aba9
    platform: linux/amd64
    networks:
      qms_internal:
        ipv4_address: 172.30.0.30
      scanner_updates:
    volumes:
      - clamav_database:/var/lib/clamav
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: syslog
      options:
        syslog-address: ${SECURITY_SYSLOG_ADDRESS:?SECURITY_SYSLOG_ADDRESS is required}
        syslog-tls-ca-cert: ${SECURITY_SYSLOG_CA_CERT:?SECURITY_SYSLOG_CA_CERT is required}
        syslog-format: rfc5424micro
        tag: emi-qms-clamav

networks:
  qms_edge:
  qms_internal:
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
  scanner_updates:

volumes:
  clamav_database:

secrets:
  tls_certificate:
    file: ${TLS_CERTIFICATE_FILE:?TLS_CERTIFICATE_FILE is required}
  tls_private_key:
    file: ${TLS_PRIVATE_KEY_FILE:?TLS_PRIVATE_KEY_FILE is required}
  database_connection_string:
    file: ${DATABASE_CONNECTION_STRING_FILE:?DATABASE_CONNECTION_STRING_FILE is required}
  bootstrap_admin_emails:
    file: ${BOOTSTRAP_ADMIN_EMAILS_FILE:?BOOTSTRAP_ADMIN_EMAILS_FILE is required}
