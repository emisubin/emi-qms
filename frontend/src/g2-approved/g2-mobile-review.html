function detail(k){const r=get(k),future=k>today;const val=v=>future?'':fmt(v);return `<div class="day-detail"><h3>생산·수리·불량 실적</h3><table><thead><tr><th>구분</th><th>오전</th><th>오후</th></tr></thead><tbody><tr><th>생산</th><td>${val(r.am)}</td><td>${val(r.pm)}</td></tr><tr><th>수리</th><td>${val(r.ra)}</td><td>${val(r.rp)}</td></tr><tr><th>불량</th><td></td><td>${val(r.bad)}</td></tr></tbody></table><dl><dt>신규 불량</dt><dd>${val(r.bad)}</dd><dt>불량 재고</dt><dd>${val(r.defectStock)}</dd><dt>실사 · 납품 가능</dt><dd>${val(r.count)}</dd><dt>실사 · 불량</dt><dd>${val(r.badcount)}</dd></dl><div class="note"><b>계획 비고</b><p>${esc(r.planMemo)||' '}</p><b>실적 비고</b><p>${future?'':esc(r.actualMemo)||' '}</p></div><button class="detail-entry" data-sheet="${k}">데이터 입력</button></div>`;}
function daily(d,force=false){const k=key(d),r=get(k),dow=new Date(year,month-1,d).getDay(),future=k>today;return `<article class="day ${k===today?'is-today':''}"><button class="day-main" data-day="${d}" aria-expanded="${force||expanded.has(k)}"><div class="day-heading"><strong class="${dow===0||holiday[k]?'red':dow===6?'blue':''}">${short(k)} (${days[dow]})</strong><span>${k===today?'오늘 · ':''}${force||expanded.has(k)?'접기 −':'상세 +'}</span></div><table><thead><tr><th></th><th>계획</th><th>실적</th><th>달성률</th></tr></thead><tbody><tr><th>LSE 납품</th><td>${fmt(r.dp)}</td><td>${future?'':fmt(r.da)}</td><td>${future?'':rate(r.da,r.dp)}</td></tr><tr><th>EMI 생산</th><td>${fmt(r.pp)}</td><td>${future?'':fmt(total(r))}</td><td>${future?'':rate(total(r),r.pp)}</td></tr></tbody></table><div class="inventory"><span>납품 가능 재고</span><span>${future?'':fmt(r.stock)}</span></div></button><button class="row-note" data-note="${k}"><span>행 비고</span><span>${esc(r.memo)||'비고 입력'}</span></button>${force||expanded.has(k)?detail(k):''}</article>`;}
function render(){document.getElementById('month-title').textContent=year+'년 '+month+'월';const count=new Date(year,month,0).getDate(),future=key(1)>today,past=key(count)<today,until=future||past?count:Number(today.slice(-2)),vals=Array.from({length:until},(_,i)=>get(key(i+1))),sum=f=>vals.reduce((a,r)=>a+(f(r)||0),0),period=short(key(1))+' ~ '+short(key(until));
document.getElementById('summary').innerHTML=`<div class="summary-period">${period}${future?' 계획':' 집계'}</div><table><thead><tr><th></th><th>계획</th><th>실적</th><th>달성률</th></tr></thead><tbody>${[['LSE 납품','dp',r=>r.da],['EMI 생산','pp',total]].map(([label,p,a])=>`<tr><th>${label}</th><td>${fmt(sum(r=>r[p]))}</td><td>${future?'':fmt(sum(a))}</td><td>${future?'':rate(sum(a),sum(r=>r[p]))}</td></tr>`).join('')}</tbody></table><div class="stock-summary"><span>재고 · ${short(key(until))}</span><span>납품 가능 ${future?'':fmt([...vals].reverse().find(r=>r.stock!=null)?.stock)} / 불량 ${future?'':fmt([...vals].reverse().find(r=>r.defectStock!=null)?.defectStock)}</span></div>`;
if(mode==='2'){selected=Math.min(selected,count);document.getElementById('summary').hidden=true;const offset=new Date(year,month-1,1).getDay();document.getElementById('daily').innerHTML=`<div class="calendar-legend">납품·생산 실적 · 단위: 개</div><div class="calendar" style="--weeks:${Math.ceil((offset+count)/7)}">${[...days].map((d,i)=>`<div class="weekday ${i===0?'red':i===6?'blue':''}">${d}</div>`).join('')}${'<div></div>'.repeat(offset)}${Array.from({length:count},(_,i)=>{const d=i+1,k=key(d),r=get(k),dow=new Date(year,month-1,d).getDay();return `<button data-cal="${d}" class="${selected===d?'selected':''}"><b class="${holiday[k]||dow===0?'red':dow===6?'blue':''}">${d}</b><span class="cal-metric">${k>today||r.da==null?'':`<small>납품</small><em>${fmt(r.da)}</em>`}</span><span class="cal-metric">${k>today||total(r)==null?'':`<small>생산</small><em>${fmt(total(r))}</em>`}</span></button>`;}).join('')}</div>`;}else document.getElementById('daily').innerHTML=Array.from({length:count},(_,i)=>daily(i+1)).join('');}
const monthPicker=document.getElementById('month-picker'),monthSearch=document.getElementById('month-search');
monthSearch.addEventListener('click',()=>{yearSelect.value=year;monthSelect.value=month;setMenu(false);monthPicker.showModal();yearSelect.focus();});
for(const id of ['month-close','month-cancel'])document.getElementById(id).addEventListener('click',()=>monthPicker.close());
monthPicker.addEventListener('close',()=>monthSearch.focus());

const layer=document.getElementById('layer'),body=document.getElementById('form-body'),entryForm=document.getElementById('entry-form');let type='actual',date=today,tab='morning',draft={},lastFocus;
const labels={am:'오전 생산 실적',ra:'오전 수리 실적',pm:'오후 생산 실적',rp:'오후 수리 실적',bad:'신규 불량 실적',da:'납품 실적',pp:'생산 계획',dp:'납품 계획',count:'납품 가능 재고',badcount:'불량 재고'};
const fields={morning:['am','ra'],afternoon:['pm','rp','bad'],delivery:['da']};
const row=(label,content)=>`<div class="form-row"><div class="fieldlabel">${label}</div><div>${content}</div></div>`;
const numeric=k=>row(labels[k],`<input type="number" min="0" step="1" name="${k}" aria-label="${labels[k]}" value="${draft[k]??''}">`),memo=k=>row(type==='actual'?'비고':'계획 비고',`<textarea name="${k}" aria-label="${type==='actual'?'공유 실적 비고':'계획 비고'}">${esc(draft[k])}</textarea>`);
function sync(){for(const el of body.querySelectorAll('[name]'))if(['am','pm','ra','rp','bad','da','actualMemo'].includes(el.name))draft[el.name]=el.value;}
function renderForm(){let html=row('기준일',`<input aria-label="기준일" type="date" name="date" value="${date}" ${type!=='plan'?`max="${today}"`:''}>`);if(type==='actual'){html+=`<div class="tabs" role="tablist" aria-label="실적 입력 구분">${[['morning','오전'],['afternoon','오후'],['delivery','납품']].map(([v,n])=>`<button id="tab-${v}" type="button" role="tab" data-tab="${v}" aria-selected="${tab===v}" aria-controls="actual-panel">${n}</button>`).join('')}</div><div id="actual-panel" class="tab-panel" role="tabpanel" aria-labelledby="tab-${tab}">${fields[tab].map(numeric).join('')}${memo('actualMemo')}</div><p class="hint">비고는 오전·오후·납품이 함께 사용합니다. 기존 내용 뒤에 이어서 작성해 주세요.</p>`;}else if(type==='plan'){html=row('계획 기간',`<div class="pair"><label>시작일<input name="date" aria-label="계획 시작일" type="date" value="${date}" required></label><label>종료일<input name="end" aria-label="계획 종료일" type="date" value="${date}" required></label></div>`)+numeric('pp')+numeric('dp')+memo('planMemo')+'<div class="checks"><label><input type="checkbox" name="sunday" checked>일요일 제외</label><label><input type="checkbox" name="overwrite">기존 계획도 변경</label></div><div class="preview" id="plan-preview"></div>';}else html+=numeric('count')+numeric('badcount');body.innerHTML=html+'<div class="hint">기존 값을 비우고 저장하면 해당 값이 제거됩니다. 0은 실제 값으로 저장됩니다.</div><div id="form-status" role="status" class="demo-status"></div>';if(type==='plan')preview();}
function openForm(t,k){lastFocus=document.activeElement;type=t;date=k||today;if(type!=='plan'&&date>today)date=today;tab='morning';draft={...get(date)};document.getElementById('dialog-title').textContent={actual:'실적 입력',plan:'계획 입력',count:'실사 입력'}[type];renderForm();layer.classList.add('open');document.body.classList.add('modal-open');setMenu(false);document.querySelectorAll('details[open]').forEach(x=>x.open=false);body.querySelector('input')?.focus();}
function closeForm(){layer.classList.remove('open');document.body.classList.remove('modal-open');if(lastFocus?.isConnected)lastFocus.focus();else document.getElementById('data-entry').focus();}
function planInfo(){const f=new FormData(entryForm),keys=[];if(!f.get('date')||!f.get('end')||f.get('date')>f.get('end'))return{f,keys};let d=new Date(f.get('date')+'T12:00:00');const end=new Date(f.get('end')+'T12:00:00');for(let i=0;d<=end&&i<366;i++,d.setDate(d.getDate()+1)){if(f.has('sunday')&&d.getDay()===0)continue;keys.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`);}return{f,keys};}
function preview(){const{f,keys}=planInfo();let add=0,keep=0,change=0;for(const k of keys)for(const p of ['pp','dp']){if(keys.length>1&&f.get(p)==='')continue;if(get(k)[p]==null){if(f.get(p)!=='')add++;}else if(keys.length===1||f.has('overwrite'))change++;else keep++;}document.getElementById('plan-preview').textContent=`적용 ${keys.length}일 · 새 입력 ${add}개 · 유지 ${keep}개 · 변경 ${change}개`;}
function setMenu(open){document.getElementById('entry-options').hidden=!open;document.getElementById('data-entry').setAttribute('aria-expanded',String(open));if(open){showSheet(today);}else if(sheet.open)sheet.close();}
document.addEventListener('click',e=>{const el=e.target;if(el.closest('#data-entry')){showSheet(today);return;}const op=el.closest('[data-open]');if(op){openForm(op.dataset.open,op.dataset.date);return;}if(!el.closest('.entry-menu'))setMenu(false);if(el.closest('.cancel,.close')){closeForm();return;}const t=el.closest('[data-tab]');if(t){sync();tab=t.dataset.tab;renderForm();document.getElementById('tab-'+tab).focus();return;}const cell=el.closest('td.memo');if(cell){if(el.closest('[data-save-memo]')){get(cell.dataset.memo).memo=cell.querySelector('textarea').value;render();return;}if(el.closest('[data-cancel-memo]')){render();return;}if(!cell.classList.contains('editing')){cell.classList.add('editing');cell.innerHTML=`<textarea aria-label="行 비고">${esc(get(cell.dataset.memo).memo)}</textarea><button data-save-memo>저장</button> <button data-cancel-memo>취소</button>`;cell.querySelector('textarea').setAttribute('aria-label','행 비고');cell.querySelector('textarea').focus();}return;}const tr=el.closest('tr[data-row]');if(tr){const k=tr.dataset.row;expanded.has(k)?expanded.delete(k):expanded.add(k);render();}});
body.addEventListener('input',()=>{if(type==='actual')sync();if(type==='plan')preview();});body.addEventListener('change',e=>{if(e.target.name==='date'&&type!=='plan'&&e.target.value&&e.target.value<=today){date=e.target.value;draft={...get(date)};renderForm();}if(type==='plan')preview();});
entryForm.addEventListener('submit',e=>{e.preventDefault();const f=new FormData(entryForm),num=v=>v===''||v==null?null:Number(v);if(type==='actual'){sync();const r=get(date);for(const k of ['am','pm','ra','rp','bad','da'])r[k]=num(draft[k]);r.actualMemo=draft.actualMemo||'';r.modified=new Date().toLocaleTimeString('ko-KR');}else if(type==='count'){get(date).count=num(f.get('count'));get(date).badcount=num(f.get('badcount'));}else{const{keys}=planInfo();if(!keys.length){document.getElementById('form-status').textContent='적용할 날짜를 확인해 주세요.';return;}for(const k of keys){const r=get(k);for(const p of ['pp','dp']){if(keys.length>1&&f.get(p)==='')continue;if(keys.length===1||r[p]==null||f.has('overwrite'))r[p]=num(f.get(p));}if(keys.length===1||(f.get('planMemo')&&(!r.planMemo||f.has('overwrite'))))r.planMemo=f.get('planMemo');}}render();closeForm();document.getElementById('status').textContent='시안에 반영했습니다. 새로고침하면 예시 데이터로 돌아갑니다.';});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){setMenu(false);if(layer.classList.contains('open'))closeForm();}if(!layer.classList.contains('open'))return;if(e.target.matches('[role=tab]')&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();sync();const list=['morning','afternoon','delivery'];tab=list[(list.indexOf(tab)+(e.key==='ArrowRight'?1:2))%3];renderForm();document.getElementById('tab-'+tab).focus();}if(e.key==='Tab'){const els=[...layer.querySelectorAll('button,input,textarea,select')].filter(x=>!x.disabled);if(e.shiftKey&&document.activeElement===els[0]){e.preventDefault();els.at(-1).focus();}else if(!e.shiftKey&&document.activeElement===els.at(-1)){e.preventDefault();els[0].focus();}}});
function openDayPopup(d){const k=key(d),r=get(k),future=k>today,val=n=>future?'':fmt(n),dlg=document.getElementById('day-popup');document.getElementById('day-popup-title').textContent=short(k)+' ('+days[new Date(year,month-1,d).getDay()]+') 상세';document.getElementById('day-popup-body').innerHTML=`<section class="detail-group"><h3>납품·생산 현황</h3><table class="popup-summary"><thead><tr><th></th><th>계획</th><th>실적</th><th>달성률</th></tr></thead><tbody><tr><th>LSE 납품</th><td>${fmt(r.dp)}</td><td>${val(r.da)}</td><td>${future?'':rate(r.da,r.dp)}</td></tr><tr><th>EMI 생산</th><td>${fmt(r.pp)}</td><td>${val(total(r))}</td><td>${future?'':rate(total(r),r.pp)}</td></tr></tbody></table></section><section class="detail-group popup-section"><h3>생산·수리·불량 실적</h3><table><thead><tr><th>구분</th><th>오전</th><th>오후</th></tr></thead><tbody><tr><th>생산</th><td>${val(r.am)}</td><td>${val(r.pm)}</td></tr><tr><th>수리</th><td>${val(r.ra)}</td><td>${val(r.rp)}</td></tr><tr><th>불량</th><td></td><td>${val(r.bad)}</td></tr></tbody></table></section><section class="detail-group"><h3>재고·실사</h3><table class="popup-inventory"><thead><tr><th>구분</th><th>재고</th><th>실사</th></tr></thead><tbody><tr><th>납품 가능</th><td>${val(r.stock)}</td><td>${val(r.count)}</td></tr><tr><th>불량</th><td>${val(r.defectStock)}</td><td>${val(r.badcount)}</td></tr></tbody></table></section><section class="detail-group"><h3>비고</h3><div class="popup-memos"><div><b>계획 비고</b><p>${esc(r.planMemo)}</p></div><div><b>실적 비고</b><p>${future?'':esc(r.actualMemo)}</p></div><button class="row-note" data-note="${k}"><b>행 비고</b><span>${esc(r.memo)||'비고 입력'}</span></button></div></section>`;document.getElementById('day-popup-entry').dataset.sheet=k;if(!dlg.open)dlg.showModal();}
document.getElementById('day-popup-close').onclick=()=>document.getElementById('day-popup').close();
const sheet=document.getElementById('input-sheet');

const memoDialog=document.getElementById('memo-dialog');let memoDate;
document.addEventListener('click',e=>{const day=e.target.closest('[data-day]');if(day){const k=key(+day.dataset.day);expanded.has(k)?expanded.delete(k):expanded.add(k);render();}const cal=e.target.closest('[data-cal]');if(cal){selected=+cal.dataset.cal;render();openDayPopup(selected);}const sh=e.target.closest('[data-sheet]');if(sh){document.getElementById('day-popup').close();showSheet(sh.dataset.sheet);}const note=e.target.closest('[data-note]');if(note){memoDate=note.dataset.note;document.getElementById('memo-value').value=get(memoDate).memo||'';memoDialog.showModal();}});
