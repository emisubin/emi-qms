<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>오산 모바일 홈 시안</title><style>
:root{--red:#b82027;--pink:#fbefef;--text:#282c32;--muted:#7b8088;--line:#eaebee}*{box-sizing:border-box}body{margin:0;background:#f1f2f4;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:14px}button{font:inherit;cursor:pointer;color:inherit;border:0;background:none}button:focus-visible{outline:2px solid var(--red);outline-offset:2px}.app{max-width:430px;margin:auto;min-height:100dvh;background:white;padding-bottom:90px}header{height:60px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:4}header img{width:60px;height:auto}header .right{display:flex;align-items:center;gap:15px}.campus{font-size:12px;color:var(--muted)}.avatar{width:30px;height:30px;border-radius:50%;background:var(--pink);color:var(--red);font-weight:700;font-size:12px}.intro{padding:23px 20px 17px;display:flex;justify-content:space-between;align-items:center}.intro h1{font-size:22px;margin:0 0 7px;letter-spacing:-.8px}.intro p{margin:0;color:var(--muted);font-size:12px}.intro time{font-size:12px;color:var(--muted)}.urgent{margin:0 20px;display:grid;grid-template-columns:1fr 1fr;border:1px solid #f0dcdc;border-radius:12px;overflow:hidden;background:var(--pink)}.urgent button{min-height:76px;text-align:left;padding:13px 16px;display:flex;align-items:center;justify-content:space-between}.urgent button+button{border-left:1px solid #efdede}.urgent span{display:block;font-size:12px}.urgent small{display:block;font-size:10px;color:var(--muted);margin-top:5px}.urgent b{font-size:26px;color:var(--red)}.quick{display:grid;grid-template-columns:repeat(4,1fr);padding:16px 12px 18px;gap:4px}.quick button{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11px;min-height:58px;padding:6px 0}.quick svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.tabs{display:grid;grid-template-columns:repeat(4,1fr);padding:0 14px;border-bottom:1px solid var(--line);position:sticky;top:60px;z-index:3;background:#fff}.tabs button{height:47px;font-size:13px;font-weight:600;color:var(--muted);position:relative}.tabs button[aria-selected=true]{color:var(--red)}.tabs button[aria-selected=true]:after{content:'';position:absolute;bottom:0;height:3px;border-radius:2px;background:var(--red);left:17px;right:17px}.content{padding:20px}.section-head{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px}.section-head h2{font-size:15px;margin:0}.section-head button{font-size:11px;color:var(--muted);padding:8px 0 8px 10px}.chips{display:flex;gap:6px;margin-bottom:7px}.chips button{font-size:11px;padding:7px 11px;border-radius:16px;background:#f5f6f7;color:#6c7178}.chips button.active{background:var(--pink);color:var(--red)}.row{width:100%;text-align:left;display:flex;align-items:center;gap:10px;padding:15px 0;border-bottom:1px solid var(--line)}.row .body{flex:1;min-width:0}.row h3{font-size:14px;margin:5px 0 6px;font-weight:600;line-height:1.4}.part{font-weight:400;color:var(--muted);font-size:12px;margin-left:5px}.row p{font-size:12px;color:#626971;margin:0;line-height:1.5}.row small{font-size:10px;color:var(--muted)}.badge{display:inline-block;font-size:10px;color:var(--red);background:var(--pink);border-radius:4px;padding:3px 6px}.badge.blue{color:#456c96;background:#eef3f9}.chevron{color:#a2a6ac;font-size:22px}.subsection{margin-top:25px}.recent{font-size:13px}.recent small{display:block;margin-top:5px}.hint{font-size:11px;color:var(--muted);line-height:1.6;margin:14px 0 0}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:22px}.kpis button{background:#f7f8f9;border-radius:9px;padding:12px 2px;font-size:10px}.kpis b{font-size:21px;display:block;margin-top:7px}.red{color:var(--red)}.bar{height:4px;background:#eeeff1;border-radius:3px;margin:10px 0 7px}.bar i{display:block;height:100%;background:#76a98a;border-radius:3px}.between{display:flex;justify-content:space-between;gap:8px}.days{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:16px 0}.days button{border-radius:9px;height:62px;background:#f6f7f8}.days small{display:block;font-size:10px;margin-bottom:6px}.days b{font-size:18px}.days button.active{background:var(--pink);color:var(--red)}.date-heading{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}.date-heading button{font-size:11px}.dday{font-size:13px;font-weight:700;color:var(--red);white-space:nowrap}.notice-row h3{margin-top:0}.unread{font-weight:700}.news-dot{width:7px;height:7px;border-radius:50%;background:#6da580;flex-shrink:0}.floating{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));right:max(18px,calc((100vw - 430px)/2 + 18px));width:44px;height:44px;background:var(--red);color:#fff;border-radius:50%;box-shadow:0 3px 12px #b8202728;z-index:6;font-size:20px}.menu{position:fixed;bottom:78px;right:max(18px,calc((100vw - 430px)/2 + 18px));background:#fff;box-shadow:0 4px 26px #0002;border:1px solid var(--line);padding:6px;border-radius:12px;z-index:6;width:155px}.menu button{display:block;width:100%;text-align:left;padding:12px;font-size:13px}.demo-note{text-align:center;font-size:10px;color:#9a9fa5;padding:12px 0}.overlay{position:fixed;inset:0;background:#0005;z-index:9;display:flex;align-items:flex-end;justify-content:center}.sheet{width:100%;max-width:430px;background:white;border-radius:20px 20px 0 0;padding:12px 22px calc(24px + env(safe-area-inset-bottom))}.handle{width:35px;height:4px;border-radius:4px;background:#d9dce0;margin:0 auto 21px}.sheet h2{font-size:18px}.sheet p{font-size:13px;line-height:1.7;color:#666}.primary{background:var(--red);color:white;border-radius:8px;width:100%;padding:13px;margin-top:14px}[hidden]{display:none!important}
</style><div class="app"><header><img src="emi.png" alt="EMI"><div class="right"><span class="campus">오산</span><button class="avatar" data-open="내 프로필" aria-label="내 프로필">박</button></div></header><div class="intro"><div><h1>박수빈님의 업무</h1><p>담당 고객사 3곳 · 관리 프로젝트 24건</p></div><time>9.25 금</time></div><div class="urgent"><button data-urgent="request"><span>받은 요청<small>확인이 필요해요</small></span><b>3</b></button><button data-urgent="rejection"><span>반려<small>다시 확인해 주세요</small></span><b>1</b></button></div><div class="quick">
<button data-open="QR 스캔"><svg viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5M8 8h8v8H8Z"/></svg>QR 스캔</button><button data-open="프로젝트 등록"><svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></svg>프로젝트 등록</button><button data-open="진행 현황"><svg viewBox="0 0 24 24"><path d="M4 20V11M12 20V4M20 20V8"/></svg>진행 현황</button><button data-open="내 알림"><svg viewBox="0 0 24 24"><path d="M5 17h14l-2-3V9a5 5 0 0 0-10 0v5l-2 3ZM10 21h4"/></svg>내 알림</button></div><nav class="tabs" role="tablist" aria-label="홈 정보"><button role="tab" aria-selected="true" data-tab="work">내 업무</button><button role="tab" aria-selected="false" data-tab="customers">고객사 현황</button><button role="tab" aria-selected="false" data-tab="deadlines">납기 일정</button><button role="tab" aria-selected="false" data-tab="news">소식</button></nav><main class="content" id="content"></main><div class="demo-note">모바일 홈 디자인 시안 · 예시 데이터</div></div><button class="floating" aria-label="메뉴 열기" id="menu-toggle">☰</button><nav class="menu" id="menu" hidden><button data-open="홈">홈</button><button data-open="알림">알림</button><button data-open="공지사항">공지사항</button><button data-open="프로젝트">프로젝트</button><button data-open="진행 현황">진행 현황</button></nav><div class="overlay" id="overlay" hidden><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="handle"></div><h2 id="sheet-title"></h2><p id="sheet-text"></p><button class="primary" id="close">닫기</button></section></div>
<script>
let tab='work',filter='all',day=25;const tasks=[['rejection','제어반 A-102','Rack','배선검사','단자 체결 사진을 다시 확인해 주세요.','김민수 · 오늘 09:10'],['request','제어반 B-204','Box','동작검사','공정 진행을 요청했습니다.','이지훈 · 오늘 08:45'],['request','전원반 C-301','Rack','출하검사','공정 진행을 요청했습니다.','정유진 · 어제 16:30'],['request','제어반 A-105','Box','8계통','공정 진행을 요청했습니다.','김민수 · 어제 15:20']];
const head=(title,more='')=>`<div class="section-head"><h2>${title}</h2>${more?`<button data-open="${more}">전체보기 ›</button>`:''}</div>`;
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));let s='';if(tab==='work'){s=head('내가 확인할 업무')+`<div class="chips">${[['all','전체 4'],['request','받은 요청 3'],['rejection','반려 1']].map(([key,label])=>`<button data-filter="${key}" class="${filter===key?'active':''}">${label}</button>`).join('')}</div>`+tasks.filter(t=>filter==='all'||t[0]===filter).map(t=>`<button class="row" data-open="${t[1]} · ${t[3]}"><div class="body"><span class="badge ${t[0]==='request'?'blue':''}">${t[0]==='request'?'진행 요청':'반려'} · ${t[3]}</span><h3>${t[1]}<span class="part">${t[2]}</span></h3><p>${t[4]}</p><small>${t[5]}</small></div><span class="chevron">›</span></button>`).join('')+`<div class="subsection">${head('최근 확인한 프로젝트')}<button class="row recent" data-open="제어반 A-102"> <div class="body">제어반 A-102 <span class="part">Rack</span><small>미래전자 · <b>WO-260901</b></small></div><span class="chevron">›</span></button></div>`;}
if(tab==='customers'){s=`<div class="kpis">${[['관리 대상',24],['납기 초과',2],['공정 이상',1],['HOLD',3]].map(([l,n],i)=>`<button data-open="${l} 프로젝트"><span>${l}</span><b class="${i===1||i===2?'red':''}">${n}</b></button>`).join('')}</div>`+head('담당 고객사 3곳','담당 고객사 프로젝트')+[['미래전자',10,64,2],['한빛산업',8,38,0],['세림테크',6,75,0]].map(([name,n,p,late])=>`<button class="row" data-open="${name} 프로젝트"><div class="body"><div class="between"><b>${name}</b><small>프로젝트 ${n}건</small></div><div class="bar"><i style="width:${p}%"></i></div><div class="between"><small>전체 공정 진행률 ${p}%</small><small class="red">${late?'납기 초과 '+late+'건':'납기 초과 없음'}</small></div></div><span class="chevron">›</span></button>`).join('')+`<p class="hint">담당 고객사의 관리 대상 프로젝트입니다.<br>고객사를 누르면 해당 프로젝트 목록으로 이동합니다.</p>`;}
if(tab==='deadlines'){s=`<div class="date-heading"><b>2026년 9월</b><button data-open="담당 고객사 전체 납기 일정">전체 일정 ›</button></div><div class="days">${['금','토','일','월','화'].map((w,i)=>`<button data-day="${25+i}" class="${day===25+i?'active':''}"><small>${i===0?'오늘':w}</small><b>${25+i}</b></button>`).join('')}</div>`+head(`9월 ${day}일 납기`)+(day===25?`<button class="row" data-open="제어반 B-204"><div class="body"><h3>제어반 B-204<span class="part">Box</span></h3><p>한빛산업 · <b>WO-260915</b></p></div><span class="dday">D-day</span></button>`:day===28?`<button class="row" data-open="전원반 C-301"><div class="body"><h3>전원반 C-301<span class="part">Rack</span></h3><p>세림테크 · <b>WO-260918</b></p></div><span class="dday">D-3</span></button>`:`<p class="hint" style="padding:24px 0">해당 날짜에 납기인 프로젝트가 없습니다.</p>`)+`<div class="subsection">${head('놓치지 말아야 할 납기')}<button class="row" data-open="납기 초과 프로젝트 2건"><div class="body"><h3 class="red">납기 초과 2건</h3><p>아직 포장완료되지 않은 프로젝트</p></div><span class="chevron">›</span></button></div><p class="hint">담당 고객사 기준 · HOLD 및 완료 프로젝트 제외</p>`;}
if(tab==='news'){s=head('공지사항','공지사항')+[['중요','9월 업무 안내','09.25'],['','2026.09.25 업데이트 공지','09.25']].map(([b,t,d])=>`<button class="row notice-row" data-open="${t}"><div class="body"><h3>${b?`<span class="badge">${b}</span> `:''}${t}</h3><small>박수빈 · ${d}</small></div><span class="chevron">›</span></button>`).join('')+`<div class="subsection">${head('최근 진행 소식','최근 진행 소식')}${[['제어반 B-204','동작검사 Gate 완료','김민수 · 10분 전'],['제어반 A-105','배선검사 공정 이상 발생','이지훈 · 35분 전'],['전원반 C-302','입고검사 조치 완료','정유진 · 1시간 전']].map((v,i)=>`<button class="row" data-open="${v[0]} ${v[1]}"><span class="news-dot" style="${i===1?'background:var(--red)':''}"></span><div class="body"><h3>${v[0]}</h3><p>${v[1]}</p><small>${v[2]}</small></div></button>`).join('')}</div>`;}document.getElementById('content').innerHTML=s;}
let previousFocus;function openSheet(title){previousFocus=document.activeElement;document.getElementById('sheet-title').textContent=title;document.getElementById('sheet-text').textContent='실제 구현에서는 해당 업무 화면으로 연결됩니다. 지금은 모바일 홈의 배치와 이동 방식을 확인하는 시안이며, 실제 데이터는 변경되지 않습니다.';document.getElementById('overlay').hidden=false;document.getElementById('close').focus();}function closeSheet(){document.getElementById('overlay').hidden=true;previousFocus?.focus();}document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;render();}if(b.dataset.filter){filter=b.dataset.filter;render();}if(b.dataset.urgent){tab='work';filter=b.dataset.urgent;render();}if(b.dataset.day){day=Number(b.dataset.day);render();}if(b.dataset.open)openSheet(b.dataset.open);});document.getElementById('menu-toggle').onclick=()=>{document.getElementById('menu').hidden=!document.getElementById('menu').hidden;};document.getElementById('close').onclick=closeSheet;document.getElementById('overlay').onclick=e=>{if(e.target.id==='overlay')closeSheet();};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});render();
</script></html>
