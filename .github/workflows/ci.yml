name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Non-secret disposable credential used only by this workflow's PostgreSQL service.
  CI_DATABASE_PASSWORD: local_only_change_me

jobs:
  changes:
    name: Change Classification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_ci: ${{ steps.classify.outputs.run_ci }}
      run_full_stack: ${{ steps.classify.outputs.run_full_stack }}
      classification: ${{ steps.classify.outputs.classification }}
      changed_file_count: ${{ steps.classify.outputs.changed_file_count }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Classify changed files
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
            head_sha="$PR_HEAD_SHA"
          else
            base_sha="$PUSH_BASE_SHA"
            head_sha="$CURRENT_SHA"
          fi

          run_ci=true
          classification=fail-safe
          changed_file_count=0

          valid_sha='^[0-9a-f]{40}$'
          if [[ "$base_sha" =~ $valid_sha ]] \
            && [[ "$head_sha" =~ $valid_sha ]] \
            && [[ ! "$base_sha" =~ ^0+$ ]] \
            && git cat-file -e "${base_sha}^{commit}" 2>/dev/null \
            && git cat-file -e "${head_sha}^{commit}" 2>/dev/null; then
            documentation_only=true

            while IFS= read -r changed_path; do
              [[ -n "$changed_path" ]] || continue
              changed_file_count=$((changed_file_count + 1))

              case "$changed_path" in
                *.md \
                  | FILE_INVENTORY.txt \
                  | .github/ISSUE_TEMPLATE/*.yml \
                  | .github/ISSUE_TEMPLATE/*.yaml \
                  | docs/*.png | docs/*.jpg | docs/*.jpeg | docs/*.webp \
                  | docs/*.gif | docs/*.svg | docs/*.pdf | docs/*.xlsx \
                  | docs/*.csv | docs/*.json \
                  | tasks/*.png | tasks/*.jpg | tasks/*.jpeg | tasks/*.webp \
                  | tasks/*.gif | tasks/*.svg | tasks/*.pdf | tasks/*.xlsx \
                  | tasks/*.csv | tasks/*.json)
                  ;;
                *)
                  documentation_only=false
                  ;;
              esac
            done < <(git diff --name-only --diff-filter=ACDMRTUXB "$base_sha" "$head_sha")

            if [[ "$changed_file_count" -gt 0 && "$documentation_only" == "true" ]]; then
              run_ci=false
              classification=documentation-only
            else
              run_ci=true
              classification=code-or-configuration
            fi
          fi

          run_full_stack=false
          if [[ "$EVENT_NAME" == "pull_request" && "$run_ci" == "true" ]]; then
            run_full_stack=true
          fi

          {
            echo "run_ci=$run_ci"
            echo "run_full_stack=$run_full_stack"
            echo "classification=$classification"
            echo "changed_file_count=$changed_file_count"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### CI change classification"
            echo ""
            echo "- classification: \`$classification\`"
            echo "- changedFileCount: \`$changed_file_count\`"
            echo "- runCI: \`$run_ci\`"
            echo "- runFullStack: \`$run_full_stack\`"
          } >> "$GITHUB_STEP_SUMMARY"

  backend:
    name: Backend
    needs: changes
    if: ${{ needs.changes.outputs.run_ci == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_NAME: emi_qms_dev
      DATABASE_USER: emi_qms
    services:
      postgres:
        image: postgres:18.4@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
        env:
          POSTGRES_DB: emi_qms_dev
          POSTGRES_USER: emi_qms
          POSTGRES_PASSWORD: ${{ env.CI_DATABASE_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U emi_qms -d emi_qms_dev"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - name: Configure CI database password
        shell: bash
        run: echo "DATABASE_PASSWORD=${CI_DATABASE_PASSWORD}" >> "$GITHUB_ENV"
      - name: Restore
        run: dotnet restore backend/Emi.Qms.sln
      - name: Build
        run: dotnet build backend/Emi.Qms.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test backend/Emi.Qms.sln --configuration Release --no-build

  frontend:
    name: Frontend
    needs: changes
    if: ${{ needs.changes.outputs.run_ci == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.8.0 --activate
      - name: Resolve pnpm store path
        id: pnpm-cache
        shell: bash
        run: echo "store_path=$(corepack pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.pnpm-cache.outputs.store_path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install
        run: corepack pnpm install --frozen-lockfile
      - name: Lint
        run: corepack pnpm --filter emi-qms-frontend run lint
      - name: Typecheck
        run: corepack pnpm --filter emi-qms-frontend run typecheck
      - name: Test
        run: corepack pnpm --filter emi-qms-frontend test
      - name: Build
        run: corepack pnpm --filter emi-qms-frontend run build
      - name: Install Playwright browsers
        run: corepack pnpm --filter emi-qms-frontend exec playwright install --with-deps chromium
      - name: E2E
        run: corepack pnpm --filter emi-qms-frontend run e2e
      - name: Upload mock UI Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-mock-ui-${{ github.job }}
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

  full-stack-e2e:
    name: Full-Stack E2E
    needs:
      - changes
      - backend
      - frontend
    if: >-
      ${{
        !cancelled()
        && needs.changes.result == 'success'
        && needs.changes.outputs.run_full_stack == 'true'
        && needs.backend.result == 'success'
        && needs.frontend.result == 'success'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_NAME: emi_qms_dev
      DATABASE_USER: emi_qms
      E2E_DATABASE_NAME: emi_qms_e2e_ci
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.8.0 --activate
      - name: Resolve pnpm store path
        id: pnpm-cache
        shell: bash
        run: echo "store_path=$(corepack pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.pnpm-cache.outputs.store_path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Configure CI database password
        shell: bash
        run: echo "DATABASE_PASSWORD=${CI_DATABASE_PASSWORD}" >> "$GITHUB_ENV"
      - name: Write CI env file
        shell: bash
        run: |
          cat > .env <<EOF
          ASPNETCORE_ENVIRONMENT=Development
          AUTH_MODE=Dev
          Authentication__Mode=Dev
          FRONTEND_ORIGIN=http://127.0.0.1:5174
          VITE_AUTH_MODE=Dev
          VITE_API_BASE_URL=http://127.0.0.1:5081
          VITE_DEV_USER_KEY=dev-sales
          DEV_AUTHENTICATION_ENABLED=true
          DATABASE_APPLY_MIGRATIONS_ON_STARTUP=true
          DATABASE_HOST=localhost
          DATABASE_PORT=5432
          DATABASE_NAME=${DATABASE_NAME}
          DATABASE_USER=${DATABASE_USER}
          DATABASE_PASSWORD=${CI_DATABASE_PASSWORD}
          EOF
      - name: Start PostgreSQL with Docker Compose
        run: docker compose --env-file .env -f infrastructure/docker-compose.yml up -d --wait --wait-timeout 120 postgres
      - name: Verify PostgreSQL container
        run: docker compose --env-file .env -f infrastructure/docker-compose.yml ps
      - name: Install
        run: corepack pnpm install --frozen-lockfile
      - name: Restore backend
        run: dotnet restore backend/Emi.Qms.sln
      - name: Build backend
        run: dotnet build backend/Emi.Qms.sln --configuration Release --no-restore
      - name: Install Playwright browsers
        run: corepack pnpm --filter emi-qms-frontend exec playwright install --with-deps chromium
      - name: Full-stack Playwright E2E
        run: corepack pnpm --filter emi-qms-frontend run e2e:full-stack
      - name: Upload full-stack Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-full-stack-${{ github.job }}
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

  ci-gate:
    name: CI Gate
    needs:
      - changes
      - backend
      - frontend
      - full-stack-e2e
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required CI jobs
        shell: bash
        env:
          CHANGE_RESULT: ${{ needs.changes.result }}
          RUN_CI: ${{ needs.changes.outputs.run_ci }}
          RUN_FULL_STACK: ${{ needs.changes.outputs.run_full_stack }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          FULL_STACK_RESULT: ${{ needs.full-stack-e2e.result }}
        run: |
          set -euo pipefail

          failed=false

          if [[ "$CHANGE_RESULT" != "success" ]]; then
            echo "Change Classification did not succeed."
            failed=true
          fi

          if [[ "$RUN_CI" == "true" ]]; then
            if [[ "$BACKEND_RESULT" != "success" ]]; then
              echo "Backend was required but did not succeed."
              failed=true
            fi
            if [[ "$FRONTEND_RESULT" != "success" ]]; then
              echo "Frontend was required but did not succeed."
              failed=true
            fi
          fi

          if [[ "$RUN_FULL_STACK" == "true" && "$FULL_STACK_RESULT" != "success" ]]; then
            echo "Full-Stack E2E was required but did not succeed."
            failed=true
          fi

          if [[ "$failed" == "true" ]]; then
            exit 1
          fi

          echo "Required CI jobs succeeded."
