document.getElementById('search-form').onsubmit=e=>{e.preventDefault();const from=document.getElementById('from').value,to=document.getElementById('to').value;if(from&&to&&from>to){document.getElementById('message').textContent='시작일은 종료일보다 늦을 수 없습니다.';return}applied={basis:document.getElementById('date-basis').value,from,to,type:document.getElementById('type').value,q:document.getElementById('search').value.trim().toLowerCase()};document.getElementById('message').textContent='';renderList();document.getElementById('search-dialog').close()};
function renderList(){const {basis,from,to,type:ty,q}=applied;const within=d=>(!from||d>=from)&&(!to||d<=to);const matches=x=>{const text=[x.serial,x.text,x.done?x.action:''].join(' ').toLowerCase();return (ty==='all'||x.type===ty)&&(!q||text.includes(q))&&(!(from||to)||(x[basis]&&(basis!=='finish'||x.done)&&within(x[basis])))};const filtered=data.filter(matches);for(const t of ['open','done']){document.getElementById('tab-'+t).setAttribute('aria-selected',String(activeTab===t));document.getElementById('n-'+t).textContent=filtered.filter(x=>x.done===(t==='done')).length}const list=filtered.filter(x=>x.done===(activeTab==='done'));document.getElementById('period-help').textContent=(from||to)?`${basis==='date'?'발생 일자':'수리 완료일'} 기준 · ${from||'전체'} ~ ${to||'전체'}`:'기간 제한 없이 표시합니다.';document.getElementById('rows').innerHTML=list.map(x=>`<button class="mobile-record" onclick="choose(${x.id})"><div class="record-top"><strong>${esc(x.serial)}</strong><span class="record-type">${x.type} 불량</span><span class="status ${x.done?'done':''}">${x.done?'수리 완료':'미완료'}</span></div><div class="record-bottom"><p>${esc(x.text)}</p></div></button>`).join('')||'<p class="no-results">조회 결과가 없습니다.</p>';document.getElementById('count').textContent=list.length+'건';if(!list.some(x=>x.id===selected))selected=list[0]?.id;renderDetail()};function choose(id){selected=id;renderList();if(!recordDialog.open)recordDialog.showModal()};function renderDetail(){const x=current();document.getElementById('detail').innerHTML=x?`<div class="record-meta"><div><label>시리얼 넘버</label><strong>${esc(x.serial)}</strong></div><div><label>상태</label><span class="status ${x.done?'done':''}">${x.done?'수리 완료':'미완료'}</span></div><div><label>발생 유형</label><span>${x.type} 불량</span></div></div><section class="quality-section"><div class="sectionhead"><h3>1차 · 부적합 정보</h3><div class="section-actions"><span class="section-date">발생 일자 <b>${x.date.replaceAll('-','.')}</b></span><div class="buttons"><button onclick="openEditor('edit')">수정</button><button onclick="removeInfo('first')">삭제</button></div></div></div><div class="quality-content"><label class="content-label">부적합 내용</label><p class="bodytext">${esc(x.text)}</p><label class="content-label">부적합 사진</label><div class="photos">${photo('부적합 사진 1')}${photo('부적합 사진 2')}</div></div></section><section class="quality-section"><div class="sectionhead"><h3>2차 · 조치 정보</h3><div class="section-actions"><span class="section-date">수리 완료일 <b>${x.done?x.finish.replaceAll('-','.'):'—'}</b></span>${x.done?'<div class="buttons"><button onclick="openEditor(\'action\')">수정</button><button onclick="removeInfo(\'second\')">삭제</button></div>':''}</div></div><div class="quality-content">${x.done?`<label class="content-label">조치 내용</label><p class="bodytext">${esc(x.action)}</p><label class="content-label">조치 사진</label><div class="photos">${photo('조치 사진 1')}</div>`:'<div class="empty"><span>아직 조치 정보가 등록되지 않았습니다.</span><button class="primary" onclick="openEditor(\'action\')">조치 등록</button></div>'}</div></section>`:'<p class="quiet">조회할 제품을 선택해 주세요.</p>'};function openEditor(m){document.getElementById('input-menu').close();mode=m;const x=current(),a=m==='action',editing=m==='edit';document.getElementById('formtitle').textContent=a?'조치 정보 '+(x.done?'수정':'등록'):m==='initial'?'초기 재고 등록':editing?'부적합 정보 수정':'부적합 등록';document.getElementById('fields').innerHTML=a?`<p class="info">${esc(x.serial)}</p><label class="field">수리 완료일<input name="date" type="date" value="${x.done?x.finish:'2026-10-12'}" required></label><label class="field">조치 내용<textarea name="text" required>${x.done?esc(x.action):''}</textarea></label>`:`<div class="twocol"><label class="field">시리얼 넘버<input name="serial" value="${editing?esc(x.serial):''}" required></label><label class="field">발생 일자<input name="date" type="date" value="${editing?x.date:'2026-10-12'}" required></label></div><label class="field">발생 유형<select name="type"><option value="생산팀" ${editing&&x.type==='생산팀'?'selected':''}>생산팀 불량</option><option value="협력사" ${editing&&x.type==='협력사'?'selected':''}>협력사 불량</option></select></label><label class="field">부적합 내용<textarea name="text" required>${editing?esc(x.text):''}</textarea></label>`;document.getElementById('fields').innerHTML+=`<label class="field">${a?'조치':'부적합'} 사진 · 필수<input type="file" accept="image/*" multiple ${editing||(a&&x.done)?'':'required'}></label><p class="info">${a?'저장하면 수리 완료로 처리됩니다.':'제품 한 대의 부적합 내용을 모아서 작성해 주세요.'} 시안에서는 실제 데이터가 저장되지 않습니다.</p>`;editor.showModal()};document.getElementById('form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),x=current();if(mode==='action'){x.action=f.get('text');x.finish=f.get('date');x.done=true;activeTab='done';document.getElementById('type').value='all';document.getElementById('search').value='';const fdate=document.getElementById('from'),tdate=document.getElementById('to');if(fdate.value>x.finish)fdate.value=x.finish;if(tdate.value<x.finish)tdate.value=x.finish;recordDialog.close()}else if(mode==='edit'){Object.assign(x,{serial:f.get('serial'),date:f.get('date'),type:f.get('type'),text:f.get('text')})}else{selected=Date.now();data.push({id:selected,serial:f.get('serial'),date:f.get('date'),type:f.get('type'),text:f.get('text'),done:false});activeTab='open'}editor.close();resetSearch();document.getElementById('message').textContent='시안에 반영했습니다. 조치 저장 시 수리 완료 탭에서 확인할 수 있습니다.'};function removeInfo(which){const x=current(),blocked=which==='first'&&x.done;document.getElementById('confirmtitle').textContent=blocked?'조치 정보를 먼저 삭제해 주세요':which==='first'?'부적합 정보 삭제':'조치 정보 삭제';document.getElementById('confirmtext').textContent=blocked?'2차 조치 정보가 있는 경우 1차 부적합 정보를 삭제할 수 없습니다.':which==='first'?'부적합 정보가 목록과 집계에서 제외됩니다. 삭제 이력은 3개월간 보관됩니다.':'조치 정보를 삭제하면 미완료로 돌아가고 부적합 재고에 포함됩니다. 삭제 이력은 3개월간 보관됩니다.';const b=document.getElementById('confirmbtn');b.textContent=blocked?'확인':'삭제';b.onclick=()=>{if(!blocked){if(which==='second'){x.done=false;activeTab='open';syncBasis();recordDialog.close();}else data.splice(data.indexOf(x),1);renderList()}confirmDialog.close()};confirmDialog.showModal()};renderList();
</script></html>
