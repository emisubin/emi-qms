<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111111" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/emi-qms-192.png" />
    <title>EMI PMS</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; background: #fafafa; color: #1a1a1a; }
      main { display: grid; min-height: 100vh; place-items: center; padding: clamp(20px, 5vw, 64px); }
      .launcher { width: min(100%, 680px); overflow: hidden; border: 1px solid #d0d0d0; border-radius: 10px; background: #fff; }
      .launcher-header { display: flex; align-items: center; gap: 13px; border-bottom: 1px solid #e4e4e4; padding: 16px 18px; }
      .launcher-header img { width: 44px; height: 44px; flex: 0 0 auto; border: 1px solid #d0d0d0; background: #fff; object-fit: cover; }
      .launcher-header p, .launcher-header strong { display: block; margin: 0; }
      .launcher-header strong { font-size: 14px; font-weight: 700; }
      .launcher-header p { margin-top: 2px; color: #757575; font-size: 11px; }
      .content { display: grid; gap: 18px; padding: clamp(24px, 5vw, 40px); }
      .eyebrow { margin: 0; color: #757575; font-size: 11px; font-weight: 600; letter-spacing: .04em; }
      h1 { margin: 0; font-size: clamp(30px, 7vw, 42px); font-weight: 650; letter-spacing: -.04em; line-height: 1; }
      .description { margin: 0; color: #555; font-size: 14px; line-height: 1.65; }
      .open-link { display: grid; min-height: 46px; place-items: center; border: 1px solid #111; border-radius: 6px; background: #111; color: #fff; font-size: 13px; font-weight: 650; text-decoration: none; }
      .open-link:hover { background: #2b2b2b; }
      .open-link:focus-visible { outline: 2px solid #111; outline-offset: 3px; }
      .notice { border: 1px solid #e4e4e4; border-radius: 6px; background: #fafafa; padding: 12px 14px; }
      .notice strong, .notice span { display: block; }
      .notice strong { margin-bottom: 4px; font-size: 12px; }
      .notice span { color: #555; font-size: 11px; line-height: 1.55; }
      @media (max-width: 720px) {
        main { place-items: start stretch; padding: 16px 14px calc(16px + env(safe-area-inset-bottom)); }
        .launcher { width: 100%; }
        .launcher-header { padding: 14px; }
        .launcher-header img { width: 40px; height: 40px; }
        .content { gap: 16px; padding: 24px 18px; }
        h1 { font-size: 32px; }
      }
    </style>
    <script defer src="/teams-launcher.js"></script>
  </head>
  <body>
    <main>
      <section class="launcher">
        <header class="launcher-header" aria-label="EMI 브랜드">
          <img src="/icons/emi-qms-192.png" alt="EMI" />
          <div>
            <strong>EMI PMS</strong>
            <p>EMI 프로젝트 통합관리시스템</p>
          </div>
        </header>
        <div class="content">
          <p class="eyebrow">EMI 프로젝트 통합관리시스템</p>
          <h1>EMI PMS</h1>
          <p class="description">Teams에서는 알림을 받고, 실제 업무는 Microsoft 365 인증으로 보호된 EMI PMS 웹 또는 설치 앱에서 진행합니다.</p>
          <a id="open-emi-pms" class="open-link" href="/" target="_blank" rel="noopener noreferrer">EMI PMS 열기</a>
          <div class="notice" role="note">
            <strong>보호된 새 창에서 열립니다.</strong>
            <span id="launch-destination">회사 Microsoft 365 계정으로 인증한 뒤 권한에 맞는 화면으로 이동합니다.</span>
          </div>
          <noscript><p class="description">JavaScript가 꺼져 있어 알림 상세 위치를 복원할 수 없습니다. 위 버튼으로 EMI PMS 홈을 열어 주세요.</p></noscript>
        </div>
      </section>
    </main>
  </body>
</html>
